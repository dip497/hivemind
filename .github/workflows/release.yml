name: release

# Tag-driven release. Push a tag like `v0.1.0` and this workflow:
#   1. builds the CLI single-binary (`bun build --compile`)
#   2. builds the renderer + Electron main (electron-vite)
#   3. packages the AppImage (electron-builder --linux AppImage)
# and, in a parallel job on a macOS arm64 runner, the same two artifacts for
# Apple Silicon (`hive-darwin-arm64` + an ad-hoc-signed `hivemind.app` zip).
# A final `publish` job downloads both jobs' assets and creates the GitHub
# Release from the tag.
#
# Triggered automatically by `git tag v0.1.0 && git push origin v0.1.0`,
# or manually via the "Run workflow" button (uses the workflow_dispatch input).
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag/version to publish (e.g. v0.1.0)"
        required: true
        default: "v0.0.1"
      publish:
        description: "Create the GitHub Release? 'false' = build the assets only (use this to smoke-test a platform's build)"
        required: false
        default: "false"
        type: string

permissions:
  contents: write  # needed to create releases + upload assets

jobs:
  build-linux:
    name: build linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # version pinned via `packageManager` in package.json (avoid dupes)
          run_install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: pnpm install (workspace)
        run: pnpm install --frozen-lockfile

      - name: Build CLI single-binary
        run: pnpm --filter @hivemind/cli run build
      # DO NOT `strip` the CLI binary. `bun build --compile` appends the JS bundle
      # to the executable with a trailer; `strip` corrupts that trailer and the
      # binary silently degrades to raw Bun (hive --version → bun's version, hive
      # init → "Start an empty Bun project"). It broke EVERY hive subcommand
      # in v1.10.6/1.10.7 for ~1MB of savings. Never re-add it.

      - name: Smoke-test the compiled daemon
        working-directory: apps/cli
        run: HIVE_BIN="$PWD/dist/hive" bun test tests/sessions.test.ts

      - name: Build renderer + main
        run: pnpm --filter @hivemind/desktop run build

      - name: pnpm deploy (materialize workspace deps for electron-builder)
        # electron-builder rejects workspace symlinks that point outside the
        # app dir (it expects every node_module to live under apps/desktop/).
        # `pnpm deploy` copies the package + all transitive deps (including
        # other workspace packages, dereferenced) into a self-contained dir.
        # NOT --prod: electron itself is a devDependency in apps/desktop, and
        # electron-builder needs it installed in the deploy dir to read the
        # version it should bundle ("Cannot compute electron version" otherwise).
        run: pnpm --filter @hivemind/desktop deploy --legacy desktop-deploy

      - name: Copy build output into deploy
        # electron-vite emits to apps/desktop/out — the deploy copy has only
        # source. The AppImage just needs `out/**/*` + package.json (per the
        # `build.files` config).
        run: |
          cp -r apps/desktop/out desktop-deploy/
          # electron-builder reads linux.icon (icons/icon.png) from the deploy dir.
          cp -r apps/desktop/icons desktop-deploy/

      - name: Package AppImage
        # Run electron-builder INSIDE the deployed copy so node_modules are
        # all under the app dir (no more "package.json must be under …" error).
        run: |
          cd desktop-deploy
          npx --yes electron-builder --linux AppImage \
            --config.directories.output=dist-electron
        env:
          DEBUG: electron-builder

      - name: Stage release artifacts
        id: stage
        run: |
          set -euo pipefail
          mkdir -p release-assets
          # CLI single-binary
          cp apps/cli/dist/hive release-assets/hive-linux-x86_64
          chmod +x release-assets/hive-linux-x86_64
          # AppImage (electron-builder names it from package.json version)
          appimage=$(ls -1 desktop-deploy/dist-electron/*.AppImage 2>/dev/null | head -1)
          test -n "$appimage" || { echo "no AppImage built"; exit 1; }
          cp "$appimage" release-assets/
          ls -la release-assets/
          echo "assets_dir=release-assets" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts (workflow result)
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: release-assets/

  # CLI only: an arm64 Linux box is a remote machine (`hive daemon`), not a desktop.
  # Not yet proven on a release, so a failure here ships the release without it.
  build-linux-arm64:
    name: build linux arm64 cli
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: pnpm install (workspace)
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"

      - name: Build CLI single-binary
        run: pnpm --filter @hivemind/cli run build

      - name: Smoke-test the compiled daemon
        working-directory: apps/cli
        run: |
          file dist/hive | grep -q aarch64
          HIVE_BIN="$PWD/dist/hive" bun test tests/sessions.test.ts

      - name: Stage release artifacts
        run: |
          mkdir -p release-assets
          cp apps/cli/dist/hive release-assets/hive-linux-arm64
          chmod +x release-assets/hive-linux-arm64

      - name: Upload artifacts (workflow result)
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64
          path: release-assets/

  build-macos:
    name: build macos arm64
    runs-on: macos-14  # Apple Silicon runner
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: pnpm install (workspace)
        run: pnpm install --frozen-lockfile

      - name: Build CLI single-binary
        # `bun build --compile` with no --target compiles for the HOST, so this
        # produces a darwin-arm64 binary here and a linux-x64 one in build-linux.
        # (Never `strip` it — see the linux job.)
        run: pnpm --filter @hivemind/cli run build

      - name: Build renderer + main
        run: pnpm --filter @hivemind/desktop run build

      - name: pnpm deploy (materialize workspace deps for electron-builder)
        run: pnpm --filter @hivemind/desktop deploy --legacy desktop-deploy

      - name: Copy build output into deploy
        run: |
          cp -r apps/desktop/out desktop-deploy/
          cp -r apps/desktop/icons desktop-deploy/

      - name: Package .app + ad-hoc sign + zip
        # electron-builder is told to emit a bare `dir` (the .app) and to SKIP
        # signing (`mac.identity: null` — we have no Apple Developer cert).
        # But an arm64 bundle with an INVALID signature is SIGKILLed by the
        # kernel, and electron-builder's repacking invalidates the ad-hoc
        # signature Electron ships with. So we re-apply an ad-hoc signature
        # (`--sign -`) ourselves, then archive with `ditto` (NOT `zip`: ditto
        # preserves the framework symlinks and resource forks inside the
        # bundle). Users still get a Gatekeeper quarantine prompt on first
        # launch — install.sh strips the quarantine xattr.
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/desktop/package.json').version")
          cd desktop-deploy
          npx --yes electron-builder --mac dir \
            --config.directories.output=dist-electron
          app=$(ls -d dist-electron/*/hivemind.app 2>/dev/null | head -1)
          test -n "$app" || { echo "no .app built"; exit 1; }
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict "$app"
          cd ..
          mkdir -p release-assets
          ditto -c -k --sequesterRsrc --keepParent \
            "desktop-deploy/$app" "release-assets/hivemind-${version}-arm64-mac.zip"
        env:
          DEBUG: electron-builder

      - name: Stage release artifacts
        run: |
          set -euo pipefail
          cp apps/cli/dist/hive release-assets/hive-darwin-arm64
          chmod +x release-assets/hive-darwin-arm64
          ls -la release-assets/

      - name: Verify the bundle is arm64 and signed
        # The .app carries a HOST-arch @lydell/node-pty, and the CLI is compiled
        # for the host — so anything built on the wrong runner would ship a
        # binary that dies on launch with no build error. Assert instead.
        run: |
          set -euo pipefail
          app=$(ls -d desktop-deploy/dist-electron/*/hivemind.app | head -1)
          for bin in release-assets/hive-darwin-arm64 \
                     "$app/Contents/MacOS/hivemind" \
                     $(find "$app" -name '*.node'); do
            archs=$(lipo -archs "$bin")
            echo "$archs  $bin"
            case " $archs " in *" arm64 "*) ;; *) echo "NOT arm64: $bin"; exit 1 ;; esac
          done
          # `codesign --verify` above proves the signature is INTERNALLY valid;
          # this proves the bundle is actually signed (ad-hoc = no Authority).
          codesign -dv "$app" 2>&1 | grep -q "Signature=adhoc" || { echo "bundle is not ad-hoc signed"; exit 1; }

      - name: Upload artifacts (workflow result)
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: release-assets/

  build-windows:
    name: build windows x64
    runs-on: windows-latest
    timeout-minutes: 40
    # Published, but never blocking: the smoke steps below run the build (CLI, a ConPTY
    # spawn, a bare .cmd agent, the app opening its pipe, a hook through cmd.exe), and a
    # Windows failure ships the release without its assets rather than holding Linux and
    # macOS back.
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: pnpm install (workspace)
        run: pnpm install --frozen-lockfile

      - name: Syntax-check install.ps1
        # The only Windows host in the project. A parse error here would
        # otherwise surface as a broken one-liner on a user's machine.
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("install.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors | ForEach-Object { Write-Host $_ }; exit 1 }
          Write-Host "install.ps1 parses"

      - name: Build CLI single-binary
        run: pnpm --filter @hivemind/cli run build

      - name: Build renderer + main
        run: pnpm --filter @hivemind/desktop run build

      - name: pnpm deploy (materialize workspace deps for electron-builder)
        run: pnpm --filter @hivemind/desktop deploy --legacy desktop-deploy

      - name: Copy build output into deploy
        shell: pwsh
        run: |
          Copy-Item -Recurse -Force apps/desktop/out desktop-deploy/
          Copy-Item -Recurse -Force apps/desktop/icons desktop-deploy/

      - name: Package zip
        # No code signing: an Authenticode cert costs money and we have none, so
        # users get a SmartScreen prompt on first run. Documented in install.ps1.
        shell: pwsh
        run: |
          cd desktop-deploy
          npx --yes electron-builder --win zip --config.directories.output=dist-electron

      - name: Verify the bundle is x64 with a win32 pty
        # Same class of check as the macOS job: nothing fails the build when the
        # native module is missing or the wrong arch, it just dies on a user's
        # machine. The inventory prints FIRST so a failure says what IS in the
        # bundle instead of only what isn't — which is how the first version of
        # this step was caught asserting the POSIX filename.
        shell: pwsh
        run: |
          $app = Get-ChildItem desktop-deploy/dist-electron -Recurse -Filter hivemind.exe | Select-Object -First 1
          if (-not $app) { throw "no hivemind.exe produced" }
          Write-Host "app: $($app.FullName)"

          Write-Host "`n--- native modules in the bundle ---"
          Get-ChildItem desktop-deploy/dist-electron -Recurse -Include *.node,*.dll,*winpty*.exe -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.FullName.Replace((Get-Location).Path, ''))" }

          Write-Host "`n--- node-pty packages pnpm installed ---"
          Get-ChildItem desktop-deploy/node_modules/@lydell -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  $($_.Name)" }
          Get-ChildItem desktop-deploy/node_modules/@lydell -Recurse -Filter pty.node -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "  prebuild: $($_.FullName.Replace((Get-Location).Path, ''))" }

          Write-Host "`n--- asar contents (node-pty) ---"
          $asar = Join-Path $app.Directory "resources\app.asar"
          if (Test-Path $asar) {
            npx --yes @electron/asar list $asar 2>$null | Select-String "node-pty" | Select-Object -First 20 |
              ForEach-Object { Write-Host "  $_" }
          }

          # Windows has no pty.node — that is the POSIX name. node-pty drives
          # ConPTY here, so the binaries are conpty.node plus conpty.dll, and
          # BOTH have to be outside the asar: a .dll is not covered by
          # electron-builder's implicit native-module unpacking, and ConPTY
          # cannot LoadLibrary out of an archive.
          $need = @{ "conpty.node" = $null; "conpty.dll" = $null }
          foreach ($name in @($need.Keys)) {
            $need[$name] = Get-ChildItem desktop-deploy/dist-electron -Recurse -Filter $name -ErrorAction SilentlyContinue |
                           Where-Object { $_.FullName -match "win32-x64" -and $_.FullName -match "unpacked" } |
                           Select-Object -First 1
          }
          $missing = @($need.Keys | Where-Object { -not $need[$_] })
          if ($missing) { throw "not unpacked in the bundle: $($missing -join ', ') - the terminal would be dead" }
          foreach ($name in @($need.Keys)) { Write-Host "ok: $($need[$name].FullName)" }

      - name: "Smoke: the compiled CLI runs"
        # The Linux jobs go further (sessions.test.ts against the binary); here
        # the binary is at least executed, so a broken compile cannot ship.
        shell: pwsh
        run: |
          $cli = Get-ChildItem apps/cli/dist -Filter hive*.exe | Select-Object -First 1
          if (-not $cli) { throw "no hive exe built: $((Get-ChildItem apps/cli/dist | ForEach-Object Name) -join ', ')" }
          $v = (& $cli.FullName --version) -join " "
          Write-Host "hive --version: $v"
          if (-not $v) { throw "hive --version printed nothing" }

      - name: "Smoke: ConPTY echo through the packaged node-pty"
        # ELECTRON_RUN_AS_NODE turns the app's own binary into the exact node
        # runtime pty-host uses, so a ConPTY round-trip here is the closest a
        # CI box comes to opening a terminal tile. hivemind.exe is a
        # GUI-subsystem exe: Start-Process -Wait, output redirected to files.
        shell: pwsh
        run: |
          $electron = Get-ChildItem desktop-deploy/dist-electron -Recurse -Filter hivemind.exe | Select-Object -First 1
          if (-not $electron) { throw "no unpacked hivemind.exe" }
          $js = @'
          const pty = require(process.env.PTY_DIR);
          const p = pty.spawn("cmd.exe", '/d /s /c "echo HIVE_OK"', {
            name: "smoke", cols: 80, rows: 24, cwd: process.env.RUNNER_TEMP, env: process.env,
          });
          let out = "";
          p.onData((d) => { out += d; });
          p.onExit(() => {
            console.log("pty output:", JSON.stringify(out));
            process.exit(out.includes("HIVE_OK") ? 0 : 1);
          });
          '@
          Set-Content -Path "$env:RUNNER_TEMP\pty-smoke.js" -Value $js -Encoding UTF8
          # The asar copy is what the packaged app actually loads; electron's
          # require redirects the native binding to app.asar.unpacked itself.
          $asar = Join-Path $electron.Directory.FullName "resources\app.asar"
          $env:PTY_DIR = if (Test-Path $asar) { "$asar/node_modules/@lydell/node-pty" } else { "$PWD/desktop-deploy/node_modules/@lydell/node-pty" }
          $env:ELECTRON_RUN_AS_NODE = "1"
          $p = Start-Process -FilePath $electron.FullName -ArgumentList "`"$env:RUNNER_TEMP\pty-smoke.js`"" -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput "$env:RUNNER_TEMP\pty-out.txt" -RedirectStandardError "$env:RUNNER_TEMP\pty-err.txt"
          Get-Content "$env:RUNNER_TEMP\pty-out.txt"; Get-Content "$env:RUNNER_TEMP\pty-err.txt"
          Remove-Item Env:\ELECTRON_RUN_AS_NODE
          if ($p.ExitCode -ne 0) { throw "ConPTY echo did not produce HIVE_OK" }

      - name: "Smoke: a bare agent name resolves to its .cmd shim and runs"
        # resolveWindowsSpawn is the last thing pty-host/pty-daemon call before
        # node-pty; on the runner it runs against a REAL win32 PATH and a real
        # shim, and the wrapped command line is driven through the same pty.
        shell: pwsh
        run: |
          bun build packages/hive-agents/src/discover.ts --outfile "$env:RUNNER_TEMP/discover.cjs" --format=cjs --target=node
          $bin = "$env:RUNNER_TEMP\fakebin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null
          Set-Content -Path "$bin\fakeagent.cmd" -Value "@echo FAKE_OK" -Encoding ASCII
          $js = @'
          const { resolveWindowsSpawn } = require(process.env.DISCOVER_CJS);
          const pty = require(process.env.PTY_DIR);
          const env = { ...process.env };
          delete env.PATH;
          env.Path = process.env.FAKE_PATH; // Windows casing on purpose
          const r = resolveWindowsSpawn("fakeagent", [], env);
          console.log("resolved:", JSON.stringify(r));
          if (!(typeof r.args === "string" && /cmd\.exe$/i.test(r.file) && /fakeagent\.cmd/i.test(r.args))) {
            console.error("not a cmd.exe-wrapped .cmd shim");
            process.exit(1);
          }
          const p = pty.spawn(r.file, r.args, { name: "smoke", cols: 80, rows: 24, cwd: process.env.RUNNER_TEMP, env });
          let out = "";
          p.onData((d) => { out += d; });
          p.onExit(() => {
            console.log("pty output:", JSON.stringify(out));
            process.exit(out.includes("FAKE_OK") ? 0 : 1);
          });
          '@
          Set-Content -Path "$env:RUNNER_TEMP\shim-smoke.js" -Value $js -Encoding UTF8
          $electron = Get-ChildItem desktop-deploy/dist-electron -Recurse -Filter hivemind.exe | Select-Object -First 1
          $asar = Join-Path $electron.Directory.FullName "resources\app.asar"
          $env:PTY_DIR = if (Test-Path $asar) { "$asar/node_modules/@lydell/node-pty" } else { "$PWD/desktop-deploy/node_modules/@lydell/node-pty" }
          $env:DISCOVER_CJS = "$env:RUNNER_TEMP\discover.cjs"
          $env:FAKE_PATH = "$bin;$env:Path"
          $env:ELECTRON_RUN_AS_NODE = "1"
          $p = Start-Process -FilePath $electron.FullName -ArgumentList "`"$env:RUNNER_TEMP\shim-smoke.js`"" -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput "$env:RUNNER_TEMP\shim-out.txt" -RedirectStandardError "$env:RUNNER_TEMP\shim-err.txt"
          Get-Content "$env:RUNNER_TEMP\shim-out.txt"; Get-Content "$env:RUNNER_TEMP\shim-err.txt"
          Remove-Item Env:\ELECTRON_RUN_AS_NODE
          if ($p.ExitCode -ne 0) { throw "fakeagent did not resolve and run through the shim path" }

      - name: "Smoke: the app boots and opens its named pipe"
        # The hcp control plane and the pty daemon live on \\.\pipe\hivemind-*
        # (hive-core ipcPath) — if the pipe never appears, every agent tile and
        # hive ctl call is dead on arrival. Booted against a scratch user-data
        # dir, and stopped BY PID: the daemon it detaches is also hivemind.exe,
        # and nothing here may kill by name.
        shell: pwsh
        run: |
          $electron = Get-ChildItem desktop-deploy/dist-electron -Recurse -Filter hivemind.exe | Select-Object -First 1
          if (-not $electron) { throw "no unpacked hivemind.exe" }
          $p = Start-Process -FilePath $electron.FullName -ArgumentList "--user-data-dir=$env:RUNNER_TEMP\ud" -PassThru
          $pipe = $null
          foreach ($i in 1..60) {
            Start-Sleep -Seconds 1
            if ($p.HasExited) { break }
            $pipe = [System.IO.Directory]::GetFiles("\\.\pipe\") |
                    Where-Object { $_ -like "*hivemind-*" } |
                    Select-Object -First 1
            if ($pipe) { break }
          }
          if ($pipe) { Write-Host "pipe appeared: $pipe" }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $pipe) {
            $code = if ($p.HasExited) { $p.ExitCode } else { "still running" }
            throw "no \\\\.\pipe\hivemind-* appeared within 60s (app: $code)"
          }

      - name: "Smoke: hook commands render and run through cmd.exe"
        # The hooks wiring renders a PowerShell -EncodedCommand on win32; driven through
        # cmd.exe exactly as an agent's own shell would, this proves the encoded script,
        # the env vars and the stdin hand-off all reach the hook process.
        shell: pwsh
        run: |
          bun build packages/hive-agents/src/hooks.ts --outfile "$env:RUNNER_TEMP/hooks.cjs" --format=cjs --target=node
          $hook = @'
          const fs = require("fs");
          let input = "";
          process.stdin.on("data", (d) => { input += d; });
          process.stdin.on("end", () => {
            fs.writeFileSync(process.env.HOOK_OUT, JSON.stringify({ env: process.env.HIVEMIND_TILE, stdin: input.trim() }));
          });
          '@
          Set-Content -Path "$env:RUNNER_TEMP\hook-smoke.cjs" -Value $hook -Encoding UTF8
          $js = @'
          const { hookCommand } = require(process.env.HOOKS_CJS);
          const env = { ...(process.env.SystemRoot ? { SystemRoot: process.env.SystemRoot } : {}) };
          const cmd = hookCommand("stop", { path: process.env.HOOK_SCRIPT }, {
            tileId: "tile-smoke", cwd: process.env.RUNNER_TEMP, args: [], env, phase: "spawn", platform: "win32",
            paths: {
              private: process.env.RUNNER_TEMP, execPath: process.execPath, hooks: {},
              tileSessionsDir: process.env.RUNNER_TEMP, home: process.env.RUNNER_TEMP,
            },
          });
          console.log(cmd);
          '@
          Set-Content -Path "$env:RUNNER_TEMP\render-smoke.js" -Value $js -Encoding UTF8
          $electron = Get-ChildItem desktop-deploy/dist-electron -Recurse -Filter hivemind.exe | Select-Object -First 1
          if (-not $electron) { throw "no unpacked hivemind.exe" }
          $env:HOOKS_CJS = "$env:RUNNER_TEMP\hooks.cjs"
          $env:HOOK_SCRIPT = "$env:RUNNER_TEMP\hook-smoke.cjs"
          $env:HOOK_OUT = "$env:RUNNER_TEMP\hook-out.json"
          $env:ELECTRON_RUN_AS_NODE = "1"
          $p = Start-Process -FilePath $electron.FullName -ArgumentList "`"$env:RUNNER_TEMP\render-smoke.js`"" -Wait -PassThru -NoNewWindow `
            -RedirectStandardOutput "$env:RUNNER_TEMP\render-out.txt" -RedirectStandardError "$env:RUNNER_TEMP\render-err.txt"
          Get-Content "$env:RUNNER_TEMP\render-out.txt"; Get-Content "$env:RUNNER_TEMP\render-err.txt"
          Remove-Item Env:\ELECTRON_RUN_AS_NODE
          if ($p.ExitCode -ne 0) { throw "rendering the hook command failed" }
          $cmd = (Get-Content "$env:RUNNER_TEMP\render-out.txt" -Raw).Trim()
          if ($cmd -notmatch '-EncodedCommand [A-Za-z0-9+/=]+$') { throw "not an encoded hook command: $cmd" }
          if ($cmd -match '["''$]') { throw "hook command carries quoting metacharacters" }
          if ($cmd -match '\\') { throw "hook command carries a backslash" }

          Remove-Item "$env:RUNNER_TEMP\hook-out.json" -ErrorAction SilentlyContinue
          $psi = New-Object System.Diagnostics.ProcessStartInfo
          $psi.FileName = $env:ComSpec
          $psi.Arguments = "/c $cmd"
          $psi.UseShellExecute = $false
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $c = [System.Diagnostics.Process]::Start($psi)
          $c.StandardInput.Write('{"ok":1}')
          $c.StandardInput.Close()
          $null = $c.StandardOutput.ReadToEndAsync(); $null = $c.StandardError.ReadToEndAsync()
          if (-not $c.WaitForExit(60000)) { throw "hook command timed out" }
          if ($c.ExitCode -ne 0) { throw "hook command exited $($c.ExitCode)" }
          $got = Get-Content "$env:RUNNER_TEMP\hook-out.json" -Raw | ConvertFrom-Json
          if ($got.env -ne 'tile-smoke') { throw "HIVEMIND_TILE did not reach the hook: '$($got.env)'" }
          if ($got.stdin -ne '{"ok":1}') { throw "stdin did not reach the hook: '$($got.stdin)'" }
          Write-Host "hook saw HIVEMIND_TILE=$($got.env) and stdin=$($got.stdin)"

      - name: Stage release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          $cli = Get-ChildItem apps/cli/dist -Filter "hive*" | Where-Object { -not $_.PSIsContainer } | Select-Object -First 1
          if (-not $cli) { throw "no CLI binary produced" }
          Copy-Item $cli.FullName release-assets/hive-windows-x64.exe
          $zip = Get-ChildItem desktop-deploy/dist-electron -Filter *.zip | Select-Object -First 1
          if (-not $zip) { throw "no app zip produced" }
          Copy-Item $zip.FullName release-assets/
          Get-ChildItem release-assets

      - name: Upload artifacts (workflow result)
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: release-assets/

  publish:
    name: publish github release
    needs: [build-linux, build-linux-arm64, build-macos, build-windows]
    # A tag push always publishes. A MANUAL run only publishes when it explicitly
    # asks to — the default is build-only, so dispatching to smoke-test a build
    # can never cut an accidental release.
    if: github.event_name != 'workflow_dispatch' || inputs.publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten
        run: |
          set -euo pipefail
          mkdir -p release-assets
          find artifacts -type f -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          # Windows assets are built but NOT listed here — see build-windows.
          files: |
            release-assets/hive-linux-x86_64
            release-assets/hive-linux-arm64
            release-assets/hive-darwin-arm64
            release-assets/*.AppImage
            release-assets/*-mac.zip
            release-assets/hive-windows-x64.exe
            release-assets/*-win.zip
