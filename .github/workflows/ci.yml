name: ci

# Lightweight CI on every push to main + PRs targeting main.
# Heavier e2e (Playwright + xvfb) is intentionally NOT run here yet — the
# release workflow validates the full build path. CI focuses on the fast
# signals that catch most regressions in <2 minutes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          # version pinned via `packageManager` in package.json (avoid dupes)
          run_install: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (every package)
        run: pnpm typecheck

      - name: Build (renderer + main + CLI)
        run: pnpm -r --parallel build

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/hive-net/target
          key: hive-net-${{ runner.os }}-${{ hashFiles('crates/hive-net/Cargo.lock') }}

      - name: Build hive-net (the daemon client's tests run it)
        run: rustup update stable --no-self-update && rustup default stable && cargo build --locked --manifest-path crates/hive-net/Cargo.toml

      - name: Unit tests (desktop)
        # After hive-net's build: the daemon client's test under Node runs it.
        run: pnpm --filter @hivemind/desktop run test:unit

      - name: Unit tests (packages and CLI)
        # Every package's own tests: the workspace store, settings.json and its lock, agent
        # discovery, the view SDK, the agent host, the CLI (`bun test`), and the host's domains
        # (under Node, as the app runs them).
        run: pnpm test

      - name: Installer platform matrix
        # Cheap guard on the install.sh ↔ release.yml contract: the asset names
        # the installer asks for must match the ones the release uploads.
        run: bash scripts/install-plan-test.sh

      - name: Installer macOS path
        # Runs install.sh's Darwin helpers against a fake .app (ditto/xattr/pkill
        # shimmed), so the mac install/uninstall path is covered on this ubuntu box.
        run: bash scripts/install-macos-test.sh

  hive-net:
    # The Rust network crate (R10): its CLI end to end, on the local network and through a relay.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/hive-net
    steps:
      - uses: actions/checkout@v4

      - name: Rust (stable)
        run: rustup update stable --no-self-update && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/hive-net/target
          key: hive-net-${{ runner.os }}-${{ hashFiles('crates/hive-net/Cargo.lock') }}

      - name: Test
        run: cargo test --locked

      - name: A device's side alone, without the server roles (what a phone links)
        run: cargo check --locked --no-default-features --all-targets

      - name: Two machines (network namespaces)
        # R10's "Done when" on one runner: one network with no internet (mDNS, direct), and two
        # networks that reach each other only through a relay hive-net serves.
        run: |
          cargo build --locked
          sudo HIVE_NET_BIN="$PWD/target/debug/hive-net" bash tests/two-machines.sh

      - name: What leaves a device (network namespaces, nft)
        # R16's "Done when": on the local network hive-net sends nothing off it; on a network
        # someone runs, it talks to that network's relay and no one else. (The app's part runs
        # where the app is built: `sudo bash scripts/traffic-test.sh`.)
        run: |
          command -v nft >/dev/null || sudo apt-get install -y nftables
          sudo HIVE_NET_BIN="$PWD/target/debug/hive-net" bash ../../scripts/traffic-test.sh

  hive-phone:
    # The phone's Rust core (M5): conformance/pairing.json from the phone's side, and what it keeps;
    # the facade the apps link (crates/hive-phone-ffi), and the Swift generated from it, committed.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: crates/hive-phone
    steps:
      - uses: actions/checkout@v4

      - name: Rust (stable)
        run: rustup update stable --no-self-update && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/hive-phone/target
            crates/hive-phone-ffi/target
          key: hive-phone-${{ runner.os }}-${{ hashFiles('crates/hive-phone/Cargo.lock', 'crates/hive-phone-ffi/Cargo.lock') }}

      - name: Test
        run: cargo test --locked

      - name: It links none of hive-net's server roles
        # A phone runs no relay, lookup, access or push role (hive-net's `server` feature).
        run: |
          if cargo tree --locked -e normal --prefix none | grep -E '^(iroh-dns-server|tokio-rustls-acme) '; then
            echo "the phone links hive-net's server roles"; exit 1
          fi

      - name: Test the facade
        working-directory: crates/hive-phone-ffi
        run: cargo test --locked

      - name: The Swift committed is what the facade generates
        # Generated unformatted, so any machine generates the same; the Kotlin is the Android
        # build's own.
        working-directory: .
        run: |
          scripts/phone/bindings.sh
          git diff --exit-code -- apps/ios/HivePhone/Core/Generated
          test -z "$(git status --porcelain -- apps/ios/HivePhone/Core/Generated)"

  compose:
    # R13: the stack self-hosters run (infra/compose.yml), built from this commit, and its checks:
    # the network's link, admission, a device found by id through the lookup server, a host
    # record, and a restart survived.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Rust (stable)
        run: rustup update stable --no-self-update && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/hive-net/target
          key: hive-net-${{ runner.os }}-${{ hashFiles('crates/hive-net/Cargo.lock') }}

      - name: Build hive-net (the devices the checks run)
        run: cargo build --locked --manifest-path crates/hive-net/Cargo.toml

      - name: Start the stack
        run: docker compose -f infra/compose.yml up -d --build

      - name: Check it
        run: bash infra/check.sh

      - name: What the server said
        if: failure()
        run: docker compose -f infra/compose.yml logs

      - name: Stop it
        if: always()
        run: docker compose -f infra/compose.yml down -v
