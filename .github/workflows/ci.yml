name: ci

# Lightweight CI on every push to main + PRs targeting main.
# Heavier e2e (Playwright + xvfb) is intentionally NOT run here yet — the
# release workflow validates the full build path. CI focuses on the fast
# signals that catch most regressions in <2 minutes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          # version pinned via `packageManager` in package.json (avoid dupes)
          run_install: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: pnpm install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (every package)
        run: pnpm typecheck

      - name: Build (renderer + main + CLI)
        run: pnpm -r --parallel build

      - name: Unit tests (desktop)
        run: pnpm --filter @hivemind/desktop run test:unit

      - name: Unit tests (packages and CLI)
        # Every package's own `bun test`: the workspace store, settings.json and its lock,
        # agent discovery, the view SDK, the agent host, the CLI.
        run: pnpm test

      - name: Installer platform matrix
        # Cheap guard on the install.sh ↔ release.yml contract: the asset names
        # the installer asks for must match the ones the release uploads.
        run: bash scripts/install-plan-test.sh

      - name: Installer macOS path
        # Runs install.sh's Darwin helpers against a fake .app (ditto/xattr/pkill
        # shimmed), so the mac install/uninstall path is covered on this ubuntu box.
        run: bash scripts/install-macos-test.sh

  hive-net:
    # The Rust network crate (R10): its CLI end to end, on the local network and through a relay.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: crates/hive-net
    steps:
      - uses: actions/checkout@v4

      - name: Rust (stable)
        run: rustup update stable --no-self-update && rustup default stable

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/hive-net/target
          key: hive-net-${{ runner.os }}-${{ hashFiles('crates/hive-net/Cargo.lock') }}

      - name: Test
        run: cargo test --locked

      - name: Two machines (network namespaces)
        # R10's "Done when" on one runner: one network with no internet (mDNS, direct), and two
        # networks that reach each other only through a relay hive-net serves.
        run: |
          cargo build --locked
          sudo HIVE_NET_BIN="$PWD/target/debug/hive-net" bash tests/two-machines.sh
