# The live site (hivemind.griiken.com) is Cloud Run, and it used to move only when someone ran
# internal/scripts/deploy-site.sh by hand — so main and the site drifted apart. Deploy on merge.
name: Deploy site to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "guide/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

# Read-only: nothing here writes to the repository.
permissions:
  contents: read

# One deploy at a time; never cancel a live one.
concurrency:
  group: site-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The deploy credential is a repo secret, so a fork skips this instead of failing red.
    if: ${{ github.repository == 'dip497/hivemind' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # The guide's pages live in guide/, outside site/, so the site and its guide are built here
      # and the container only carries dist/.
      - name: Build the site and its guide
        run: npm ci --no-audit --no-fund && npm ci --no-audit --no-fund --prefix docs && npm run build
        working-directory: site

      - uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Deploy hivemind-site
        run: gcloud run deploy hivemind-site --source . --region europe-west1 --allow-unauthenticated --quiet
        working-directory: site

      - name: The service answers
        run: |
          url=$(gcloud run services describe hivemind-site --region europe-west1 --format='value(status.url)')
          for path in / /guide/ /guide/llms.txt; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' "$url$path")
            echo "$url$path → $code"
            [ "$code" = 200 ]
          done
