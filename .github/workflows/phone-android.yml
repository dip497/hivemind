name: phone-android

# The Android app (apps/android) over the phone's Rust core (docs/design/phone-app-2026-10-02.md):
# the core built for arm64-v8a and x86_64, the app assembled and unit-tested, then launched on an
# emulator for a Maestro smoke flow, and on another paired with the desktop app, driving an agent
# there. On every push touching the phone, on any branch.
on:
  push:
    paths:
      - apps/android/**
      - crates/hive-phone/**
      - crates/hive-phone-ffi/**
      - crates/hive-net/**
      - scripts/phone/**
      - apps/desktop/tests/e2e/phone-app.spec.ts
      - apps/desktop/tests/e2e/helpers/phone.ts
      - apps/desktop/tests/e2e/fixtures/views/phone-probe/**
      - .github/workflows/phone-android.yml
  pull_request:
    paths:
      - apps/android/**
      - crates/hive-phone/**
      - crates/hive-phone-ffi/**
      - crates/hive-net/**
      - scripts/phone/**
      - apps/desktop/tests/e2e/phone-app.spec.ts
      - apps/desktop/tests/e2e/helpers/phone.ts
      - apps/desktop/tests/e2e/fixtures/views/phone-probe/**
      - .github/workflows/phone-android.yml
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Rust (stable) for the host and the app's two ABIs
        run: |
          rustup update stable --no-self-update && rustup default stable
          rustup target add aarch64-linux-android x86_64-linux-android

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-ndk
            crates/hive-phone-ffi/target
          key: phone-android-cargo-${{ runner.os }}-${{ hashFiles('crates/hive-phone-ffi/Cargo.lock') }}
          restore-keys: phone-android-cargo-${{ runner.os }}-

      - name: cargo-ndk
        run: command -v cargo-ndk || cargo install cargo-ndk --locked --version 4.1.2

      - name: The NDK the app is built with (gradle/libs.versions.toml)
        run: |
          ndk=$(sed -n 's/^ndk = "\(.*\)"/\1/p' apps/android/gradle/libs.versions.toml)
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$ndk" > /dev/null

      - uses: gradle/actions/setup-gradle@v6
        with:
          # The action's open-source cache (MIT); its default from v6 is a proprietary one.
          cache-provider: basic

      - name: Build (the core through buildCore) and unit tests
        working-directory: apps/android
        run: ./gradlew assembleDebug testDebugUnitTest

      - uses: actions/upload-artifact@v7
        with:
          name: hivemind-phone-debug
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk

      - name: What the unit tests said
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: apps/android/app/build/reports/tests/

  emulator:
    # The built app on an emulator (KVM on ubuntu-latest), driven by apps/android/maestro.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: hivemind-phone-debug

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Maestro
        env:
          MAESTRO_VERSION: "2.11.0"
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: SDK command-line tools, the newest (the image's cannot make an Android 17 AVD)
        run: bash scripts/phone/update-cmdline-tools.sh

      # Booted cold, not from a snapshot: an emulator restored from one dropped off adb as Maestro
      # started its driver ("device offline", runs 36987502508 and 36989241234).
      - name: Smoke flow
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"
        with:
          # Android 17. The app targets 36, so its local-network rule for apps targeting 37 is not
          # in play; the smoke shows the app runs on the newest Android all the same.
          api-level: "37.0"
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # One line: the runner runs each line of a script on its own.
          script: bash scripts/phone/emulator-smoke.sh app-debug.apk maestro-report.xml

      - name: What Maestro said
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-report
          path: |
            maestro-report.xml
            maestro-report-logcat.txt
            ~/.maestro/tests/
          if-no-files-found: ignore

  computer:
    # The built app on an emulator, paired with the desktop app running beside it on the runner as
    # the person pairs a phone, driving an agent there: the desktop's e2e spec
    # apps/desktop/tests/e2e/phone-app.spec.ts (PHONE_APP=android) offers Pair a phone and runs
    # apps/android/maestro/computer with the link. The emulator reaches the desktop at the addresses
    # the link carries, the runner's own, through its virtual router.
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: hivemind-phone-debug

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Maestro
        env:
          MAESTRO_VERSION: "2.11.0"
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # v6.1.0, not v6: the first release that installs pnpm 12, and the moving v6 tag still names v6.0.10.
      - uses: pnpm/action-setup@v6.1.0
        with:
          # The version from `packageManager` in package.json.
          run_install: false

      - name: The desktop app (its renderer and main)
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter @hivemind/desktop run build

      # The hive CLI, which the spec installs the community view the phone shows with.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4"

      - name: Rust (stable)
        run: rustup update stable --no-self-update && rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            crates/hive-net/target
          # ci.yml's: the same debug build.
          key: hive-net-${{ runner.os }}-${{ hashFiles('crates/hive-net/Cargo.lock') }}
          restore-keys: hive-net-${{ runner.os }}-

      - name: hive-net, the desktop app's network
        run: cargo build --locked --manifest-path crates/hive-net/Cargo.toml

      - name: SDK command-line tools, the newest (the image's cannot make an Android 17 AVD)
        run: bash scripts/phone/update-cmdline-tools.sh

      # Booted cold, as for the smoke flow.
      - name: The app paired with the desktop app, driving its agent
        uses: reactivecircus/android-emulator-runner@v2
        env:
          MAESTRO_CLI_NO_ANALYTICS: "1"
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "120000"
        with:
          api-level: "37.0"
          target: google_apis
          arch: x86_64
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # One line: the runner runs each line of a script on its own.
          script: bash scripts/phone/emulator-computer.sh app-debug.apk logcat.txt

      - name: What the desktop and the phone saw
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: phone-android-computer
          path: |
            apps/desktop/test-results/
            logcat.txt
          if-no-files-found: ignore
