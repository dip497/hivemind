<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 800 660" width="800" height="660" role="img" aria-labelledby="architecture-title architecture-desc"><title id="architecture-title">What runs where</title><desc id="architecture-desc">On your computer the desktop app, the background process that runs your agents, and the hive command. Your own network server relays encrypted traffic to your phone and hosts. Machines are reached over ssh, plugins come from HiveHub.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:color-mix(in oklch, var(--color-fd-foreground) 25%, var(--color-fd-muted-foreground));--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="architecture-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="architecture-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="architecture-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="architecture-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><rect x="20" y="40" width="548" height="380" rx="10" fill="none" stroke-width="1" stroke-dasharray="5,4" style="stroke:var(--d-ruleSolid)"/><rect x="34" y="32" width="124" height="16" style="fill:var(--d-paper)"/><text x="40" y="44" font-size="12" class="m" letter-spacing="0.08em" style="fill:var(--d-soft)">YOUR COMPUTER</text><rect x="580" y="192" width="204" height="120" rx="10" fill="none" stroke-width="1" stroke-dasharray="5,4" style="stroke:var(--d-ruleSolid)"/><rect x="594" y="184" width="107" height="16" style="fill:var(--d-paper)"/><text x="600" y="196" font-size="12" class="m" letter-spacing="0.08em" style="fill:var(--d-soft)">YOUR SERVER</text><rect x="284" y="524" width="500" height="116" rx="10" fill="none" stroke-width="1" stroke-dasharray="5,4" style="stroke:var(--d-ruleSolid)"/><rect x="298" y="516" width="132" height="16" style="fill:var(--d-paper)"/><text x="304" y="528" font-size="12" class="m" letter-spacing="0.08em" style="fill:var(--d-soft)">OTHER MACHINES</text><path d="M 222 120 L 316 120" fill="none" stroke-width="1.25" marker-end="url(#architecture-arrow)" style="stroke:var(--d-soft)"/><rect x="226" y="92.5" width="86" height="19" rx="2" style="fill:var(--d-paper)"/><text x="269" y="106.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">drive.sock</text><path d="M 418 160 L 418 224" fill="none" stroke-width="1.25" marker-end="url(#architecture-arrow)" marker-start="url(#architecture-arrow-start)" style="stroke:var(--d-soft)"/><rect x="423" y="182.5" width="86" height="19" rx="2" style="fill:var(--d-paper)"/><text x="428" y="196.2" font-size="12" class="m" text-anchor="start" style="fill:var(--d-muted)">pty socket</text><path d="M 316 252 L 222 252" fill="none" stroke-width="1.25" marker-end="url(#architecture-arrow)" style="stroke:var(--d-soft)"/><rect x="249" y="224.5" width="40" height="19" rx="2" style="fill:var(--d-paper)"/><text x="269" y="238.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">runs</text><path d="M 222 280 L 316 280" fill="none" stroke-width="1.25" marker-end="url(#architecture-arrow)" style="stroke:var(--d-soft)"/><rect x="245" y="288.5" width="48" height="19" rx="2" style="fill:var(--d-paper)"/><text x="269" y="302.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">hooks</text><path d="M 127 224 L 127 160" fill="none" stroke-width="1.25" marker-end="url(#architecture-arrow)" style="stroke:var(--d-soft)"/><rect x="52" y="182.5" width="70" height="19" rx="2" style="fill:var(--d-paper)"/><text x="117" y="196.2" font-size="12" class="m" text-anchor="end" style="fill:var(--d-muted)">hive ctl</text><path d="M 520 100 L 596 100" fill="none" stroke-width="1.25" marker-end="url(#architecture-arrow-link)" style="stroke:var(--d-link)"/><rect x="534" y="72.5" width="48" height="19" rx="2" style="fill:var(--d-paper)"/><text x="558" y="86.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">https</text><path d="M 520 128 L 552 128 Q 560 128 560 136 L 560 248 Q 560 256 568 256 L 596 256" fill="none" stroke-width="1.25" marker-end="url(#architecture-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="565" y="154.5" width="78" height="19" rx="2" style="fill:var(--d-paper)"/><text x="570" y="168.2" font-size="12" class="m" text-anchor="start" style="fill:var(--d-muted)">encrypted</text><path d="M 520 152 L 536 152 Q 544 152 544 160 L 544 492 Q 544 500 536 500 L 478 500 Q 470 500 470 508 L 470 548" fill="none" stroke-width="1.25" marker-end="url(#architecture-arrow)" style="stroke:var(--d-soft)"/><rect x="505" y="450.5" width="34" height="19" rx="2" style="fill:var(--d-paper)"/><text x="534" y="464.2" font-size="12" class="m" text-anchor="end" style="fill:var(--d-muted)">ssh</text><path d="M 650 288 L 650 380" fill="none" stroke-width="1.25" marker-end="url(#architecture-arrow-link)" style="stroke:var(--d-link)"/><rect x="655" y="324.5" width="48" height="19" rx="2" style="fill:var(--d-paper)"/><text x="660" y="338.2" font-size="12" class="m" text-anchor="start" style="fill:var(--d-muted)">https</text><path d="M 756 288 L 756 548" fill="none" stroke-width="1.25" marker-end="url(#architecture-arrow)" marker-start="url(#architecture-arrow-start)" style="stroke:var(--d-soft)"/><rect x="703" y="460.5" width="48" height="19" rx="2" style="fill:var(--d-paper)"/><text x="746" y="474.2" font-size="12" class="m" text-anchor="end" style="fill:var(--d-muted)">relay</text><rect x="32" y="80" width="190" height="80" rx="6" style="fill:var(--d-paper)"/><rect x="32" y="80" width="190" height="80" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="127" y="115.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">hive command</text><text x="127" y="135.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">you, agents, programs</text><rect x="316" y="80" width="204" height="80" rx="6" style="fill:var(--d-paper)"/><rect x="316" y="80" width="204" height="80" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="418" y="115.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Desktop app</text><text x="418" y="135.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">windows and views</text><rect x="32" y="224" width="190" height="80" rx="6" style="fill:var(--d-paper)"/><rect x="32" y="224" width="190" height="80" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="127" y="259.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Your agents</text><text x="127" y="279.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">each in a terminal</text><rect x="316" y="224" width="204" height="80" rx="6" style="fill:var(--d-paper)"/><rect x="316" y="224" width="204" height="80" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="418" y="259.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Background process</text><text x="418" y="279.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">runs every agent</text><text x="32" y="352" font-size="12.5" font-weight="400" text-anchor="start" style="fill:var(--d-soft)">Stays on this computer: your keys, settings,</text><text x="32" y="372" font-size="12.5" font-weight="400" text-anchor="start" style="fill:var(--d-soft)">API tokens and saved screens.</text><text x="32" y="400" font-size="12.5" font-weight="400" text-anchor="start" style="fill:var(--d-soft)">Closing the window leaves agents running.</text><rect x="596" y="64" width="184" height="72" rx="6" style="fill:var(--d-paper)"/><rect x="596" y="64" width="184" height="72" rx="6" stroke-width="1" stroke-dasharray="4,3" style="fill:var(--d-paper);stroke:var(--d-ruleSolid)"/><text x="688" y="95.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">HiveHub</text><text x="688" y="115.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">plugins</text><rect x="596" y="220" width="180" height="68" rx="6" style="fill:var(--d-paper)"/><rect x="596" y="220" width="180" height="68" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="686" y="249.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Network server</text><text x="686" y="269.5" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-soft)">hive-net serve</text><rect x="596" y="380" width="132" height="68" rx="6" style="fill:var(--d-paper)"/><rect x="596" y="380" width="132" height="68" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="662" y="409.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Phone page</text><text x="662" y="429.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">a browser</text><rect x="300" y="548" width="220" height="68" rx="6" style="fill:var(--d-paper)"/><rect x="300" y="548" width="220" height="68" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="410" y="577.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Machine</text><text x="410" y="597.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">over ssh</text><rect x="580" y="548" width="188" height="68" rx="6" style="fill:var(--d-paper)"/><rect x="580" y="548" width="188" height="68" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="674" y="577.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Host</text><text x="674" y="597.5" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-soft)">hive host</text></svg>
