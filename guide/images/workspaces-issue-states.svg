<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 700 316" width="700" height="316" role="img" aria-labelledby="workspaces-issue-states-title workspaces-issue-states-desc"><title id="workspaces-issue-states-title">Issue states</title><desc id="workspaces-issue-states-desc">An issue usually moves backlog, todo, in_progress, in_review, done; cancelled can be set from any state, and nothing enforces the order: any state can be set from any other.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:var(--color-fd-muted-foreground);--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="workspaces-issue-states-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="workspaces-issue-states-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="workspaces-issue-states-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="workspaces-issue-states-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="workspaces-issue-states-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><path d="M 132 68 L 154 68" fill="none" stroke-width="1.25" marker-end="url(#workspaces-issue-states-arrow)" style="stroke:var(--d-soft)"/><path d="M 270 68 L 292 68" fill="none" stroke-width="1.25" marker-end="url(#workspaces-issue-states-arrow)" style="stroke:var(--d-soft)"/><path d="M 408 68 L 430 68" fill="none" stroke-width="1.25" marker-end="url(#workspaces-issue-states-arrow)" style="stroke:var(--d-soft)"/><path d="M 546 68 L 568 68" fill="none" stroke-width="1.25" marker-end="url(#workspaces-issue-states-arrow)" style="stroke:var(--d-soft)"/><path d="M 74 108 L 74 120 L 626 120 L 626 108" fill="none" stroke-width="1" style="stroke:var(--d-soft)"/><line x1="212" y1="108" x2="212" y2="120" stroke-width="1" style="stroke:var(--d-soft)"/><line x1="350" y1="108" x2="350" y2="120" stroke-width="1" style="stroke:var(--d-soft)"/><line x1="488" y1="108" x2="488" y2="120" stroke-width="1" style="stroke:var(--d-soft)"/><path d="M 350 120 L 350 180" fill="none" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#workspaces-issue-states-arrow)" style="stroke:var(--d-soft)"/><rect x="357" y="141" width="106" height="18" rx="2" style="fill:var(--d-paper)"/><text x="362" y="153.85" font-size="11" class="m" text-anchor="start" style="fill:var(--d-muted)">from any state</text><rect x="16" y="40" width="116" height="56" rx="8" style="fill:var(--d-paper)"/><rect x="16" y="40" width="116" height="56" rx="8" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="74" y="72" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">backlog</text><rect x="154" y="40" width="116" height="56" rx="8" style="fill:var(--d-paper)"/><rect x="154" y="40" width="116" height="56" rx="8" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="212" y="72" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">todo</text><rect x="292" y="40" width="116" height="56" rx="8" style="fill:var(--d-paper)"/><rect x="292" y="40" width="116" height="56" rx="8" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="350" y="72" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">in_progress</text><rect x="430" y="40" width="116" height="56" rx="8" style="fill:var(--d-paper)"/><rect x="430" y="40" width="116" height="56" rx="8" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="488" y="72" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">in_review</text><rect x="568" y="40" width="116" height="56" rx="8" style="fill:var(--d-paper)"/><rect x="568" y="40" width="116" height="56" rx="8" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="626" y="72" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">done</text><rect x="280" y="180" width="140" height="56" rx="8" style="fill:var(--d-paper)"/><rect x="280" y="180" width="140" height="56" rx="8" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="350" y="212" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">cancelled</text><text x="350" y="270" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">The order is not enforced: any state can be set from any other.</text><text x="350" y="292" font-size="11.5" font-weight="400" class="m" text-anchor="middle" style="fill:var(--d-soft)">hive close → done · hive close --reason → cancelled · hive reopen → todo</text></svg>
