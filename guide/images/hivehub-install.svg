<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 790 214" width="790" height="214" role="img" aria-labelledby="hivehub-install-title hivehub-install-desc"><title id="hivehub-install-title">Where a plugin’s files come from</title><desc id="hivehub-install-desc">Publishing makes HiveHub read your repository at one commit and list every file with its SHA-256 hash. Hivemind reads that listing, downloads each file from your repository at that commit, and checks it against its hash; a file that differs stops the install.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:color-mix(in oklch, var(--color-fd-foreground) 25%, var(--color-fd-muted-foreground));--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="hivehub-install-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="hivehub-install-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="hivehub-install-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="hivehub-install-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="hivehub-install-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><path d="M 210 62 L 300 62" fill="none" stroke-width="1.25" marker-end="url(#hivehub-install-arrow)" style="stroke:var(--d-soft)"/><rect x="223" y="36.5" width="64" height="19" rx="2" style="fill:var(--d-paper)"/><text x="255" y="50.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">publish</text><path d="M 490 62 L 580 62" fill="none" stroke-width="1.25" marker-end="url(#hivehub-install-arrow)" style="stroke:var(--d-soft)"/><rect x="503" y="36.5" width="64" height="19" rx="2" style="fill:var(--d-paper)"/><text x="535" y="50.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">listing</text><path d="M 115 100 L 115 136 Q 115 144 123 144 L 667 144 Q 675 144 675 136 L 675 100" fill="none" stroke-width="1.25" marker-end="url(#hivehub-install-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="371" y="150.5" width="48" height="19" rx="2" style="fill:var(--d-paper)"/><text x="395" y="164.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">files</text><rect x="20" y="24" width="190" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="20" y="24" width="190" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="115" y="57.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Your repository</text><text x="115" y="77.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">on GitHub, holds the files</text><rect x="300" y="24" width="190" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="300" y="24" width="190" height="76" rx="6" stroke-width="1" stroke-dasharray="4,3" style="fill:var(--d-paper);stroke:var(--d-ruleSolid)"/><text x="395" y="49" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">HiveHub</text><text x="395" y="69" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">one commit, each file’s</text><text x="395" y="86" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">path and SHA-256</text><rect x="580" y="24" width="190" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="580" y="24" width="190" height="76" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="675" y="57.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Hivemind</text><text x="675" y="77.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">checks every hash</text><text x="395" y="198" font-size="12.5" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">A file that does not match its hash stops the install.</text></svg>
