<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 320 534" width="320" height="534" role="img" aria-labelledby="packages-one-box-phone-title packages-one-box-phone-desc"><title id="packages-one-box-phone-title">A package is one box</title><desc id="packages-one-box-phone-desc">A package is one folder whose hivemind-package.json names its tools, widgets, views, agent presets and themes; hive plugins install puts the whole box on this machine, with one switch, one version and a rollback, and hivehub publish lists the whole box on HiveHub.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:color-mix(in oklch, var(--color-fd-foreground) 25%, var(--color-fd-muted-foreground));--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="packages-one-box-phone-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="packages-one-box-phone-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="packages-one-box-phone-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="packages-one-box-phone-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="packages-one-box-phone-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><rect x="8" y="30" width="304" height="324" rx="10" fill="none" stroke-width="1" stroke-dasharray="5,4" style="stroke:var(--d-ruleSolid)"/><rect x="22" y="22" width="182" height="16" style="fill:var(--d-paper)"/><text x="28" y="34" font-size="12" class="m" letter-spacing="0.08em" style="fill:var(--d-soft)">ONE FOLDER: @YOU/KIT</text><path d="M 86 354 L 86 428" fill="none" stroke-width="1.25" marker-end="url(#packages-one-box-phone-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="91" y="374.5" width="100" height="19" rx="2" style="fill:var(--d-paper)"/><text x="96" y="388.2" font-size="12" class="m" text-anchor="start" style="fill:var(--d-muted)">hive plugins</text><rect x="91" y="390.5" width="64" height="19" rx="2" style="fill:var(--d-paper)"/><text x="96" y="404.2" font-size="12" class="m" text-anchor="start" style="fill:var(--d-muted)">install</text><path d="M 234 354 L 234 428" fill="none" stroke-width="1.25" marker-end="url(#packages-one-box-phone-arrow)" style="stroke:var(--d-soft)"/><rect x="239" y="374.5" width="64" height="19" rx="2" style="fill:var(--d-paper)"/><text x="244" y="388.2" font-size="12" class="m" text-anchor="start" style="fill:var(--d-muted)">hivehub</text><rect x="239" y="390.5" width="64" height="19" rx="2" style="fill:var(--d-paper)"/><text x="244" y="404.2" font-size="12" class="m" text-anchor="start" style="fill:var(--d-muted)">publish</text><rect x="24" y="60" width="124" height="60" rx="6" style="fill:var(--d-paper)"/><rect x="24" y="60" width="124" height="60" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="86" y="85.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Tools</text><text x="86" y="105.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">run in the app</text><rect x="172" y="60" width="124" height="60" rx="6" style="fill:var(--d-paper)"/><rect x="172" y="60" width="124" height="60" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="234" y="85.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Widgets</text><text x="234" y="105.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">sandboxed</text><rect x="24" y="132" width="124" height="60" rx="6" style="fill:var(--d-paper)"/><rect x="24" y="132" width="124" height="60" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="86" y="157.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Views</text><text x="86" y="177.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">sandboxed</text><rect x="172" y="132" width="124" height="60" rx="6" style="fill:var(--d-paper)"/><rect x="172" y="132" width="124" height="60" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="234" y="157.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Agent presets</text><text x="234" y="177.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">a prompt</text><rect x="24" y="204" width="124" height="60" rx="6" style="fill:var(--d-paper)"/><rect x="24" y="204" width="124" height="60" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="86" y="229.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Themes</text><text x="86" y="249.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">data, no code</text><text x="24" y="292" font-size="12.5" font-weight="400" text-anchor="start" style="fill:var(--d-soft)">hivemind-package.json names each</text><text x="24" y="312" font-size="12.5" font-weight="400" text-anchor="start" style="fill:var(--d-soft)">member, every one @you/&lt;name&gt;;</text><text x="24" y="332" font-size="12.5" font-weight="400" text-anchor="start" style="fill:var(--d-soft)">a theme @you/kit/&lt;name&gt;</text><rect x="24" y="428" width="124" height="86" rx="6" style="fill:var(--d-paper)"/><rect x="24" y="428" width="124" height="86" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="86" y="449.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">This machine</text><text x="86" y="469.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">one switch,</text><text x="86" y="486.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">one version,</text><text x="86" y="503.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">a rollback</text><rect x="172" y="428" width="124" height="86" rx="6" style="fill:var(--d-paper)"/><rect x="172" y="428" width="124" height="86" rx="6" stroke-width="1" stroke-dasharray="4,3" style="fill:var(--d-paper);stroke:var(--d-ruleSolid)"/><text x="234" y="458" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">HiveHub</text><text x="234" y="478" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">one listing,</text><text x="234" y="495" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">every member</text></svg>
