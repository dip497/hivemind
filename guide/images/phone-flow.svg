<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 800 424" width="800" height="424" role="img" aria-labelledby="phone-flow-title phone-flow-desc"><title id="phone-flow-title">How your phone sees an agent</title><desc id="phone-flow-desc">An agent's hook tells the background process, which works out its state. The app sends the state of every agent to your phone over hive-net, through the relay on your server, encrypted end to end. When the page is closed, a push notice goes through the same server.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:color-mix(in oklch, var(--color-fd-foreground) 25%, var(--color-fd-muted-foreground));--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="phone-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="phone-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="phone-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="phone-flow-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="phone-flow-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><rect x="20" y="32" width="760" height="140" rx="10" fill="none" stroke-width="1" stroke-dasharray="5,4" style="stroke:var(--d-ruleSolid)"/><rect x="34" y="24" width="124" height="16" style="fill:var(--d-paper)"/><text x="40" y="36" font-size="12" class="m" letter-spacing="0.08em" style="fill:var(--d-soft)">YOUR COMPUTER</text><rect x="280" y="240" width="240" height="128" rx="10" fill="none" stroke-width="1" stroke-dasharray="5,4" style="stroke:var(--d-ruleSolid)"/><rect x="294" y="232" width="107" height="16" style="fill:var(--d-paper)"/><text x="300" y="244" font-size="12" class="m" letter-spacing="0.08em" style="fill:var(--d-soft)">YOUR SERVER</text><path d="M 190 102 L 270 102" fill="none" stroke-width="1.25" marker-end="url(#phone-flow-arrow)" style="stroke:var(--d-soft)"/><rect x="210" y="74.5" width="40" height="19" rx="2" style="fill:var(--d-paper)"/><text x="230" y="88.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">hook</text><path d="M 470 102 L 550 102" fill="none" stroke-width="1.25" marker-end="url(#phone-flow-arrow)" style="stroke:var(--d-soft)"/><rect x="486" y="74.5" width="48" height="19" rx="2" style="fill:var(--d-paper)"/><text x="510" y="88.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">state</text><path d="M 700 140 L 700 296 Q 700 304 692 304 L 500 304" fill="none" stroke-width="1.25" marker-end="url(#phone-flow-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="579" y="212.5" width="116" height="19" rx="2" style="fill:var(--d-paper)"/><text x="690" y="226.2" font-size="12" class="m" text-anchor="end" style="fill:var(--d-muted)">agents · needs</text><path d="M 300 292 L 220 292" fill="none" stroke-width="1.25" marker-end="url(#phone-flow-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="236" y="264.5" width="48" height="19" rx="2" style="fill:var(--d-paper)"/><text x="260" y="278.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">relay</text><path d="M 300 316 L 220 316" fill="none" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#phone-flow-arrow)" style="stroke:var(--d-soft)"/><rect x="240" y="324.5" width="40" height="19" rx="2" style="fill:var(--d-paper)"/><text x="260" y="338.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">push</text><rect x="40" y="64" width="150" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="40" y="64" width="150" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="115" y="97.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Agent</text><text x="115" y="117.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">asks something</text><rect x="270" y="64" width="200" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="270" y="64" width="200" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="370" y="97.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Background process</text><text x="370" y="117.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">its state</text><rect x="550" y="64" width="210" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="550" y="64" width="210" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="655" y="97.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Desktop app</text><text x="655" y="117.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">or hive host</text><rect x="300" y="268" width="200" height="72" rx="6" style="fill:var(--d-paper)"/><rect x="300" y="268" width="200" height="72" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="400" y="299.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Network server</text><text x="400" y="319.5" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-soft)">hive-net serve</text><rect x="40" y="268" width="180" height="72" rx="6" style="fill:var(--d-paper)"/><rect x="40" y="268" width="180" height="72" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="130" y="299.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Phone page</text><text x="130" y="319.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">your browser</text><text x="400" y="404" font-size="12.5" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">Encrypted end to end: the server passes it on but cannot read it.</text></svg>
