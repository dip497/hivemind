<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 320 400" width="320" height="400" role="img" aria-labelledby="hivehub-install-phone-title hivehub-install-phone-desc"><title id="hivehub-install-phone-title">Where a plugin’s files come from</title><desc id="hivehub-install-phone-desc">Publishing makes HiveHub read your repository at one commit and list every file with its SHA-256 hash. Hivemind reads that listing, downloads each file from your repository at that commit, and checks it against its hash; a file that differs stops the install.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:color-mix(in oklch, var(--color-fd-foreground) 25%, var(--color-fd-muted-foreground));--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="hivehub-install-phone-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="hivehub-install-phone-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="hivehub-install-phone-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="hivehub-install-phone-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="hivehub-install-phone-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><path d="M 120 84 L 120 140" fill="none" stroke-width="1.25" marker-end="url(#hivehub-install-phone-arrow)" style="stroke:var(--d-soft)"/><rect x="127" y="102.5" width="64" height="19" rx="2" style="fill:var(--d-paper)"/><text x="132" y="116.2" font-size="12" class="m" text-anchor="start" style="fill:var(--d-muted)">publish</text><path d="M 120 216 L 120 272" fill="none" stroke-width="1.25" marker-end="url(#hivehub-install-phone-arrow)" style="stroke:var(--d-soft)"/><rect x="127" y="234.5" width="64" height="19" rx="2" style="fill:var(--d-paper)"/><text x="132" y="248.2" font-size="12" class="m" text-anchor="start" style="fill:var(--d-muted)">listing</text><path d="M 220 52 L 242 52 Q 250 52 250 60 L 250 296 Q 250 304 242 304 L 220 304" fill="none" stroke-width="1.25" marker-end="url(#hivehub-install-phone-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="257" y="168.5" width="48" height="19" rx="2" style="fill:var(--d-paper)"/><text x="262" y="182.2" font-size="12" class="m" text-anchor="start" style="fill:var(--d-muted)">files</text><rect x="20" y="20" width="200" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="20" y="20" width="200" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="120" y="47.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Your repository</text><text x="120" y="67.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">on GitHub, holds the files</text><rect x="20" y="140" width="200" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="20" y="140" width="200" height="76" rx="6" stroke-width="1" stroke-dasharray="4,3" style="fill:var(--d-paper);stroke:var(--d-ruleSolid)"/><text x="120" y="165" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">HiveHub</text><text x="120" y="185" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">one commit, each file’s</text><text x="120" y="202" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">path and SHA-256</text><rect x="20" y="272" width="200" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="20" y="272" width="200" height="64" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="120" y="299.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Hivemind</text><text x="120" y="319.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">checks every hash</text><text x="160" y="366" font-size="12.5" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">A file that does not match its</text><text x="160" y="384" font-size="12.5" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">hash stops the install.</text></svg>
