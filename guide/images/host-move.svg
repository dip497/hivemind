<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" width="760" height="270" role="img" aria-labelledby="host-move-title host-move-desc"><title id="host-move-title">A host keeps a workspace up</title><desc id="host-move-desc">Move there hands a workspace from your computer to a host that runs hive host; Move here brings it back. While the host has it, guests and your phone reach it there, whatever your computer does.</desc><defs><style>@font-face{font-family:'Geist';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}</style><marker id="host-move-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#83868a"/></marker><marker id="host-move-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8ab7da"/></marker><marker id="host-move-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#99aec0"/></marker><marker id="host-move-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#83868a"/></marker><marker id="host-move-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#8ab7da"/></marker></defs><rect width="100%" height="100%" fill="#0d0e10"/><path d="M 200 104 L 300 104" fill="none" stroke="#8ab7da" stroke-width="1.25" marker-end="url(#host-move-arrow-accent)"/><rect x="210" y="79" width="80" height="18" rx="2" fill="#0d0e10"/><text x="250" y="91.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Move there</text><path d="M 300 136 L 200 136" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#host-move-arrow)"/><rect x="214" y="143" width="72" height="18" rx="2" fill="#0d0e10"/><text x="250" y="155.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Move here</text><path d="M 480 104 L 522 104 Q 530 104 530 96 L 530 78 Q 530 70 538 70 L 580 70" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#host-move-arrow)" marker-start="url(#host-move-arrow-start)"/><path d="M 480 136 L 522 136 Q 530 136 530 144 L 530 152 Q 530 160 538 160 L 580 160" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#host-move-arrow)" marker-start="url(#host-move-arrow-start)"/><rect x="20" y="82" width="180" height="76" rx="6" fill="#0d0e10"/><rect x="20" y="82" width="180" height="76" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="110" y="116" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Your computer</text><text x="110" y="134" fill="#83868a" font-size="12" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">sleeps, travels</text><rect x="300" y="82" width="180" height="76" rx="6" fill="#0d0e10"/><rect x="300" y="82" width="180" height="76" rx="6" fill="#1f252a" stroke="#8ab7da" stroke-width="1"/><text x="390" y="116" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Host</text><text x="390" y="134" fill="#bbbec1" font-size="11.5" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">hive host</text><rect x="580" y="40" width="160" height="60" rx="6" fill="#0d0e10"/><rect x="580" y="40" width="160" height="60" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="660" y="74" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Guests</text><rect x="580" y="130" width="160" height="60" rx="6" fill="#0d0e10"/><rect x="580" y="130" width="160" height="60" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="660" y="164" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Your phone</text><text x="380" y="240" fill="#83868a" font-size="12" font-weight="400" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">The workspace, its agents and its people stay up while your computer is off.</text></svg>