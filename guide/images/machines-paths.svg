<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 880 330" width="880" height="330" role="img" aria-labelledby="machines-paths-title machines-paths-desc"><title id="machines-paths-title">Two ways to run on another machine</title><desc id="machines-paths-desc">A machine is reached over ssh: the app bridges into the background process there. A host runs hive host and is reached over hive-net. Either way, terminals and agents run in that machine's background process and keep running when you disconnect.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:var(--color-fd-muted-foreground);--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="machines-paths-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="machines-paths-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="machines-paths-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="machines-paths-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="machines-paths-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><path d="M 210 140 L 272 140 Q 280 140 280 132 L 280 84 Q 280 76 288 76 L 360 76" fill="none" stroke-width="1.25" marker-end="url(#machines-paths-arrow)" style="stroke:var(--d-soft)"/><rect x="243" y="99" width="32" height="18" rx="2" style="fill:var(--d-paper)"/><text x="270" y="111.85" font-size="11" class="m" text-anchor="end" style="fill:var(--d-muted)">ssh</text><path d="M 210 176 L 288 176 Q 296 176 296 184 L 296 248 Q 296 256 304 256 L 360 256" fill="none" stroke-width="1.25" marker-end="url(#machines-paths-arrow)" style="stroke:var(--d-soft)"/><rect x="225" y="217" width="66" height="18" rx="2" style="fill:var(--d-paper)"/><text x="286" y="229.85" font-size="11" class="m" text-anchor="end" style="fill:var(--d-muted)">hive-net</text><path d="M 560 76 L 660 76" fill="none" stroke-width="1.25" marker-end="url(#machines-paths-arrow)" style="stroke:var(--d-soft)"/><path d="M 560 256 L 660 256" fill="none" stroke-width="1.25" marker-end="url(#machines-paths-arrow)" style="stroke:var(--d-soft)"/><rect x="20" y="120" width="190" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="20" y="120" width="190" height="76" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="115" y="154" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Your computer</text><text x="115" y="172" font-size="12" text-anchor="middle" style="fill:var(--d-muted)">the desktop app</text><rect x="360" y="40" width="200" height="72" rx="6" style="fill:var(--d-paper)"/><rect x="360" y="40" width="200" height="72" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="460" y="72" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Machine</text><text x="460" y="90" font-size="11.5" class="m" text-anchor="middle" style="fill:var(--d-soft)">hive daemon bridge</text><rect x="360" y="220" width="200" height="72" rx="6" style="fill:var(--d-paper)"/><rect x="360" y="220" width="200" height="72" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="460" y="252" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Host</text><text x="460" y="270" font-size="11.5" class="m" text-anchor="middle" style="fill:var(--d-soft)">hive host</text><rect x="660" y="40" width="200" height="72" rx="6" style="fill:var(--d-paper)"/><rect x="660" y="40" width="200" height="72" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="760" y="72" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Background process</text><text x="760" y="90" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">terminals, agents</text><rect x="660" y="220" width="200" height="72" rx="6" style="fill:var(--d-paper)"/><rect x="660" y="220" width="200" height="72" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="760" y="252" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Background process</text><text x="760" y="270" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">terminals, agents</text><text x="440" y="316" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">A machine without hive gets plain ssh terminals, which end when the connection drops.</text></svg>
