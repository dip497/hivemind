<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 780 400" width="780" height="400" role="img" aria-labelledby="agent-states-title agent-states-desc"><title id="agent-states-title">Agent states</title><desc id="agent-states-desc">An agent starts idle. A turn makes it working; when it asks you it needs you, and your answer makes it working again. When the turn ends it is idle, with a dot until you look. Sleep puts it asleep and Resume wakes it. When its program stops it is exited.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:color-mix(in oklch, var(--color-fd-foreground) 25%, var(--color-fd-muted-foreground));--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="agent-states-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="agent-states-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="agent-states-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="agent-states-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="agent-states-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><circle cx="115" cy="52" r="6" style="fill:var(--d-ink)"/><path d="M 115 58 L 115 120" fill="none" stroke-width="1.25" marker-end="url(#agent-states-arrow)" style="stroke:var(--d-soft)"/><path d="M 190 140 L 300 140" fill="none" stroke-width="1.25" marker-end="url(#agent-states-arrow)" style="stroke:var(--d-soft)"/><rect x="199" y="112.5" width="92" height="19" rx="2" style="fill:var(--d-paper)"/><text x="245" y="126.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">turn starts</text><path d="M 300 172 L 190 172" fill="none" stroke-width="1.25" marker-end="url(#agent-states-arrow)" style="stroke:var(--d-soft)"/><rect x="206" y="180.5" width="78" height="19" rx="2" style="fill:var(--d-paper)"/><text x="245" y="194.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">turn ends</text><path d="M 450 140 L 560 140" fill="none" stroke-width="1.25" marker-end="url(#agent-states-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="470" y="112.5" width="70" height="19" rx="2" style="fill:var(--d-paper)"/><text x="505" y="126.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">asks you</text><path d="M 560 172 L 450 172" fill="none" stroke-width="1.25" marker-end="url(#agent-states-arrow)" style="stroke:var(--d-soft)"/><rect x="462" y="180.5" width="86" height="19" rx="2" style="fill:var(--d-paper)"/><text x="505" y="194.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">you answer</text><path d="M 95 192 L 95 280" fill="none" stroke-width="1.25" marker-end="url(#agent-states-arrow)" style="stroke:var(--d-soft)"/><rect x="42" y="226.5" width="48" height="19" rx="2" style="fill:var(--d-paper)"/><text x="85" y="240.2" font-size="12" class="m" text-anchor="end" style="fill:var(--d-muted)">Sleep</text><path d="M 135 280 L 135 192" fill="none" stroke-width="1.25" marker-end="url(#agent-states-arrow)" style="stroke:var(--d-soft)"/><rect x="140" y="226.5" width="56" height="19" rx="2" style="fill:var(--d-paper)"/><text x="145" y="240.2" font-size="12" class="m" text-anchor="start" style="fill:var(--d-muted)">Resume</text><path d="M 375 192 L 375 280" fill="none" stroke-width="1.25" marker-end="url(#agent-states-arrow)" style="stroke:var(--d-soft)"/><rect x="380" y="226.5" width="108" height="19" rx="2" style="fill:var(--d-paper)"/><text x="385" y="240.2" font-size="12" class="m" text-anchor="start" style="fill:var(--d-muted)">program stops</text><rect x="40" y="120" width="150" height="72" rx="8" style="fill:var(--d-paper)"/><rect x="40" y="120" width="150" height="72" rx="8" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="115" y="151.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">idle</text><text x="115" y="171.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">grey</text><rect x="300" y="120" width="150" height="72" rx="8" style="fill:var(--d-paper)"/><rect x="300" y="120" width="150" height="72" rx="8" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="375" y="151.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">working</text><text x="375" y="171.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">white</text><rect x="560" y="120" width="180" height="72" rx="8" style="fill:var(--d-paper)"/><rect x="560" y="120" width="180" height="72" rx="8" stroke-width="1" style="fill:var(--d-warnTint);stroke:var(--d-warn)"/><text x="650" y="151.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">needs you</text><text x="650" y="171.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">amber</text><rect x="40" y="280" width="150" height="72" rx="8" style="fill:var(--d-paper)"/><rect x="40" y="280" width="150" height="72" rx="8" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="115" y="311.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">asleep</text><text x="115" y="331.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">conversation kept</text><rect x="300" y="280" width="150" height="72" rx="8" style="fill:var(--d-paper)"/><rect x="300" y="280" width="150" height="72" rx="8" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="375" y="311.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">exited</text><text x="375" y="331.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">red if it failed</text><text x="390" y="386" font-size="12.5" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">From any state, a program that stops is exited.</text></svg>
