<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 640 284" width="640" height="284" role="img" aria-labelledby="phone-terminal-size-title phone-terminal-size-desc"><title id="phone-terminal-size-title">Who sizes the terminal</title><desc id="phone-terminal-size-desc">A terminal opened on the phone takes the phone size; a desktop key, Fit off, or closing or hiding the terminal gives it back the desktop size; a phone key with Fit on, pressing Fit, or showing the page again takes the phone size again.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:color-mix(in oklch, var(--color-fd-foreground) 25%, var(--color-fd-muted-foreground));--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="phone-terminal-size-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="phone-terminal-size-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="phone-terminal-size-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="phone-terminal-size-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="phone-terminal-size-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><circle cx="110" cy="30" r="6" style="fill:var(--d-ink)"/><path d="M 110 36 L 110 128" fill="none" stroke-width="1.25" marker-end="url(#phone-terminal-size-arrow)" style="stroke:var(--d-soft)"/><rect x="115" y="60.5" width="152" height="19" rx="2" style="fill:var(--d-paper)"/><text x="120" y="74.2" font-size="12" class="m" text-anchor="start" style="fill:var(--d-muted)">opened on the phone</text><path d="M 180 148 L 460 148" fill="none" stroke-width="1.25" marker-end="url(#phone-terminal-size-arrow)" style="stroke:var(--d-soft)"/><rect x="266" y="122.5" width="108" height="19" rx="2" style="fill:var(--d-paper)"/><text x="320" y="136.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">a desktop key</text><rect x="288" y="104.5" width="64" height="19" rx="2" style="fill:var(--d-paper)"/><text x="320" y="118.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">Fit off</text><rect x="203" y="86.5" width="234" height="19" rx="2" style="fill:var(--d-paper)"/><text x="320" y="100.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">terminal closed or page hidden</text><path d="M 460 172 L 180 172" fill="none" stroke-width="1.25" marker-end="url(#phone-terminal-size-arrow)" style="stroke:var(--d-soft)"/><rect x="244" y="178.5" width="152" height="19" rx="2" style="fill:var(--d-paper)"/><text x="320" y="192.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">a phone key, Fit on</text><rect x="274" y="196.5" width="92" height="19" rx="2" style="fill:var(--d-paper)"/><text x="320" y="210.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">Fit pressed</text><rect x="255" y="214.5" width="130" height="19" rx="2" style="fill:var(--d-paper)"/><text x="320" y="228.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">page shown again</text><rect x="40" y="128" width="140" height="64" rx="8" style="fill:var(--d-paper)"/><rect x="40" y="128" width="140" height="64" rx="8" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="110" y="164" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Phone size</text><rect x="460" y="128" width="140" height="64" rx="8" style="fill:var(--d-paper)"/><rect x="460" y="128" width="140" height="64" rx="8" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="530" y="164" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Desktop size</text><text x="320" y="266" font-size="12.5" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">Whoever typed last sets the size. Allow, Deny and choosing an option are not typing.</text></svg>
