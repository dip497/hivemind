<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 800 268" width="800" height="268" role="img" aria-labelledby="agent-state-sources-title agent-state-sources-desc"><title id="agent-state-sources-title">How Hivemind knows</title><desc id="agent-state-sources-desc">Hooks the agent runs and rules read from its screen both reach the background process. Until the first hook arrives the screen decides; after it, the hooks do. The state goes to the tile, the Layers panel, notifications and your phone.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:color-mix(in oklch, var(--color-fd-foreground) 25%, var(--color-fd-muted-foreground));--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="agent-state-sources-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="agent-state-sources-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="agent-state-sources-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="agent-state-sources-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="agent-state-sources-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><path d="M 200 72 L 242 72 Q 250 72 250 80 L 250 96 Q 250 104 258 104 L 330 104" fill="none" stroke-width="1.25" marker-end="url(#agent-state-sources-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="266" y="76.5" width="48" height="19" rx="2" style="fill:var(--d-paper)"/><text x="290" y="90.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">exact</text><path d="M 200 188 L 242 188 Q 250 188 250 180 L 250 148 Q 250 140 258 140 L 330 140" fill="none" stroke-width="1.25" marker-end="url(#agent-state-sources-arrow)" style="stroke:var(--d-soft)"/><rect x="255" y="150.5" width="70" height="19" rx="2" style="fill:var(--d-paper)"/><text x="290" y="164.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">fallback</text><path d="M 530 122 L 590 122" fill="none" stroke-width="1.25" marker-end="url(#agent-state-sources-arrow)" style="stroke:var(--d-soft)"/><rect x="20" y="40" width="180" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="20" y="40" width="180" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="110" y="67.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Hooks</text><text x="110" y="87.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">the agent tells it</text><rect x="20" y="156" width="180" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="20" y="156" width="180" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="110" y="183.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Screen rules</text><text x="110" y="203.5" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-soft)">detect: in agent.yaml</text><rect x="330" y="80" width="200" height="84" rx="6" style="fill:var(--d-paper)"/><rect x="330" y="80" width="200" height="84" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="430" y="109" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Background process</text><text x="430" y="129" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">one state</text><text x="430" y="146" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">per agent</text><rect x="590" y="80" width="190" height="84" rx="6" style="fill:var(--d-paper)"/><rect x="590" y="80" width="190" height="84" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="685" y="109" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Where it shows</text><text x="685" y="129" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">tile, Layers panel,</text><text x="685" y="146" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">notifications, phone</text><text x="400" y="252" font-size="12.5" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">The screen decides until the first hook arrives; from then on, the hooks do.</text></svg>
