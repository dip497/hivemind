<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 890 268" width="890" height="268" role="img" aria-labelledby="agent-state-sources-title agent-state-sources-desc"><title id="agent-state-sources-title">How Hivemind knows</title><desc id="agent-state-sources-desc">Hooks the agent runs and rules read from its screen both reach the background process. Until the first hook arrives the screen decides; after it, the hooks do. The state goes to the tile, the Layers panel, notifications and your phone.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:var(--color-fd-muted-foreground);--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="agent-state-sources-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="agent-state-sources-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="agent-state-sources-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="agent-state-sources-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="agent-state-sources-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><path d="M 220 72 L 264 72 Q 272 72 272 80 L 272 96 Q 272 104 280 104 L 360 104" fill="none" stroke-width="1.25" marker-end="url(#agent-state-sources-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="277" y="79" width="46" height="18" rx="2" style="fill:var(--d-paper)"/><text x="282" y="91.85" font-size="11" class="m" text-anchor="start" style="fill:var(--d-muted)">exact</text><path d="M 220 188 L 264 188 Q 272 188 272 180 L 272 148 Q 272 140 280 140 L 360 140" fill="none" stroke-width="1.25" marker-end="url(#agent-state-sources-arrow)" style="stroke:var(--d-soft)"/><rect x="277" y="155" width="66" height="18" rx="2" style="fill:var(--d-paper)"/><text x="282" y="167.85" font-size="11" class="m" text-anchor="start" style="fill:var(--d-muted)">fallback</text><path d="M 580 122 L 650 122" fill="none" stroke-width="1.25" marker-end="url(#agent-state-sources-arrow)" style="stroke:var(--d-soft)"/><rect x="20" y="40" width="200" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="20" y="40" width="200" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="120" y="68" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Hooks</text><text x="120" y="86" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">the agent tells it</text><rect x="20" y="156" width="200" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="20" y="156" width="200" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="120" y="184" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Screen rules</text><text x="120" y="202" font-size="11.5" class="m" text-anchor="middle" style="fill:var(--d-soft)">detect: in agent.yaml</text><rect x="360" y="80" width="220" height="84" rx="6" style="fill:var(--d-paper)"/><rect x="360" y="80" width="220" height="84" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="470" y="110" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Background process</text><text x="470" y="128" font-size="12" text-anchor="middle" style="fill:var(--d-muted)">one state</text><text x="470" y="144" font-size="12" text-anchor="middle" style="fill:var(--d-muted)">per agent</text><rect x="650" y="80" width="220" height="84" rx="6" style="fill:var(--d-paper)"/><rect x="650" y="80" width="220" height="84" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="760" y="110" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Everywhere it shows</text><text x="760" y="128" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">tile, Layers panel,</text><text x="760" y="144" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">notifications, phone</text><text x="445" y="252" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">The screen decides until the first hook arrives; from then on, the hooks do.</text></svg>
