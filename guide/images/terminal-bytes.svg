<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 900 320" width="900" height="320" role="img" aria-labelledby="terminal-bytes-title terminal-bytes-desc"><title id="terminal-bytes-title">From an agent to its tile</title><desc id="terminal-bytes-desc">The agent program writes to its terminal in the background process, which keeps a copy of each screen and saves it to disk. The app gets the output and draws it in the tile; a tile that attaches again gets the screen replayed.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:var(--color-fd-muted-foreground);--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="terminal-bytes-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="terminal-bytes-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="terminal-bytes-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="terminal-bytes-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="terminal-bytes-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><path d="M 190 84 L 260 84" fill="none" stroke-width="1.25" marker-end="url(#terminal-bytes-arrow)" style="stroke:var(--d-soft)"/><rect x="199" y="57" width="52" height="18" rx="2" style="fill:var(--d-paper)"/><text x="225" y="69.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">output</text><path d="M 260 112 L 190 112" fill="none" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#terminal-bytes-arrow)" style="stroke:var(--d-soft)"/><rect x="206" y="121" width="38" height="18" rx="2" style="fill:var(--d-paper)"/><text x="225" y="133.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">keys</text><path d="M 480 84 L 560 84" fill="none" stroke-width="1.25" marker-end="url(#terminal-bytes-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="501" y="57" width="38" height="18" rx="2" style="fill:var(--d-paper)"/><text x="520" y="69.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">live</text><path d="M 560 112 L 480 112" fill="none" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#terminal-bytes-arrow)" style="stroke:var(--d-soft)"/><rect x="494" y="121" width="52" height="18" rx="2" style="fill:var(--d-paper)"/><text x="520" y="133.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">attach</text><path d="M 710 98 L 770 98" fill="none" stroke-width="1.25" marker-end="url(#terminal-bytes-arrow)" style="stroke:var(--d-soft)"/><path d="M 370 136 L 370 212" fill="none" stroke-width="1.25" marker-end="url(#terminal-bytes-arrow)" style="stroke:var(--d-soft)"/><rect x="375" y="165" width="46" height="18" rx="2" style="fill:var(--d-paper)"/><text x="380" y="177.85" font-size="11" class="m" text-anchor="start" style="fill:var(--d-muted)">saved</text><rect x="20" y="60" width="170" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="20" y="60" width="170" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="105" y="94" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Agent program</text><text x="105" y="112" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">claude, codex, …</text><rect x="260" y="60" width="220" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="260" y="60" width="220" height="76" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="370" y="94" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Background process</text><text x="370" y="112" font-size="12" text-anchor="middle" style="fill:var(--d-muted)">a copy of each screen</text><rect x="560" y="60" width="150" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="560" y="60" width="150" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="635" y="102" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Desktop app</text><rect x="770" y="60" width="110" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="770" y="60" width="110" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="825" y="102" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Tile</text><rect x="260" y="212" width="220" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="260" y="212" width="220" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="370" y="240" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Saved screens</text><text x="370" y="258" font-size="11.5" class="m" text-anchor="middle" style="fill:var(--d-soft)">sessions/&lt;id&gt;.json</text><text x="690" y="230" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">On attach the screen is replayed,</text><text x="690" y="248" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">then output goes on live.</text></svg>
