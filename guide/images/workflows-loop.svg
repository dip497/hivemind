<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 700 232" width="700" height="232" role="img" aria-labelledby="workflows-loop-title workflows-loop-desc"><title id="workflows-loop-title">One agent drives others</title><desc id="workflows-loop-desc">You, or a lead agent, start worker agents and send them work with hive ctl. Each worker replies when its turn ends; you collect it with hive ctl read or from your inbox. A worker that stops to ask something tells your inbox, and you answer or approve it.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:var(--color-fd-muted-foreground);--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="workflows-loop-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="workflows-loop-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="workflows-loop-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="workflows-loop-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="workflows-loop-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><path d="M 190 54 L 480 54" fill="none" stroke-width="1.25" marker-end="url(#workflows-loop-arrow)" style="stroke:var(--d-soft)"/><rect x="289" y="29" width="92" height="18" rx="2" style="fill:var(--d-paper)"/><text x="335" y="41.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">spawn · send</text><path d="M 480 102 L 190 102" fill="none" stroke-width="1.25" marker-end="url(#workflows-loop-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="265" y="109" width="140" height="18" rx="2" style="fill:var(--d-paper)"/><text x="335" y="121.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">reply: read · inbox</text><path d="M 575 116 L 575 162 Q 575 170 567 170 L 113 170 Q 105 170 105 162 L 105 116" fill="none" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#workflows-loop-arrow)" style="stroke:var(--d-soft)"/><rect x="225" y="161" width="230" height="18" rx="2" style="fill:var(--d-paper)"/><text x="340" y="173.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">asks something → inbox → approve</text><rect x="20" y="40" width="170" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="20" y="40" width="170" height="76" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="105" y="74" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">You or a lead agent</text><text x="105" y="92" font-size="11.5" class="m" text-anchor="middle" style="fill:var(--d-muted)">hive ctl</text><rect x="496" y="24" width="190" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><rect x="488" y="32" width="190" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper);stroke:var(--d-ruleSolid)"/><rect x="480" y="40" width="190" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="480" y="40" width="190" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="575" y="74" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Worker agents</text><text x="575" y="92" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">one per task</text><text x="350" y="216" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">hive ctl workflow runs fanout, pipeline and mapreduce over many workers.</text></svg>
