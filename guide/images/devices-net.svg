<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 800 344" width="800" height="344" role="img" aria-labelledby="devices-net-title devices-net-desc"><title id="devices-net-title">Two devices, one key each</title><desc id="devices-net-desc">Two devices talk directly when they can, and through the relay of your own server when they cannot. Your server also looks devices up, lets in only enrolled ones, and pushes notices to phones. Both ends encrypt with their own keys.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:color-mix(in oklch, var(--color-fd-foreground) 25%, var(--color-fd-muted-foreground));--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="devices-net-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="devices-net-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="devices-net-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="devices-net-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="devices-net-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><path d="M 200 104 L 600 104" fill="none" stroke-width="1.25" marker-end="url(#devices-net-arrow-accent)" marker-start="url(#devices-net-arrow-accent-start)" style="stroke:var(--d-accent)"/><rect x="324" y="76.5" width="152" height="19" rx="2" style="fill:var(--d-paper)"/><text x="400" y="90.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">direct, when it can</text><path d="M 200 140 L 242 140 Q 250 140 250 148 L 250 252 Q 250 260 258 260 L 300 260" fill="none" stroke-width="1.25" marker-end="url(#devices-net-arrow)" marker-start="url(#devices-net-arrow-start)" style="stroke:var(--d-soft)"/><rect x="255" y="186.5" width="48" height="19" rx="2" style="fill:var(--d-paper)"/><text x="260" y="200.2" font-size="12" class="m" text-anchor="start" style="fill:var(--d-muted)">relay</text><path d="M 500 260 L 542 260 Q 550 260 550 252 L 550 148 Q 550 140 558 140 L 600 140" fill="none" stroke-width="1.25" marker-end="url(#devices-net-arrow)" marker-start="url(#devices-net-arrow-start)" style="stroke:var(--d-soft)"/><rect x="497" y="186.5" width="48" height="19" rx="2" style="fill:var(--d-paper)"/><text x="540" y="200.2" font-size="12" class="m" text-anchor="end" style="fill:var(--d-muted)">relay</text><rect x="20" y="80" width="180" height="80" rx="6" style="fill:var(--d-paper)"/><rect x="20" y="80" width="180" height="80" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="110" y="115.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Your computer</text><text x="110" y="135.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">device key</text><rect x="600" y="80" width="180" height="80" rx="6" style="fill:var(--d-paper)"/><rect x="600" y="80" width="180" height="80" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="690" y="115.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Another device</text><text x="690" y="135.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">device key</text><rect x="300" y="220" width="200" height="84" rx="6" style="fill:var(--d-paper)"/><rect x="300" y="220" width="200" height="84" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="400" y="249" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Network server</text><text x="400" y="269" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">relay · lookup</text><text x="400" y="286" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">access · push</text><text x="400" y="332" font-size="12.5" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">On one network with no server, devices find each other there and nothing leaves it.</text></svg>
