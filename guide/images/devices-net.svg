<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 860 360" width="860" height="360" role="img" aria-labelledby="devices-net-title devices-net-desc"><title id="devices-net-title">Two devices, one key each</title><desc id="devices-net-desc">Two devices talk directly when they can, and through the relay of your own server when they cannot. Your server also looks devices up, lets in only enrolled ones, and pushes notices to phones. Both ends encrypt with their own keys.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:var(--color-fd-muted-foreground);--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="devices-net-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="devices-net-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="devices-net-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="devices-net-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="devices-net-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><path d="M 200 104 L 660 104" fill="none" stroke-width="1.25" marker-end="url(#devices-net-arrow-accent)" marker-start="url(#devices-net-arrow-accent-start)" style="stroke:var(--d-accent)"/><rect x="360" y="77" width="140" height="18" rx="2" style="fill:var(--d-paper)"/><text x="430" y="89.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">direct, when it can</text><path d="M 200 140 L 254 140 Q 262 140 262 148 L 262 252 Q 262 260 270 260 L 330 260" fill="none" stroke-width="1.25" marker-end="url(#devices-net-arrow)" marker-start="url(#devices-net-arrow-start)" style="stroke:var(--d-soft)"/><rect x="267" y="191" width="46" height="18" rx="2" style="fill:var(--d-paper)"/><text x="272" y="203.85" font-size="11" class="m" text-anchor="start" style="fill:var(--d-muted)">relay</text><path d="M 530 260 L 590 260 Q 598 260 598 252 L 598 148 Q 598 140 606 140 L 660 140" fill="none" stroke-width="1.25" marker-end="url(#devices-net-arrow)" marker-start="url(#devices-net-arrow-start)" style="stroke:var(--d-soft)"/><rect x="547" y="191" width="46" height="18" rx="2" style="fill:var(--d-paper)"/><text x="588" y="203.85" font-size="11" class="m" text-anchor="end" style="fill:var(--d-muted)">relay</text><rect x="20" y="80" width="180" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="20" y="80" width="180" height="76" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="110" y="114" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Your computer</text><text x="110" y="132" font-size="12" text-anchor="middle" style="fill:var(--d-muted)">device key</text><rect x="660" y="80" width="180" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="660" y="80" width="180" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="750" y="114" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Another device</text><text x="750" y="132" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">device key</text><rect x="330" y="220" width="200" height="80" rx="6" style="fill:var(--d-paper)"/><rect x="330" y="220" width="200" height="80" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="430" y="248" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Network server</text><text x="430" y="266" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">relay · lookup</text><text x="430" y="282" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">access · push</text><text x="430" y="336" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">On one network with no server, devices find each other there and nothing leaves it.</text></svg>
