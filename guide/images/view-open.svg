<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 920 520" width="920" height="520" role="img" aria-labelledby="view-open-title view-open-desc"><title id="view-open-title">An agent opens a view</title><desc id="view-open-desc">An agent runs hive ctl plugin open; the app asks the window to show the view; the window loads it in a sandboxed frame and hands it a message port; the view says ready, the window says hello with what the view may do, then sends it the workspace.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:var(--color-fd-muted-foreground);--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="view-open-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="view-open-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="view-open-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="view-open-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="view-open-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><line x1="120" y1="90" x2="120" y2="470" stroke-width="1" stroke-dasharray="4,4" style="stroke:var(--d-rule)"/><line x1="350" y1="90" x2="350" y2="470" stroke-width="1" stroke-dasharray="4,4" style="stroke:var(--d-rule)"/><line x1="580" y1="90" x2="580" y2="470" stroke-width="1" stroke-dasharray="4,4" style="stroke:var(--d-rule)"/><line x1="810" y1="90" x2="810" y2="470" stroke-width="1" stroke-dasharray="4,4" style="stroke:var(--d-rule)"/><path d="M 124 130 L 346 130" fill="none" stroke-width="1.25" marker-end="url(#view-open-arrow)" style="stroke:var(--d-soft)"/><rect x="158" y="105" width="154" height="18" rx="2" style="fill:var(--d-paper)"/><text x="235" y="117.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">plugin.open view:&lt;id&gt;</text><path d="M 354 174 L 576 174" fill="none" stroke-width="1.25" marker-end="url(#view-open-arrow)" style="stroke:var(--d-soft)"/><rect x="422" y="149" width="86" height="18" rx="2" style="fill:var(--d-paper)"/><text x="465" y="161.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">hcp:command</text><path d="M 584 218 L 806 218" fill="none" stroke-width="1.25" marker-end="url(#view-open-arrow)" style="stroke:var(--d-soft)"/><rect x="625" y="193" width="140" height="18" rx="2" style="fill:var(--d-paper)"/><text x="695" y="205.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">load hm-view://&lt;id&gt;</text><path d="M 584 262 L 806 262" fill="none" stroke-width="1.25" marker-end="url(#view-open-arrow)" style="stroke:var(--d-soft)"/><rect x="649" y="237" width="92" height="18" rx="2" style="fill:var(--d-paper)"/><text x="695" y="249.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">message port</text><path d="M 806 306 L 584 306" fill="none" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#view-open-arrow)" style="stroke:var(--d-soft)"/><rect x="672" y="281" width="46" height="18" rx="2" style="fill:var(--d-paper)"/><text x="695" y="293.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">ready</text><path d="M 584 350 L 806 350" fill="none" stroke-width="1.25" marker-end="url(#view-open-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="672" y="325" width="46" height="18" rx="2" style="fill:var(--d-paper)"/><text x="695" y="337.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">hello</text><path d="M 584 394 L 806 394" fill="none" stroke-width="1.25" marker-end="url(#view-open-arrow)" style="stroke:var(--d-soft)"/><rect x="632" y="369" width="126" height="18" rx="2" style="fill:var(--d-paper)"/><text x="695" y="381.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">structure, status</text><path d="M 806 438 L 584 438" fill="none" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#view-open-arrow)" style="stroke:var(--d-soft)"/><rect x="666" y="413" width="58" height="18" rx="2" style="fill:var(--d-paper)"/><text x="695" y="425.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">command</text><path d="M 346 218 L 124 218" fill="none" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#view-open-arrow)" style="stroke:var(--d-soft)"/><rect x="209" y="193" width="52" height="18" rx="2" style="fill:var(--d-paper)"/><text x="235" y="205.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">answer</text><text x="695" y="462" font-size="11.5" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">checked against its permissions</text><rect x="30" y="30" width="180" height="60" rx="6" style="fill:var(--d-paper)"/><rect x="30" y="30" width="180" height="60" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="120" y="56" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Agent</text><text x="120" y="74" font-size="11.5" class="m" text-anchor="middle" style="fill:var(--d-soft)">hive ctl</text><rect x="260" y="30" width="180" height="60" rx="6" style="fill:var(--d-paper)"/><rect x="260" y="30" width="180" height="60" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="350" y="56" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Main process</text><text x="350" y="74" font-size="11.5" class="m" text-anchor="middle" style="fill:var(--d-soft)">drive.sock</text><rect x="490" y="30" width="180" height="60" rx="6" style="fill:var(--d-paper)"/><rect x="490" y="30" width="180" height="60" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="580" y="56" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Window</text><text x="580" y="74" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">the renderer</text><rect x="720" y="30" width="180" height="60" rx="6" style="fill:var(--d-paper)"/><rect x="720" y="30" width="180" height="60" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="810" y="56" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">View</text><text x="810" y="74" font-size="12" text-anchor="middle" style="fill:var(--d-muted)">sandboxed frame</text><text x="460" y="504" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">The view has no files, no network and no Node. All it knows comes over its port.</text></svg>
