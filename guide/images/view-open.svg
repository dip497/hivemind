<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 800 556" width="800" height="556" role="img" aria-labelledby="view-open-title view-open-desc"><title id="view-open-title">An agent opens a view</title><desc id="view-open-desc">An agent runs hive ctl plugin open; the app asks the window to show the view; the window loads it in a sandboxed frame and hands it a message port; the view says ready, the window says hello with what the view may do, then sends it the workspace.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:color-mix(in oklch, var(--color-fd-foreground) 25%, var(--color-fd-muted-foreground));--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="view-open-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="view-open-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="view-open-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="view-open-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="view-open-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><line x1="100" y1="94" x2="100" y2="470" stroke-width="1" stroke-dasharray="4,4" style="stroke:var(--d-rule)"/><line x1="300" y1="94" x2="300" y2="470" stroke-width="1" stroke-dasharray="4,4" style="stroke:var(--d-rule)"/><line x1="500" y1="94" x2="500" y2="470" stroke-width="1" stroke-dasharray="4,4" style="stroke:var(--d-rule)"/><line x1="700" y1="94" x2="700" y2="470" stroke-width="1" stroke-dasharray="4,4" style="stroke:var(--d-rule)"/><path d="M 104 136 L 296 136" fill="none" stroke-width="1.25" marker-end="url(#view-open-arrow)" style="stroke:var(--d-soft)"/><rect x="116" y="110.5" width="168" height="19" rx="2" style="fill:var(--d-paper)"/><text x="200" y="124.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">plugin.open view:&lt;id&gt;</text><path d="M 304 180 L 496 180" fill="none" stroke-width="1.25" marker-end="url(#view-open-arrow)" style="stroke:var(--d-soft)"/><rect x="354" y="154.5" width="92" height="19" rx="2" style="fill:var(--d-paper)"/><text x="400" y="168.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">hcp:command</text><path d="M 504 224 L 696 224" fill="none" stroke-width="1.25" marker-end="url(#view-open-arrow)" style="stroke:var(--d-soft)"/><rect x="524" y="198.5" width="152" height="19" rx="2" style="fill:var(--d-paper)"/><text x="600" y="212.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">load hm-view://&lt;id&gt;</text><path d="M 296 224 L 104 224" fill="none" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#view-open-arrow)" style="stroke:var(--d-soft)"/><rect x="172" y="198.5" width="56" height="19" rx="2" style="fill:var(--d-paper)"/><text x="200" y="212.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">answer</text><path d="M 504 268 L 696 268" fill="none" stroke-width="1.25" marker-end="url(#view-open-arrow)" style="stroke:var(--d-soft)"/><rect x="550" y="242.5" width="100" height="19" rx="2" style="fill:var(--d-paper)"/><text x="600" y="256.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">message port</text><path d="M 696 312 L 504 312" fill="none" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#view-open-arrow)" style="stroke:var(--d-soft)"/><rect x="576" y="286.5" width="48" height="19" rx="2" style="fill:var(--d-paper)"/><text x="600" y="300.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">ready</text><path d="M 504 356 L 696 356" fill="none" stroke-width="1.25" marker-end="url(#view-open-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="576" y="330.5" width="48" height="19" rx="2" style="fill:var(--d-paper)"/><text x="600" y="344.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">hello</text><path d="M 504 400 L 696 400" fill="none" stroke-width="1.25" marker-end="url(#view-open-arrow)" style="stroke:var(--d-soft)"/><rect x="531" y="374.5" width="138" height="19" rx="2" style="fill:var(--d-paper)"/><text x="600" y="388.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">structure, status</text><path d="M 696 444 L 504 444" fill="none" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#view-open-arrow)" style="stroke:var(--d-soft)"/><rect x="568" y="418.5" width="64" height="19" rx="2" style="fill:var(--d-paper)"/><text x="600" y="432.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">command</text><text x="600" y="498" font-size="12.5" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">Each command is checked against its permissions.</text><rect x="15" y="30" width="170" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="15" y="30" width="170" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="100" y="57.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Agent</text><text x="100" y="77.5" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-soft)">hive ctl</text><rect x="215" y="30" width="170" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="215" y="30" width="170" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="300" y="57.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Main process</text><text x="300" y="77.5" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-soft)">drive.sock</text><rect x="415" y="30" width="170" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="415" y="30" width="170" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="500" y="57.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Window</text><text x="500" y="77.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">the renderer</text><rect x="615" y="30" width="170" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="615" y="30" width="170" height="64" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="700" y="57.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">View</text><text x="700" y="77.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">a sandboxed frame</text><text x="400" y="538" font-size="12.5" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">The view has no files, no network and no Node. All it knows comes over its port.</text></svg>
