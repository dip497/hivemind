<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 800 520" width="800" height="520" role="img" aria-labelledby="trust-boundary-title trust-boundary-desc"><title id="trust-boundary-title">What can reach what</title><desc id="trust-boundary-desc">Agents and tools run as you, with your files and network. Views and widgets run in a sandbox with no files and no network, and reach the workspace only through the permissions they asked for. Guests come in with a role and programs with a token. Your server sees only encrypted traffic; HiveHub files are checked before they install.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:color-mix(in oklch, var(--color-fd-foreground) 25%, var(--color-fd-muted-foreground));--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="trust-boundary-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="trust-boundary-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="trust-boundary-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="trust-boundary-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="trust-boundary-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><rect x="20" y="40" width="210" height="280" rx="10" fill="none" stroke-width="1" stroke-dasharray="5,4" style="stroke:var(--d-ruleSolid)"/><rect x="34" y="32" width="107" height="16" style="fill:var(--d-paper)"/><text x="40" y="44" font-size="12" class="m" letter-spacing="0.08em" style="fill:var(--d-soft)">RUNS AS YOU</text><rect x="570" y="40" width="210" height="460" rx="10" fill="none" stroke-width="1" stroke-dasharray="5,4" style="stroke:var(--d-ruleSolid)"/><rect x="584" y="32" width="115" height="16" style="fill:var(--d-paper)"/><text x="590" y="44" font-size="12" class="m" letter-spacing="0.08em" style="fill:var(--d-soft)">FROM OUTSIDE</text><rect x="250" y="304" width="300" height="132" rx="10" fill="none" stroke-width="1" stroke-dasharray="5,4" style="stroke:var(--d-ruleSolid)"/><rect x="264" y="296" width="73" height="16" style="fill:var(--d-paper)"/><text x="270" y="308" font-size="12" class="m" letter-spacing="0.08em" style="fill:var(--d-soft)">SANDBOX</text><text x="536" y="424" font-size="12.5" text-anchor="end" style="fill:var(--d-soft)">no files, no network</text><path d="M 210 116 L 242 116 Q 250 116 250 124 L 250 168 Q 250 176 258 176 L 300 176" fill="none" stroke-width="1.25" marker-end="url(#trust-boundary-arrow)" marker-start="url(#trust-boundary-arrow-start)" style="stroke:var(--d-soft)"/><path d="M 210 244 L 258 244 Q 266 244 266 236 L 266 208 Q 266 200 274 200 L 300 200" fill="none" stroke-width="1.25" marker-end="url(#trust-boundary-arrow)" marker-start="url(#trust-boundary-arrow-start)" style="stroke:var(--d-soft)"/><path d="M 590 116 L 558 116 Q 550 116 550 124 L 550 168 Q 550 176 542 176 L 500 176" fill="none" stroke-width="1.25" marker-end="url(#trust-boundary-arrow)" style="stroke:var(--d-soft)"/><rect x="505" y="126.5" width="40" height="19" rx="2" style="fill:var(--d-paper)"/><text x="540" y="140.2" font-size="12" class="m" text-anchor="end" style="fill:var(--d-muted)">role</text><path d="M 590 244 L 542 244 Q 534 244 534 236 L 534 208 Q 534 200 526 200 L 500 200" fill="none" stroke-width="1.25" marker-end="url(#trust-boundary-arrow)" style="stroke:var(--d-soft)"/><rect x="481" y="252.5" width="48" height="19" rx="2" style="fill:var(--d-paper)"/><text x="524" y="266.2" font-size="12" class="m" text-anchor="end" style="fill:var(--d-muted)">token</text><path d="M 350 336 L 350 228" fill="none" stroke-width="1.25" marker-end="url(#trust-boundary-arrow)" style="stroke:var(--d-soft)"/><path d="M 450 336 L 450 228" fill="none" stroke-width="1.25" marker-end="url(#trust-boundary-arrow)" style="stroke:var(--d-soft)"/><rect x="354" y="262.5" width="92" height="19" rx="2" style="fill:var(--d-paper)"/><text x="400" y="276.2" font-size="12" class="m" text-anchor="middle" style="fill:var(--d-muted)">permissions</text><rect x="40" y="84" width="170" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="40" y="84" width="170" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="125" y="111.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Agents</text><text x="125" y="131.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">in your terminals</text><rect x="40" y="212" width="170" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="40" y="212" width="170" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="125" y="239.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Tools</text><text x="125" y="259.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">start switched off</text><rect x="300" y="148" width="200" height="80" rx="6" style="fill:var(--d-paper)"/><rect x="300" y="148" width="200" height="80" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="400" y="183.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">The workspace</text><text x="400" y="203.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">agents, terminals</text><rect x="286" y="336" width="110" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="286" y="336" width="110" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="341" y="363.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Views</text><text x="341" y="383.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">a frame</text><rect x="404" y="336" width="110" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="404" y="336" width="110" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="459" y="363.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Widgets</text><text x="459" y="383.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">a worker</text><rect x="590" y="84" width="170" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="590" y="84" width="170" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="675" y="111.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Guests</text><text x="675" y="131.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">with a role</text><rect x="590" y="212" width="170" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="590" y="212" width="170" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="675" y="239.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Your programs</text><text x="675" y="259.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">with a token</text><rect x="590" y="330" width="170" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="590" y="330" width="170" height="64" rx="6" stroke-width="1" stroke-dasharray="4,3" style="fill:var(--d-paper);stroke:var(--d-ruleSolid)"/><text x="675" y="357.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Your server</text><text x="675" y="377.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">encrypted only</text><rect x="590" y="422" width="170" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="590" y="422" width="170" height="64" rx="6" stroke-width="1" stroke-dasharray="4,3" style="fill:var(--d-paper);stroke:var(--d-ruleSolid)"/><text x="675" y="449.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">HiveHub</text><text x="675" y="469.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">files checked</text></svg>
