<svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="trust-boundary-title trust-boundary-desc"><title id="trust-boundary-title">What can reach what</title><desc id="trust-boundary-desc">Agents and tools run as you, with your files and network. Views and widgets run in a sandbox with no files and no network, and reach the workspace only through the permissions they asked for. Guests come in with a role and programs with a token. Your server sees only encrypted traffic; HiveHub files are checked before they install.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:var(--color-fd-muted-foreground);--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="trust-boundary-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="trust-boundary-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="trust-boundary-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="trust-boundary-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="trust-boundary-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><rect x="20" y="40" width="250" height="280" rx="10" fill="none" stroke-width="1" stroke-dasharray="5,4" style="stroke:var(--d-ruleSolid)"/><rect x="34" y="32" width="99" height="16" style="fill:var(--d-paper)"/><text x="40" y="44" font-size="11" class="m" letter-spacing="0.08em" style="fill:var(--d-soft)">RUNS AS YOU</text><rect x="690" y="40" width="250" height="470" rx="10" fill="none" stroke-width="1" stroke-dasharray="5,4" style="stroke:var(--d-ruleSolid)"/><rect x="704" y="32" width="107" height="16" style="fill:var(--d-paper)"/><text x="710" y="44" font-size="11" class="m" letter-spacing="0.08em" style="fill:var(--d-soft)">FROM OUTSIDE</text><rect x="300" y="304" width="360" height="130" rx="10" fill="none" stroke-width="1" stroke-dasharray="5,4" style="stroke:var(--d-ruleSolid)"/><rect x="314" y="296" width="68" height="16" style="fill:var(--d-paper)"/><text x="320" y="308" font-size="11" class="m" letter-spacing="0.08em" style="fill:var(--d-soft)">SANDBOX</text><text x="646" y="422" font-size="11.5" text-anchor="end" style="fill:var(--d-soft)">no files, no network</text><path d="M 246 116 L 300 116 Q 308 116 308 124 L 308 168 Q 308 176 316 176 L 370 176" fill="none" stroke-width="1.25" marker-end="url(#trust-boundary-arrow)" marker-start="url(#trust-boundary-arrow-start)" style="stroke:var(--d-soft)"/><path d="M 246 244 L 316 244 Q 324 244 324 236 L 324 208 Q 324 200 332 200 L 370 200" fill="none" stroke-width="1.25" marker-end="url(#trust-boundary-arrow)" marker-start="url(#trust-boundary-arrow-start)" style="stroke:var(--d-soft)"/><path d="M 714 116 L 660 116 Q 652 116 652 124 L 652 168 Q 652 176 644 176 L 590 176" fill="none" stroke-width="1.25" marker-end="url(#trust-boundary-arrow)" style="stroke:var(--d-soft)"/><rect x="657" y="137" width="38" height="18" rx="2" style="fill:var(--d-paper)"/><text x="662" y="149.85" font-size="11" class="m" text-anchor="start" style="fill:var(--d-muted)">role</text><path d="M 714 244 L 644 244 Q 636 244 636 236 L 636 208 Q 636 200 628 200 L 590 200" fill="none" stroke-width="1.25" marker-end="url(#trust-boundary-arrow)" style="stroke:var(--d-soft)"/><rect x="641" y="261" width="46" height="18" rx="2" style="fill:var(--d-paper)"/><text x="646" y="273.85" font-size="11" class="m" text-anchor="start" style="fill:var(--d-muted)">token</text><path d="M 399 336 L 399 228" fill="none" stroke-width="1.25" marker-end="url(#trust-boundary-arrow)" style="stroke:var(--d-soft)"/><path d="M 561 336 L 561 228" fill="none" stroke-width="1.25" marker-end="url(#trust-boundary-arrow)" style="stroke:var(--d-soft)"/><rect x="437" y="261" width="86" height="18" rx="2" style="fill:var(--d-paper)"/><text x="480" y="273.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">permissions</text><rect x="44" y="84" width="202" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="44" y="84" width="202" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="145" y="112" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Agents</text><text x="145" y="130" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">in your terminals</text><rect x="44" y="212" width="202" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="44" y="212" width="202" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="145" y="240" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Tools</text><text x="145" y="258" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">start switched off</text><rect x="370" y="148" width="220" height="80" rx="6" style="fill:var(--d-paper)"/><rect x="370" y="148" width="220" height="80" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="480" y="184" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">The workspace</text><text x="480" y="202" font-size="12" text-anchor="middle" style="fill:var(--d-muted)">agents, terminals, board</text><rect x="324" y="336" width="150" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="324" y="336" width="150" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="399" y="364" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Views</text><text x="399" y="382" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">a sandboxed frame</text><rect x="486" y="336" width="150" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="486" y="336" width="150" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="561" y="364" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Widgets</text><text x="561" y="382" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">a worker</text><rect x="714" y="84" width="202" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="714" y="84" width="202" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="815" y="112" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Guests</text><text x="815" y="130" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">with a role</text><rect x="714" y="212" width="202" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="714" y="212" width="202" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="815" y="240" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Your programs</text><text x="815" y="258" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">with an API token</text><rect x="714" y="330" width="202" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="714" y="330" width="202" height="64" rx="6" stroke-width="1" stroke-dasharray="4,3" style="fill:var(--d-paper);stroke:var(--d-ruleSolid)"/><text x="815" y="358" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Your server</text><text x="815" y="376" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">sees encrypted traffic</text><rect x="714" y="422" width="202" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="714" y="422" width="202" height="64" rx="6" stroke-width="1" stroke-dasharray="4,3" style="fill:var(--d-paper);stroke:var(--d-ruleSolid)"/><text x="815" y="450" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">HiveHub</text><text x="815" y="468" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">files checked first</text></svg>
