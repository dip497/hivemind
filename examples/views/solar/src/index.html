<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Solar System</title>
  <style>
    /* The space palette is the scene's own; the CHROME (panel, buttons, tips)
       takes the user's theme via the --hm-* vars the SDK's applyThemeVars sets,
       with these as the fallback when the host sends nothing. */
    :root { --bg: var(--hm-surface, rgba(12, 14, 24, .62)); --line: var(--hm-color-line, rgba(255,255,255,.10)); --fg: var(--hm-color-fg, #e8eaf2); --fg2: var(--hm-color-fg2, #a9aec0); --fg3: var(--hm-color-fg3, #6f7488); --accent: var(--hm-accent, #8ab4ff); }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05060c; font: 12px/1.35 system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--fg); }
    canvas#c { display: block; cursor: grab; }
    canvas#c:active { cursor: grabbing; }
    #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .lbl { position: absolute; transform: translate(-50%, 0); white-space: nowrap; text-shadow: 0 1px 6px rgba(0,0,0,.9), 0 0 2px rgba(0,0,0,.9); letter-spacing: .02em; }
    .lbl.planet { font-weight: 600; font-size: 13px; }
    .lbl.planet small { display: block; font-weight: 400; font-size: 10.5px; color: var(--fg2); text-align: center; }
    .lbl.moon { font-size: 11px; color: var(--fg2); }
    .lbl.moon.hot { color: var(--fg); font-weight: 600; }
    .lbl .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; vertical-align: 0; box-shadow: 0 0 8px currentColor; }
    #panel { position: absolute; left: 14px; top: 14px; width: 248px; max-height: calc(100% - 28px); overflow: auto; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; backdrop-filter: blur(18px) saturate(1.3); -webkit-backdrop-filter: blur(18px) saturate(1.3); box-shadow: 0 10px 40px rgba(0,0,0,.45); padding: 12px 12px 10px; }
    #panel h1 { margin: 0 0 2px; font-size: 13px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--fg); }
    #panel .sub { color: var(--fg3); font-size: 11px; margin-bottom: 10px; }
    .planet-row { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 9px; cursor: pointer; }
    .planet-row:hover { background: rgba(255,255,255,.06); }
    .planet-row.active { background: rgba(255,255,255,.10); }
    .planet-row .swatch { width: 10px; height: 10px; border-radius: 50%; flex: none; box-shadow: 0 0 10px currentColor; }
    .planet-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
    .planet-row .count { color: var(--fg3); font-size: 11px; }
    .moon-row { display: flex; align-items: center; gap: 8px; padding: 4px 8px 4px 26px; border-radius: 8px; cursor: pointer; color: var(--fg2); }
    .moon-row:hover { background: rgba(255,255,255,.06); color: var(--fg); }
    .moon-row.docked { color: var(--fg); background: color-mix(in srgb, var(--accent) 18%, transparent); }
    .moon-row .dot { width: 7px; height: 7px; border-radius: 50%; flex: none; box-shadow: 0 0 8px currentColor; }
    .moon-row .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .moon-row .st { font-size: 10px; color: var(--fg3); text-transform: uppercase; letter-spacing: .06em; }
    #panel .legend { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; padding-top: 8px; border-top: 1px solid var(--line); color: var(--fg3); font-size: 10.5px; }
    #panel .legend span::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 5px; background: currentColor; box-shadow: 0 0 6px currentColor; }
    #topbar { position: absolute; top: 14px; right: 14px; display: flex; gap: 8px; align-items: center; }
    .btn { background: var(--bg); border: 1px solid var(--line); color: var(--fg); border-radius: 10px; padding: 7px 11px; font: inherit; font-size: 12px; cursor: pointer; backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); }
    .btn:hover { background: rgba(255,255,255,.10); }
    .btn.on { border-color: color-mix(in srgb, var(--accent) 60%, transparent); color: var(--accent); }
    #crumb { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; font-size: 12px; color: var(--fg2); backdrop-filter: blur(18px); -webkit-backdrop-filter: blur(18px); pointer-events: none; }
    #crumb b { color: var(--fg); font-weight: 600; }
    #hint { position: absolute; left: 14px; bottom: 12px; color: var(--fg3); font-size: 11px; pointer-events: none; }
    #tip { position: absolute; pointer-events: none; display: none; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 5px 9px; font-size: 11.5px; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); white-space: nowrap; }
    #tip .st { color: var(--fg3); margin-left: 6px; text-transform: uppercase; font-size: 10px; letter-spacing: .06em; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="labels"></div>
  <div id="crumb"><b>Solar System</b></div>
  <div id="topbar"><button class="btn" id="back" hidden>← System</button><button class="btn on" id="motion">Motion</button></div>
  <aside id="panel"><h1>Solar System</h1><div class="sub" id="sub"></div><div id="list"></div>
    <div class="legend"><span style="color:#60a5fa">idle</span><span style="color:#4ade80">working</span><span style="color:#fbbf24">blocked</span><span style="color:#f87171">exited</span></div></aside>
  <div id="hint"></div>
  <div id="tip"></div>
  <script type="module" src="./solar.js"></script>
</body>
</html>
