# Continue — a catalog agent. Launch only: no status reading, resume or turn reports.
manifestVersion: 1
id: continue
label: "Continue"
bin: cn
enabled: true
caps:
  promptDelivery: typed
  turnSignal: false
  resume: none
  supervise: human
  blockedDetection: false
options:
  - id: model
    label: "Model"
    flag: --model
  - id: mode
    label: "Approval"
    values:
      auto: ["--auto"]
      plan: ["--readonly"]
    unattended: auto
install:
  url: https://github.com/continuedev/continue/tree/main/extensions/cli
  command: "npm i -g @continuedev/cli"
note: "launches only: Hivemind does not read its status yet, and other agents cannot collect its replies."
