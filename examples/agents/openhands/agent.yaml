# OpenHands — a catalog agent. Launch only: no status reading, resume or turn reports.
manifestVersion: 1
id: openhands
label: "OpenHands"
bin: openhands
enabled: true
caps:
  promptDelivery: typed
  turnSignal: false
  resume: none
  supervise: human
  blockedDetection: false
options:
  - id: mode
    label: "Approval"
    values:
      always-approve: ["--always-approve"]
    unattended: always-approve
install:
  url: https://docs.openhands.dev/openhands/usage/cli
  command: "uv tool install openhands --python 3.12"
note: "launches only: Hivemind does not read its status yet, and other agents cannot collect its replies."
