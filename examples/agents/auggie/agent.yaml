# Auggie — a catalog agent. Launch only: no status reading, resume or turn reports.
manifestVersion: 1
id: auggie
label: "Auggie"
bin: auggie
enabled: true
caps:
  promptDelivery: typed
  turnSignal: false
  resume: none
  supervise: human
  blockedDetection: false
options:
  - id: model
    label: "Model"
    flag: --model
install:
  url: https://docs.augmentcode.com/cli/overview
  command: "npm install -g @augmentcode/auggie@latest"
note: "launches only: Hivemind does not read its status yet, and other agents cannot collect its replies."
