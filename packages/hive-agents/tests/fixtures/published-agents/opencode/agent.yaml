# opencode — built-in provider manifest.
# Authoring format for the def half. See packages/hive-agents/src/manifest.ts.
manifestVersion: 2
# Written for the agent host that shipped in this release.
minAppVersion: '2026.9.6'
id: opencode
label: opencode
bin: opencode
aliases:
- open-code
enabled: true
caps:
  promptDelivery: typed
  turnSignal: true
  resume: none
  supervise: human
  blockedDetection: true
icon:
  viewBox: -3 6 30 30
  attrs:
    fill: currentColor
  shapes:
  - path:
      d: M18 30H6V18H18V30Z
      opacity: '0.65'
  - path:
      d: M18 12H6V30H18V12ZM24 36H0V6H24V36Z
options:
- id: mode
  label: Approval
  values:
    auto:
    - --auto
- id: model
  label: Model
  flag: --model
  list:
    args:
    - models
session:
  list:
    args: [session, list, --format, json, --pure]
    idPath: id
    cwdPath: directory
    titlePath: title
    updatedPath: updated
  resume:
    args: [--session, '{id}']
    from:
      tracked: true
# OpenCode merges the file OPENCODE_CONFIG names into the user's own configuration; ours only
# adds the plugin, which reports through the host's SDK.
assets:
- name: hive-opencode.json
  file: hive-opencode.json
- name: hive-opencode.js
  file: hive-opencode.js
launch:
  hcp: true
  env:
    OPENCODE_CONFIG: '{asset:hive-opencode.json}'
install:
  url: https://opencode.ai/docs/
  command: "curl -fsSL https://opencode.ai/install | bash"
detect:
  rules:
  - when:
      any:
      - containsCS: △ Permission required
      - all:
        - contains: esc dismiss
        - any:
          - contains: enter confirm
          - contains: enter submit
          - contains: enter toggle
        - any:
          - containsCS: ↑↓ select
          - containsCS: ⇆ tab
    then: blocked
  - when:
      helper: hasInterruptPattern
    then: working
  default: idle
