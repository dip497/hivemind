spawn:
  label: 'claude #{n}'
  labelMode: " · {mode}"
  titles:
  - Claude Code
options:
- id: mode
  label: Permission mode
  flag: --permission-mode
  values:
    bypassPermissions:
    - --dangerously-skip-permissions
  unattended: bypassPermissions
- id: model
  label: Model
  flag: --model
- id: effort
  label: Effort
  flag: --effort
install:
  url: https://code.claude.com/docs/en/setup
  command: "curl -fsSL https://claude.ai/install.sh | bash"
detect:
  scope:
    kind: tail
    n: 20
  rules:
  - when:
      seq:
      - run: space
        min: 0
      - lit: "2."
      - run: space
        min: 1
      - lit: "Yes,"
      - run: space
        min: 1
      at: start
    then: permission
  - when:
      any:
      - seq:
        - run: space
          min: 0
        - lit: press enter
        at: start
        ci: true
      - contains: Enter to select
      - containsCS: "\u2191/\u2193 to navigate"
      - contains: Esc to cancel
      - contains: "[use arrows"
    then: question
  - when:
      contains: esc to interrupt
    then: working
  - when:
      seq:
      - run: "\u2191\u2193\u00b7("
        min: 1
        max: 1
      - run: space
        min: 0
      - run: "0123456789.,"
        min: 1
      - run: space
        min: 0
      - run: k
        min: 0
        max: 1
      - run: space
        min: 0
      - lit: tokens
      ci: true
    then: working
  - when:
      seq:
      - run: "\u273b\u2736\u2733\u2722\u273d\u22c6\u273a\u2739\u2738\u2737\u2735\u2734\u2732\u2731\u25cf\u25cb\u25d0\u25d3\u25d1\u25d2\u25cd\u25cc*\u00b7\u271a\u2726\u2727"
        min: 1
        max: 1
      - run: space
        min: 1
      - run: "!space"
        min: 1
        max: 1
      - upTo: "\u2026"
    then: working
  - when:
      all:
      - any:
        - seq:
          - lit: "("
          - run: digit
            min: 1
          - lit: m
          - run: space
            min: 0
          - run: digit
            min: 1
          - lit: s
          - notNext: word
        - seq:
          - lit: "("
          - run: digit
            min: 1
          - lit: s
          - run: space
            min: 0
          - lit: "\u00b7"
      - any:
        - contains: tokens
        - contains: interrupt
        - contains: thinking
        - contains: effort
    then: working
  - when:
      seq:
      - lit: "waiting for "
      - run: digit
        min: 1
      - lit: " background agent"
      - run: s
        min: 0
        max: 1
      - notNext: word
      ci: true
    then: working
    scope:
      kind: screen
  - when:
      any:
      - seq:
        - run: "\u276f>"
          min: 1
          max: 1
        - run: space
          min: 1
          max: 1
        - notNext: digit
        at: start
      - seq:
        - run: "\u276f>"
          min: 1
          max: 1
        - end: true
        at: start
    then: idle
  - when:
      all:
      - seq:
        - lit: "\u23f5\u23f5"
        - run: space
          min: 0
        - any:
          - bypass permissions
          - accept edits
        ci: true
      - not:
          any:
          - containsCS: "\u2502"
          - containsCS: "\u256d"
          - containsCS: "\u2570"
    then: idle
  default: working
session:
  bind:
    args:
    - --session-id
    - '{newId}'
    unless:
    - --session-id
    - --resume
    - -r
    - --continue
    - -c
    - --from-pr
  resume:
    args:
    - --resume
    - '{id}'
    position: before
    from:
      tracked: true
      bound: --session-id
    fallback:
    - --continue
hooks:
  arg: --settings
  template: '{"hooks":{events}}'
  events:
    SessionStart:
      hook: tracker
    PreToolUse:
    - hook: plan
      matcher: ExitPlanMode
      timeout: 345600
    - hook: approval
      matcher: supervise
      when: supervised
      timeout: 600
    Stop:
      hook: stop
      timeout: 10
    SubagentStart:
      hook: subagent
      timeout: 10
    SubagentStop:
      hook: subagent
      timeout: 10
    Notification:
      hook: notification
      timeout: 10
    UserPromptSubmit:
      hook: userPrompt
      timeout: 10
launch:
  hcp: true
