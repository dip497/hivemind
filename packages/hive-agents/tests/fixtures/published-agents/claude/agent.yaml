spawn:
  label: 'claude #{n}'
  titles:
  - Claude Code
# Answering its permission prompt from another of your devices (a phone's Allow / Deny), read
# from claude 2.1.287: its chooser takes a digit as that option, and the first is always "Yes";
# Esc is "No, and tell Claude what to do differently".
answer:
  permission:
    allow:
    - '1'
    deny:
    - escape
  # Its trust prompt, read from claude 2.1.296: "No, exit" is selected first and digits do
  # nothing, so Down then Enter trusts the folder; Esc exits.
  trust:
    allow:
    - down
    - enter
    deny:
    - escape
  # A settings file it cannot read, from claude 2.1.296: "3. Continue without these settings";
  # Esc exits.
  settings:
    allow:
    - '3'
    deny:
    - escape
  # A settings rule it skipped, from claude 2.1.302: "1. Continue"; "3. Exit and fix manually"
  # exits (Esc continues too, so it is no deny).
  settings-warning:
    allow:
    - '1'
    deny:
    - '3'
# An option of its AskUserQuestion chooser, read from claude 2.1.296: a digit chooses that option
# and sends it, for one question with one choice.
choose:
- '{n}'
# The key that interrupts its turn, typed from your phone's Stop: claude 2.1.287 says "esc to
# interrupt" while it works.
interrupt:
- escape
# A message typed while it works is queued and read at its next step: claude 2.1.289 shows
# "Press up to edit queued messages".
steer: true
# Its prompt with nothing typed, read from claude 2.1.309: the cursor sits right after "❯ ", before
# the dim suggestion it shows there; the person's words come between the two.
emptyPrompt:
  when:
    seq:
    - lit: ❯
    - run: space
      min: 0
    - end: true
    at: start
  scope:
    kind: tail
    n: 1
options:
- id: mode
  label: Permission mode
  flag: --permission-mode
  values:
    bypassPermissions:
    - --dangerously-skip-permissions
  unattended: bypassPermissions
- id: model
  label: Model
  flag: --model
- id: effort
  label: Effort
  flag: --effort
install:
  url: https://code.claude.com/docs/en/setup
  command: "curl -fsSL https://claude.ai/install.sh | bash"
detect:
  scope:
    kind: tail
    n: 20
  rules:
  - when:
      all:
      - contains: Yes, I trust this folder
      - contains: Enter to confirm
    then: permission
    says: trust
  - when:
      all:
      - containsCS: Settings Error
      - contains: Continue without these settings
    then: permission
    says: settings
  - when:
      all:
      - containsCS: Settings Warning
      - contains: 1. Continue
    then: permission
    says: settings-warning
  # Its one-time warning for its unattended mode, read from the claude 2.1.302 binary. It has no
  # answer keys: accepting it is the person's own consent, given at the terminal.
  - when:
      all:
      - containsCS: Bypass Permissions mode
      - contains: Yes, I accept
    then: permission
    says: bypass
  - when:
      seq:
      - run: space
        min: 0
      - lit: "2."
      - run: space
        min: 1
      - lit: "Yes,"
      - run: space
        min: 1
      at: start
    then: permission
  - when:
      any:
      - seq:
        - run: space
          min: 0
        - lit: press enter
        at: start
        ci: true
      - contains: Enter to select
      - containsCS: "\u2191/\u2193 to navigate"
      - contains: Esc to cancel
      - contains: "[use arrows"
      # Its chooser's selected option, its footer cut (a viewer's repaint shrinks the screen a
      # row): above it, the person's last message starts with the prompt's mark too, and may start
      # with a number ("❯ 1. fix the login"). The chooser takes the place of its empty prompt.
      - all:
        - seq:
          - run: "❯"
            min: 1
            max: 1
          - run: space
            min: 1
            max: 1
          - run: digit
            min: 1
          - lit: ". "
          at: start
        - not:
            seq:
            - run: "❯"
              min: 1
              max: 1
            - run: space
              min: 0
            - end: true
            at: start
    then: question
  - when:
      contains: esc to interrupt
    then: working
  - when:
      seq:
      - run: "\u2191\u2193\u00b7("
        min: 1
        max: 1
      - run: space
        min: 0
      - run: "0123456789.,"
        min: 1
      - run: space
        min: 0
      - run: k
        min: 0
        max: 1
      - run: space
        min: 0
      - lit: tokens
      ci: true
    then: working
  - when:
      seq:
      - run: "\u273b\u2736\u2733\u2722\u273d\u22c6\u273a\u2739\u2738\u2737\u2735\u2734\u2732\u2731\u25cf\u25cb\u25d0\u25d3\u25d1\u25d2\u25cd\u25cc*\u00b7\u271a\u2726\u2727"
        min: 1
        max: 1
      - run: space
        min: 1
      - run: "!space"
        min: 1
        max: 1
      - upTo: "\u2026"
    then: working
  - when:
      all:
      - any:
        - seq:
          - lit: "("
          - run: digit
            min: 1
          - lit: m
          - run: space
            min: 0
          - run: digit
            min: 1
          - lit: s
          - notNext: word
        - seq:
          - lit: "("
          - run: digit
            min: 1
          - lit: s
          - run: space
            min: 0
          - lit: "\u00b7"
      - any:
        - contains: tokens
        - contains: interrupt
        - contains: thinking
        - contains: effort
    then: working
  - when:
      seq:
      - lit: "waiting for "
      - run: digit
        min: 1
      - lit: " background agent"
      - run: s
        min: 0
        max: 1
      - notNext: word
      ci: true
    then: working
    scope:
      kind: screen
  - when:
      seq:
      - lit: "waiting for "
      - run: digit
        min: 1
      - lit: " dynamic workflow"
      - run: s
        min: 0
        max: 1
      - notNext: word
      ci: true
    then: working
    scope:
      kind: screen
  - when:
      any:
      - seq:
        - run: "\u276f>"
          min: 1
          max: 1
        - run: space
          min: 1
          max: 1
        - notNext: digit
        at: start
      - seq:
        - run: "\u276f>"
          min: 1
          max: 1
        - end: true
        at: start
    then: idle
  - when:
      all:
      - seq:
        - lit: "\u23f5\u23f5"
        - run: space
          min: 0
        - any:
          - bypass permissions
          - accept edits
        ci: true
      - not:
          any:
          - containsCS: "\u2502"
          - containsCS: "\u256d"
          - containsCS: "\u2570"
    then: idle
  default: working
  # Rows of its own above its input, which a tile's last line passes over, read from the claude
  # 2.1.309 binary: its effort right of the rule ("◐ medium · /effort"), its spinner while it works
  # ("✻ Combobulating…", "* Newspapering… (2s · ↓ 2 tokens)") and what it says as a turn ends
  # ("✻ Crunched for 2s · done 6:51 PM"). Its messages open with "●" at the first column and go on
  # two columns in, so neither is taken for these.
  chrome:
    any:
    - seq:
      - lit: " · /effort"
    - seq:
      - run: "✻✶✳✢✽⋆✺✹✸✷✵✴✲✱*·✚✦✧"
        min: 1
        max: 1
      - run: space
        min: 1
        max: 1
      - run: "!space"
        min: 1
        max: 1
      - upTo: "…"
      at: start
    - seq:
      - run: "✻✶✳✢✽⋆✺✹✸✷✵✴✲✱*·✚✦✧"
        min: 1
        max: 1
      - run: space
        min: 1
        max: 1
      - run: word
        min: 1
      - lit: " for "
      - run: digit
        min: 1
      at: start
session:
  # Each transcript's first lines carry its folder, its title, and the user's first prompt.
  list:
    lines: 30
    cwdPath: cwd
    titlePath: [aiTitle, message.content]
    promptPath: message.content
  bind:
    args:
    - --session-id
    - '{newId}'
    unless:
    - --session-id
    - --resume
    - -r
    - --continue
    - -c
    - --from-pr
  resume:
    args:
    - --resume
    - '{id}'
    position: before
    from:
      tracked: true
      bound: --session-id
    fallback:
    - --continue
    exists: '{home}/.claude/projects/*/{id}.jsonl'
  # The session file, read as the conversation your phone shows: one record a line; the person's
  # prompts, what Claude says, the tools it uses and what they gave back. Its side threads
  # (sidechains) and the meta records it writes for itself say nothing.
  transcript:
    id: uuid
    at: timestamp
    skipWhen: { isSidechain: true, isMeta: true }
    said:
    - require: { type: user }
      text: message.content
      who: person
    - require: { type: user }
      each: message.content
      item: { type: text }
      text: text
      who: person
    # A message typed while it works, taken into that turn at its next step, read from claude
    # 2.1.303: not a prompt record but a queued_command attachment. A task's notification, queued
    # the same way, is not the person's.
    - require: { type: attachment, attachment.type: queued_command, attachment.commandMode: prompt }
      text: attachment.prompt
      who: person
    - require: { type: user }
      each: message.content
      item: { type: tool_result }
      result: { of: tool_use_id, text: content, error: is_error }
    - require: { type: assistant }
      each: message.content
      item: { type: text }
      text: text
      who: agent
    - require: { type: assistant }
      each: message.content
      item: { type: tool_use }
      tool:
        id: id
        name: name
        about: [input.file_path, input.path, input.command, input.pattern, input.url, input.query, input.description]
        input: input
        # AskUserQuestion's: its questions, each with the options to choose from.
        asks: { list: input.questions, question: question, options: options, label: label, description: description, many: multiSelect }
hooks:
  arg: --settings
  template: '{"hooks":{events}}'
  events:
    SessionStart:
    - hook: tracker
    - emit: session.started
      timeout: 10
    SessionEnd:
      emit: session.ended
      timeout: 10
    UserPromptSubmit:
      emit: turn.started
      timeout: 10
    Stop:
      hook: turnEnd
      timeout: 10
    StopFailure:
    - emit: turn.ended
      outcome: limited
      matcher: rate_limit
      timeout: 10
    - emit: turn.ended
      outcome: failed
      matcher: overloaded|authentication_failed|oauth_org_not_allowed|account_on_hold|billing_error|invalid_request|model_not_found|server_error|max_output_tokens|cloud_credential_error|unknown
      timeout: 10
    # Its hook carries the answer from your other devices, read from claude 2.1.296: it races the
    # chooser, which is drawn 0.2 s after the hook starts; the first to answer wins. Held up to an hour.
    PermissionRequest:
      emit: input.requested
      kind: permission
      timeout: 3600
      answer:
        allow: {hookSpecificOutput: {hookEventName: PermissionRequest, decision: {behavior: allow}}}
        deny: {hookSpecificOutput: {hookEventName: PermissionRequest, decision: {behavior: deny, message: '{message}'}}}
        # AskUserQuestion's chooser fires it too: the answers go in its input, by question text.
        choose: {hookSpecificOutput: {hookEventName: PermissionRequest, decision: {behavior: allow, updatedInput: '{input}'}}}
        asks: {list: questions, question: question, options: options, label: label, description: description, many: multiSelect}
        chosen: answers
        # A plan is reviewed by its own hook.
        leave: [ExitPlanMode]
    Elicitation:
      emit: input.requested
      kind: question
      timeout: 10
    PostToolUse:
      emit: input.resolved
      timeout: 10
    PostToolUseFailure:
      emit: input.resolved
      timeout: 10
    PermissionDenied:
      emit: input.resolved
      timeout: 10
    SubagentStart:
      emit: subagent.started
      timeout: 10
    SubagentStop:
      emit: subagent.stopped
      timeout: 10
    PreCompact:
      emit: compacting.started
      timeout: 10
    PostCompact:
      emit: compacting.ended
      timeout: 10
    PreToolUse:
    - hook: planReview
      matcher: ExitPlanMode
      timeout: 345600
    - hook: approve
      matcher: supervise
      when: supervised
      timeout: 600
assets:
- name: hive-turn-end.cjs
  file: hive-turn-end.cjs
  hook: turnEnd
  produces: [turn.ended]
- name: hive-plan-review.cjs
  file: hive-plan-review.cjs
  hook: planReview
- name: hive-approve.cjs
  file: hive-approve.cjs
  hook: approve
launch:
  hcp: true
  # A claude that inherits this marker thinks it is a nested session and saves no transcript,
  # so it could not be resumed. The app may itself run inside Claude Code.
  unsetEnv:
  - CLAUDE_CODE_CHILD_SESSION
  env:
    CLAUDE_CODE_FORCE_SESSION_PERSISTENCE: '1'
