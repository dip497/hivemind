# Claude — built-in provider manifest.
# Authoring format for the def half. See packages/hive-agents/src/manifest.ts.
manifestVersion: 2
# Written for the agent host that shipped in this release.
minAppVersion: '2026.9.6'
id: claude
label: Claude
bin: claude
aliases:
- claude-code
enabled: true
caps:
  promptDelivery: argv
  turnSignal: true
  resume: tile
  supervise: broker
  blockedDetection: true
