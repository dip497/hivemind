# Kiro — built-in provider manifest.
# Authoring format for the def half. See packages/hive-agents/src/manifest.ts.
manifestVersion: 1
id: kiro
label: Kiro
bin: kiro-cli
aliases:
- kiro
enabled: true
caps:
  promptDelivery: typed
  turnSignal: true
  resume: tile
  supervise: broker
  blockedDetection: true
icon:
  viewBox: 0 0 24 24
  attrs:
    fill: currentColor
    fillRule: evenodd
  shapes:
  - path:
      d: M4.594 6.677C6.67-2.226 18.746-2.211 21.16 6.632c.353 1.297 1.725 7.582-1.673 13.747-1.545 2.797-5.841
        5.49-6.99 1.883C8.6 25.477 3.315 24.1 5.789 18.609l-.318.143c-3.57 1.305-3.863-1.208-3.173-2.513.45-.84.727-1.335.937-1.897.353-.975.458-1.568.593-2.498.27-1.837.277-3.607.765-5.167zm8.37.01a.92.92
        0 00-.81.428c-.217.323-.33.825-.33 1.462 0 .705.15 1.89 1.14 1.89h.008c.757 0 1.214-.705 1.214-1.89
        0-.622-.127-1.125-.367-1.455a1.014 1.014 0 00-.855-.435zm4.08 0a.92.92 0 00-.81.428c-.217.323-.33.825-.33
        1.462 0 .705.15 1.89 1.14 1.89h.008c.757 0 1.215-.705 1.215-1.89 0-.622-.128-1.125-.368-1.455a1.014
        1.014 0 00-.855-.435z
install:
  url: https://kiro.dev/docs/cli/
  command: "curl -fsSL https://cli.kiro.dev/install | bash"
detect:
  rules:
  - when:
      any:
      - all:
        - any:
          - contains: enter to select
          - contains: enter to confirm
          - contains: ↑/↓
          - contains: y/n
        - all:
          - contains: allow
          - any:
            - contains: deny
            - contains: reject
            - contains: trust
      - helper: hasConfirmationPrompt
    then: blocked
  - when:
      any:
      - contains: kiro is working
      - all:
        - contains: esc to cancel
        - line:
          - letterAfterPrefix:
            - ◔
            - ◑
            - ◕
            - ●
    then: working
  default: idle
home:
  root: kiro-home
  dir: .kiro
  mirror: '{home}/.kiro'
  env: KIRO_HOME
assets:
- name: hcp-kiro-approval-hook.cjs
  file: hcp-kiro-approval-hook.cjs
hooks:
  file: agents/hivemind.json
  template: '{"name":"hivemind","description":"hivemind control-plane wiring (auto-generated — do not edit by hand)","hooks":{events}}'
  entry:
    command: '{command}'
    matcher: '{matcher}'
  group: false
  events:
    agentSpawn:
      hook: tracker
    userPromptSubmit:
    - hook: tracker
    - hook: userPrompt
    stop:
      hook: stop
    preToolUse:
      hook: kiroApproval
      matcher: '*'
session:
  resume:
    args:
    - --resume-id
    - '{id}'
    fallback:
    - --resume
    position: beforeLaunch
    from:
      tracked: true
launch:
  hcp: true
  requiresHome: true
  subcommand: chat
  args:
  - --agent
  - hivemind
