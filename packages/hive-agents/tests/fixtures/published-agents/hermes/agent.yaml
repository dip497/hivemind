# Hermes — built-in provider manifest.
# Authoring format for the def half. See packages/hive-agents/src/manifest.ts.
manifestVersion: 1
id: hermes
label: Hermes
bin: hermes
aliases:
  - hermes-agent
enabled: true
caps:
  promptDelivery: typed
  turnSignal: false
  resume: none
  supervise: human
  blockedDetection: true
options:
  - id: model
    label: Model
    flag: --model
  - id: mode
    label: Approval
    values:
      yolo:
        - --yolo
    unattended: yolo
install:
  url: https://hermes-agent.nousresearch.com/docs/getting-started/installation
  command: "curl -fsSL https://hermes-agent.nousresearch.com/install.sh | bash"
detect:
  rules:
    - when:
        all:
          - any:
              - contains: dangerous command
              - all:
                  - contains: allow once
                  - contains: allow for this session
                  - contains: deny
          - any:
              - contains: enter to confirm
              - contains: ↑/↓ to select
              - contains: show full command
      then: blocked
    - when:
        any:
          - contains: msg=interrupt
          - contains: ctrl+c cancel
      then: working
  default: idle
note: launches and reads status; other agents cannot collect its replies.
