# OpenClaw — built-in provider manifest.
# Authoring format for the def half. See packages/hive-agents/src/manifest.ts.
manifestVersion: 1
id: openclaw
label: OpenClaw
bin: openclaw
enabled: false
caps:
  promptDelivery: typed
  turnSignal: false
  resume: none
  supervise: human
  blockedDetection: false
icon:
  viewBox: 0 0 16 16
  attrs:
    fill: none
  shapes:
  - rect:
      x: '2.5'
      y: '4'
      width: '11'
      height: '8.5'
      rx: '2'
      stroke: currentColor
      stroke-width: '1.2'
  - circle:
      cx: '6'
      cy: '8'
      r: '1'
      fill: currentColor
  - circle:
      cx: '10'
      cy: '8'
      r: '1'
      fill: currentColor
  - path:
      d: M8 4V2M5.5 12.5v1M10.5 12.5v1
      stroke: currentColor
      stroke-width: '1.2'
      stroke-linecap: round
note: not spawnable and not status-scraped yet; no detector strings captured.
