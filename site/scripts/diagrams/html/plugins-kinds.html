<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Where each kind of plugin sits</title><style>body{margin:0;background:#f6f7f8;padding:2rem}@media (prefers-color-scheme:dark){body{background:#141517}}.diagram-container{overflow-x:auto}svg{display:block;width:100%;height:auto;min-width:525px;max-width:700px}</style></head><body><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 700 340" width="700" height="340" role="img" aria-labelledby="plugins-kinds-title plugins-kinds-desc"><title id="plugins-kinds-title">Where each kind of plugin sits</title><desc id="plugins-kinds-desc">A view draws the whole workspace. Inside it sit tiles: an agent tile started from an agent file, a terminal, and a tool tile drawn by a tool plugin. A widget is a small card that floats above every view.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:var(--color-fd-muted-foreground);--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="plugins-kinds-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="plugins-kinds-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="plugins-kinds-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="plugins-kinds-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="plugins-kinds-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><rect x="20" y="20" width="660" height="270" rx="10" fill="none" stroke-width="1" style="stroke:var(--d-ruleSolid)"/><rect x="40" y="60" width="430" height="210" rx="8" fill="none" stroke-width="1" stroke-dasharray="5,4" style="stroke:var(--d-soft)"/><text x="38" y="44" font-size="13" font-weight="600" text-anchor="start" style="fill:var(--d-ink)">Hivemind window</text><text x="56" y="86" font-size="12" font-weight="400" text-anchor="start" style="fill:var(--d-soft)">View: draws the workspace (Canvas, Windows, or one you add)</text><rect x="60" y="110" width="120" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="60" y="110" width="120" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="120" y="144" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Agent tile</text><text x="120" y="162" font-size="11.5" class="m" text-anchor="middle" style="fill:var(--d-soft)">agent.yaml</text><rect x="190" y="110" width="110" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="190" y="110" width="110" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="245" y="144" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Terminal</text><text x="245" y="162" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">built in</text><rect x="310" y="110" width="145" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="310" y="110" width="145" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="382.5" y="144" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Tool tile</text><text x="382.5" y="162" font-size="11.5" class="m" text-anchor="middle" style="fill:var(--d-soft)">hivemind-tool.json</text><text x="255" y="226" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">Each tile is lent to the view.</text><text x="255" y="244" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">Switching views keeps it running.</text><rect x="495" y="110" width="165" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="495" y="110" width="165" height="76" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="577.5" y="144" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Widget</text><text x="577.5" y="162" font-size="11.5" class="m" text-anchor="middle" style="fill:var(--d-muted)">widget.json</text><text x="577" y="212" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">a small card that floats</text><text x="577" y="230" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">above every view</text><text x="350" y="322" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">Install any of them from Settings ▸ Plugins, or from HiveHub with hive.</text></svg></div></body></html>
