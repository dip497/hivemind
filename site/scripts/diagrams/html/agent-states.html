<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Agent states</title><style>body{margin:0;background:#f6f7f8;padding:2rem}@media (prefers-color-scheme:dark){body{background:#141517}}.diagram-container{overflow-x:auto}svg{display:block;width:100%;height:auto;min-width:645px;max-width:860px}</style></head><body><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 860 400" width="860" height="400" role="img" aria-labelledby="agent-states-title agent-states-desc"><title id="agent-states-title">Agent states</title><desc id="agent-states-desc">An agent starts idle. A turn makes it working; when it asks you it needs you, and your answer makes it working again. When the turn ends it is idle, with a dot until you look. Sleep puts it asleep and Resume wakes it. When its program stops it is exited.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:var(--color-fd-muted-foreground);--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="agent-states-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="agent-states-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="agent-states-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="agent-states-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="agent-states-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><circle cx="130" cy="52" r="6" style="fill:var(--d-ink)"/><path d="M 130 58 L 130 120" fill="none" stroke-width="1.25" marker-end="url(#agent-states-arrow)" style="stroke:var(--d-soft)"/><path d="M 220 140 L 340 140" fill="none" stroke-width="1.25" marker-end="url(#agent-states-arrow)" style="stroke:var(--d-soft)"/><rect x="237" y="113" width="86" height="18" rx="2" style="fill:var(--d-paper)"/><text x="280" y="125.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">turn starts</text><path d="M 340 172 L 220 172" fill="none" stroke-width="1.25" marker-end="url(#agent-states-arrow)" style="stroke:var(--d-soft)"/><rect x="223" y="181" width="114" height="18" rx="2" style="fill:var(--d-paper)"/><text x="280" y="193.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">turn ends · dot</text><path d="M 500 140 L 620 140" fill="none" stroke-width="1.25" marker-end="url(#agent-states-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="527" y="113" width="66" height="18" rx="2" style="fill:var(--d-paper)"/><text x="560" y="125.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">asks you</text><path d="M 620 172 L 500 172" fill="none" stroke-width="1.25" marker-end="url(#agent-states-arrow)" style="stroke:var(--d-soft)"/><rect x="520" y="181" width="80" height="18" rx="2" style="fill:var(--d-paper)"/><text x="560" y="193.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">you answer</text><path d="M 110 192 L 110 280" fill="none" stroke-width="1.25" marker-end="url(#agent-states-arrow)" style="stroke:var(--d-soft)"/><rect x="59" y="227" width="46" height="18" rx="2" style="fill:var(--d-paper)"/><text x="100" y="239.85" font-size="11" class="m" text-anchor="end" style="fill:var(--d-muted)">Sleep</text><path d="M 150 280 L 150 192" fill="none" stroke-width="1.25" marker-end="url(#agent-states-arrow)" style="stroke:var(--d-soft)"/><rect x="155" y="227" width="52" height="18" rx="2" style="fill:var(--d-paper)"/><text x="160" y="239.85" font-size="11" class="m" text-anchor="start" style="fill:var(--d-muted)">Resume</text><path d="M 420 192 L 420 280" fill="none" stroke-width="1.25" marker-end="url(#agent-states-arrow)" style="stroke:var(--d-soft)"/><rect x="425" y="227" width="100" height="18" rx="2" style="fill:var(--d-paper)"/><text x="430" y="239.85" font-size="11" class="m" text-anchor="start" style="fill:var(--d-muted)">program stops</text><rect x="60" y="120" width="160" height="72" rx="8" style="fill:var(--d-paper)"/><rect x="60" y="120" width="160" height="72" rx="8" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="140" y="152" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">idle</text><text x="140" y="170" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">grey</text><rect x="340" y="120" width="160" height="72" rx="8" style="fill:var(--d-paper)"/><rect x="340" y="120" width="160" height="72" rx="8" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="420" y="152" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">working</text><text x="420" y="170" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">white</text><rect x="620" y="120" width="180" height="72" rx="8" style="fill:var(--d-paper)"/><rect x="620" y="120" width="180" height="72" rx="8" stroke-width="1" style="fill:var(--d-warnTint);stroke:var(--d-warn)"/><text x="710" y="152" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">needs you</text><text x="710" y="170" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">amber</text><rect x="60" y="280" width="160" height="72" rx="8" style="fill:var(--d-paper)"/><rect x="60" y="280" width="160" height="72" rx="8" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="140" y="312" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">asleep</text><text x="140" y="330" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">conversation kept</text><rect x="340" y="280" width="160" height="72" rx="8" style="fill:var(--d-paper)"/><rect x="340" y="280" width="160" height="72" rx="8" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="420" y="312" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">exited</text><text x="420" y="330" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">red if it failed</text><text x="430" y="384" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">From any state, a program that stops is exited.</text></svg></div></body></html>
