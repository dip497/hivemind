<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>One window runs a widget; everyone sees it</title><style>body{margin:0;background:#f6f7f8;padding:2rem}@media (prefers-color-scheme:dark){body{background:#141517}}.diagram-container{overflow-x:auto}svg{display:block;width:100%;height:auto;min-width:480px;max-width:640px}</style></head><body><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="widgets-runner-title widgets-runner-desc"><title id="widgets-runner-title">One window runs a widget; everyone sees it</title><desc id="widgets-runner-desc">The first of your own windows with the workspace open runs widget.js; what it draws goes live to guests' windows, your other windows and your phone, and a press from any of them goes back to that window.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:color-mix(in oklch, var(--color-fd-foreground) 25%, var(--color-fd-muted-foreground));--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="widgets-runner-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="widgets-runner-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="widgets-runner-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="widgets-runner-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="widgets-runner-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><path d="M 170 100 L 170 142 Q 170 150 162 150 L 110 150 Q 102 150 102 158 L 102 200" fill="none" stroke-width="1.25" marker-end="url(#widgets-runner-arrow)" style="stroke:var(--d-soft)"/><path d="M 118 200 L 118 174 Q 118 166 126 166 L 178 166 Q 186 166 186 158 L 186 100" fill="none" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#widgets-runner-arrow)" style="stroke:var(--d-soft)"/><path d="M 312 100 L 312 200" fill="none" stroke-width="1.25" marker-end="url(#widgets-runner-arrow)" style="stroke:var(--d-soft)"/><path d="M 328 200 L 328 100" fill="none" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#widgets-runner-arrow)" style="stroke:var(--d-soft)"/><path d="M 470 100 L 470 142 Q 470 150 478 150 L 530 150 Q 538 150 538 158 L 538 200" fill="none" stroke-width="1.25" marker-end="url(#widgets-runner-arrow)" style="stroke:var(--d-soft)"/><path d="M 522 200 L 522 174 Q 522 166 514 166 L 462 166 Q 454 166 454 158 L 454 100" fill="none" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#widgets-runner-arrow)" style="stroke:var(--d-soft)"/><rect x="140" y="30" width="360" height="70" rx="6" style="fill:var(--d-paper)"/><rect x="140" y="30" width="360" height="70" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="320" y="60.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">The window that runs widget.js</text><text x="320" y="80.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">the first of your windows to ask</text><rect x="20" y="200" width="180" height="60" rx="6" style="fill:var(--d-paper)"/><rect x="20" y="200" width="180" height="60" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="110" y="225.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Guests' windows</text><text x="110" y="245.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">press if they can edit</text><rect x="230" y="200" width="180" height="60" rx="6" style="fill:var(--d-paper)"/><rect x="230" y="200" width="180" height="60" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="320" y="225.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Your other windows</text><text x="320" y="245.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">on any of your devices</text><rect x="440" y="200" width="180" height="60" rx="6" style="fill:var(--d-paper)"/><rect x="440" y="200" width="180" height="60" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="530" y="225.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Your phone</text><text x="530" y="245.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">through a widgets view</text><line x1="20" y1="286" x2="620" y2="286" stroke-width="1" style="stroke:var(--d-rule)"/><line x1="20" y1="308" x2="52" y2="308" stroke-width="1.25" style="stroke:var(--d-soft)"/><text x="60" y="312" font-size="12.5" font-weight="400" text-anchor="start" style="fill:var(--d-soft)">what it draws, live</text><line x1="200" y1="308" x2="232" y2="308" stroke-width="1.25" stroke-dasharray="5,4" style="stroke:var(--d-soft)"/><text x="240" y="312" font-size="12.5" font-weight="400" text-anchor="start" style="fill:var(--d-soft)">a press</text><text x="620" y="312" font-size="12.5" font-weight="400" text-anchor="end" style="fill:var(--d-soft)">Nothing it draws is saved.</text></svg></div></body></html>
