<!DOCTYPE html>

-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="host-move-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="host-move-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="host-move-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="host-move-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="host-move-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><path d="M 200 104 L 300 104" fill="none" stroke-width="1.25" marker-end="url(#host-move-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="210" y="79" width="80" height="18" rx="2" style="fill:var(--d-paper)"/><text x="250" y="91.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">Move there</text><path d="M 300 136 L 200 136" fill="none" stroke-width="1.25" marker-end="url(#host-move-arrow)" style="stroke:var(--d-soft)"/><rect x="214" y="143" width="72" height="18" rx="2" style="fill:var(--d-paper)"/><text x="250" y="155.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">Move here</text><path d="M 480 104 L 522 104 Q 530 104 530 96 L 530 78 Q 530 70 538 70 L 580 70" fill="none" stroke-width="1.25" marker-end="url(#host-move-arrow)" marker-start="url(#host-move-arrow-start)" style="stroke:var(--d-soft)"/><path d="M 480 136 L 522 136 Q 530 136 530 144 L 530 152 Q 530 160 538 160 L 580 160" fill="none" stroke-width="1.25" marker-end="url(#host-move-arrow)" marker-start="url(#host-move-arrow-start)" style="stroke:var(--d-soft)"/><rect x="20" y="82" width="180" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="20" y="82" width="180" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="110" y="116" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Your computer</text><text x="110" y="134" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">sleeps, travels</text><rect x="300" y="82" width="180" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="300" y="82" width="180" height="76" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="390" y="116" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Host</text><text x="390" y="134" font-size="11.5" class="m" text-anchor="middle" style="fill:var(--d-muted)">hive host</text><rect x="580" y="40" width="160" height="60" rx="6" style="fill:var(--d-paper)"/><rect x="580" y="40" width="160" height="60" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="660" y="74" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Guests</text><rect x="580" y="130" width="160" height="60" rx="6" style="fill:var(--d-paper)"/><rect x="580" y="130" width="160" height="60" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="660" y="164" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Your phone</text><text x="380" y="240" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">The workspace, its agents and its people stay up while your computer is off.</text></svg></div></body></html>
