<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>How your phone sees an agent</title><style>body{margin:0;background:#f6f7f8;padding:2rem}@media (prefers-color-scheme:dark){body{background:#141517}}.diagram-container{overflow-x:auto}svg{display:block;width:100%;height:auto;min-width:675px;max-width:900px}</style></head><body><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 900 420" width="900" height="420" role="img" aria-labelledby="phone-flow-title phone-flow-desc"><title id="phone-flow-title">How your phone sees an agent</title><desc id="phone-flow-desc">An agent's hook tells the background process, which works out its state. The app sends the state of every agent to your phone over hive-net, through the relay on your server, encrypted end to end. When the page is closed, a push notice goes through the same server.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:var(--color-fd-muted-foreground);--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="phone-flow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="phone-flow-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="phone-flow-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="phone-flow-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="phone-flow-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><rect x="20" y="30" width="860" height="140" rx="10" fill="none" stroke-width="1" stroke-dasharray="5,4" style="stroke:var(--d-ruleSolid)"/><rect x="34" y="22" width="115" height="16" style="fill:var(--d-paper)"/><text x="40" y="34" font-size="11" class="m" letter-spacing="0.08em" style="fill:var(--d-soft)">YOUR COMPUTER</text><rect x="320" y="228" width="260" height="128" rx="10" fill="none" stroke-width="1" stroke-dasharray="5,4" style="stroke:var(--d-ruleSolid)"/><rect x="334" y="220" width="99" height="16" style="fill:var(--d-paper)"/><text x="340" y="232" font-size="11" class="m" letter-spacing="0.08em" style="fill:var(--d-soft)">YOUR SERVER</text><path d="M 194 96 L 300 96" fill="none" stroke-width="1.25" marker-end="url(#phone-flow-arrow)" style="stroke:var(--d-soft)"/><rect x="228" y="69" width="38" height="18" rx="2" style="fill:var(--d-paper)"/><text x="247" y="81.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">hook</text><path d="M 500 96 L 620 96" fill="none" stroke-width="1.25" marker-end="url(#phone-flow-arrow)" style="stroke:var(--d-soft)"/><rect x="537" y="69" width="46" height="18" rx="2" style="fill:var(--d-paper)"/><text x="560" y="81.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">state</text><path d="M 738 134 L 738 278 Q 738 286 730 286 L 560 286" fill="none" stroke-width="1.25" marker-end="url(#phone-flow-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="743" y="201" width="106" height="18" rx="2" style="fill:var(--d-paper)"/><text x="748" y="213.85" font-size="11" class="m" text-anchor="start" style="fill:var(--d-muted)">agents · needs</text><path d="M 340 276 L 244 276" fill="none" stroke-width="1.25" marker-end="url(#phone-flow-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="269" y="249" width="46" height="18" rx="2" style="fill:var(--d-paper)"/><text x="292" y="261.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">relay</text><path d="M 340 300 L 244 300" fill="none" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#phone-flow-arrow)" style="stroke:var(--d-soft)"/><rect x="273" y="309" width="38" height="18" rx="2" style="fill:var(--d-paper)"/><text x="292" y="321.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">push</text><rect x="44" y="60" width="150" height="72" rx="6" style="fill:var(--d-paper)"/><rect x="44" y="60" width="150" height="72" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="119" y="92" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Agent</text><text x="119" y="110" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">asks something</text><rect x="300" y="60" width="200" height="72" rx="6" style="fill:var(--d-paper)"/><rect x="300" y="60" width="200" height="72" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="400" y="92" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Background process</text><text x="400" y="110" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">its state</text><rect x="620" y="60" width="236" height="72" rx="6" style="fill:var(--d-paper)"/><rect x="620" y="60" width="236" height="72" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="738" y="92" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Desktop app</text><text x="738" y="110" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">or hive host</text><rect x="340" y="252" width="220" height="72" rx="6" style="fill:var(--d-paper)"/><rect x="340" y="252" width="220" height="72" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="450" y="284" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Network server</text><text x="450" y="302" font-size="11.5" class="m" text-anchor="middle" style="fill:var(--d-soft)">hive-net serve</text><rect x="44" y="252" width="200" height="72" rx="6" style="fill:var(--d-paper)"/><rect x="44" y="252" width="200" height="72" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="144" y="284" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Phone page</text><text x="144" y="302" font-size="12" text-anchor="middle" style="fill:var(--d-muted)">your phone's browser</text><text x="450" y="398" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">Encrypted end to end: the server passes it on but cannot read it.</text></svg></div></body></html>
