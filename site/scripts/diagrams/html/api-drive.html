<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>How a program drives a workspace</title><style>body{margin:0;background:#f6f7f8;padding:2rem}@media (prefers-color-scheme:dark){body{background:#141517}}.diagram-container{overflow-x:auto}svg{display:block;width:100%;height:auto;min-width:600px;max-width:800px}</style></head><body><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 800 260" width="800" height="260" role="img" aria-labelledby="api-drive-title api-drive-desc"><title id="api-drive-title">How a program drives a workspace</title><desc id="api-drive-desc">Your program connects to the drive socket on this computer and says hello with its token. Each call is checked against the role the token was made with: an allowed call reaches the workspace, its agents, terminals and board; any other call is refused with FORBIDDEN.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:var(--color-fd-muted-foreground);--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="api-drive-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="api-drive-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="api-drive-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="api-drive-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="api-drive-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><path d="M 190 58 L 250 58" fill="none" stroke-width="1.25" marker-end="url(#api-drive-arrow)" style="stroke:var(--d-soft)"/><rect x="197" y="33" width="46" height="18" rx="2" style="fill:var(--d-paper)"/><text x="220" y="45.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">token</text><path d="M 420 58 L 440 58" fill="none" stroke-width="1.25" marker-end="url(#api-drive-arrow)" style="stroke:var(--d-soft)"/><path d="M 560 58 L 620 58" fill="none" stroke-width="1.25" marker-end="url(#api-drive-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="561" y="33" width="58" height="18" rx="2" style="fill:var(--d-paper)"/><text x="590" y="45.85" font-size="11" class="m" text-anchor="middle" style="fill:var(--d-muted)">allowed</text><path d="M 500 100 L 500 150" fill="none" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#api-drive-arrow)" style="stroke:var(--d-soft)"/><rect x="507" y="116" width="86" height="18" rx="2" style="fill:var(--d-paper)"/><text x="512" y="128.85" font-size="11" class="m" text-anchor="start" style="fill:var(--d-muted)">not allowed</text><rect x="20" y="20" width="170" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="20" y="20" width="170" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="105" y="46" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Your program</text><text x="105" y="64" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">script, dashboard,</text><text x="105" y="80" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">orchestrator</text><rect x="250" y="20" width="170" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="250" y="20" width="170" height="76" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="335" y="54" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Drive socket</text><text x="335" y="72" font-size="11.5" class="m" text-anchor="middle" style="fill:var(--d-soft)">drive.sock</text><polygon points="500,16 560,58 500,100 440,58" style="fill:var(--d-paper)"/><polygon points="500,16 560,58 500,100 440,58" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="500" y="56" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Role</text><text x="500" y="73" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">of the token</text><rect x="620" y="20" width="160" height="76" rx="6" style="fill:var(--d-paper)"/><rect x="620" y="20" width="160" height="76" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="700" y="46" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">The workspace</text><text x="700" y="64" font-size="12" text-anchor="middle" style="fill:var(--d-muted)">agents, terminals,</text><text x="700" y="80" font-size="12" text-anchor="middle" style="fill:var(--d-muted)">board</text><rect x="420" y="150" width="160" height="56" rx="6" style="fill:var(--d-paper)"/><rect x="420" y="150" width="160" height="56" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="500" y="174" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Refused</text><text x="500" y="192" font-size="11.5" class="m" text-anchor="middle" style="fill:var(--d-soft)">FORBIDDEN</text><text x="400" y="244" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">Make the token in Settings → API access, or with hive grant create.</text></svg></div></body></html>
