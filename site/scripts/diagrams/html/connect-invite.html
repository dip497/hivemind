<!DOCTYPE html>

d-ink)">The other device uses it</text><text x="320" y="157.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">both show three words</text><polygon points="320,196 420,240 320,284 220,240" style="fill:var(--d-paper)"/><polygon points="320,196 420,240 320,284 220,240" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="320" y="238" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">You answer</text><text x="320" y="256" font-size="12.5" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">on your computer</text><polygon points="320,356 420,400 320,444 220,400" style="fill:var(--d-paper)"/><polygon points="320,356 420,400 320,444 220,400" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="320" y="398" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Words match?</text><text x="320" y="416" font-size="12.5" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">on the other device</text><rect x="30" y="372" width="140" height="56" rx="6" style="fill:var(--d-paper)"/><rect x="30" y="372" width="140" height="56" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="100" y="404" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Nothing kept</text><rect x="460" y="372" width="160" height="56" rx="6" style="fill:var(--d-paper)"/><rect x="460" y="372" width="160" height="56" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="540" y="395.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">In the workspace</text><text x="540" y="415.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">at the role you pick</text><rect x="220" y="484" width="200" height="56" rx="28" style="fill:var(--d-paper)"/><rect x="220" y="484" width="200" height="56" rx="28" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="320" y="516" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Paired as you</text><text x="320" y="578" font-size="12.5" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">A request unanswered for about three minutes counts as Deny.</text></svg></div></body></html>
