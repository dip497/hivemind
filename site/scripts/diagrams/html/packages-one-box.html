<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>A package is one box</title><style>body{margin:0;background:#f6f7f8;padding:2rem}@media (prefers-color-scheme:dark){body{background:#141517}}.diagram-container{overflow-x:auto}svg{display:block;width:100%;height:auto;min-width:480px;max-width:640px}</style></head><body><div class="diagram-container"><svg xmlns="http://www.w3.org/2000/svg" class="hm-diagram" viewBox="0 0 640 340" width="640" height="340" role="img" aria-labelledby="packages-one-box-title packages-one-box-desc"><title id="packages-one-box-title">A package is one box</title><desc id="packages-one-box-desc">A package is one folder whose hivemind-package.json names its tools, widgets, views and agent presets; hive plugins install puts the whole box on this machine, with one switch, one version and a rollback, and hivehub publish lists the whole box on HiveHub.</desc><defs><style>svg.hm-diagram{--d-paper:var(--color-fd-card);--d-paper2:color-mix(in oklch, var(--color-fd-foreground) 4%, var(--color-fd-card));--d-ink:var(--color-fd-foreground);--d-muted:color-mix(in oklch, var(--color-fd-foreground) 70%, var(--color-fd-muted-foreground));--d-soft:color-mix(in oklch, var(--color-fd-foreground) 25%, var(--color-fd-muted-foreground));--d-rule:var(--color-fd-border);--d-ruleSolid:color-mix(in oklch, var(--color-fd-foreground) 42%, var(--color-fd-card));--d-accent:var(--color-fd-primary);--d-accentTint:color-mix(in oklch, var(--color-fd-primary) 10%, var(--color-fd-card));--d-link:var(--color-fd-info);--d-warn:var(--color-fd-warning);--d-warnTint:color-mix(in oklch, var(--color-fd-warning) 12%, var(--color-fd-card));font-family:var(--font-sans,'Geist',ui-sans-serif,system-ui,sans-serif);text-rendering:geometricPrecision}svg.hm-diagram .m{font-family:var(--font-mono,'JetBrains Mono',ui-monospace,monospace)}svg:root{--color-fd-card:#f6f7f8;--color-fd-foreground:#191b1d;--color-fd-muted-foreground:#5a5e62;--color-fd-border:#d9dbdd;--color-fd-primary:#2460b7;--color-fd-info:#4284c5;--color-fd-warning:#da942c}@media (prefers-color-scheme:dark){svg:root{--color-fd-card:#141517;--color-fd-foreground:#e6e8ea;--color-fd-muted-foreground:#83868a;--color-fd-border:#252729;--color-fd-primary:#53a3f2;--color-fd-info:#4284c5;--color-fd-warning:#da942c}}</style><marker id="packages-one-box-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-soft)"/></marker><marker id="packages-one-box-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-accent)"/></marker><marker id="packages-one-box-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" style="fill:var(--d-link)"/></marker><marker id="packages-one-box-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-soft)"/></marker><marker id="packages-one-box-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" style="fill:var(--d-accent)"/></marker></defs><rect width="100%" height="100%" style="fill:var(--d-paper)"/><rect x="20" y="24" width="600" height="172" rx="10" fill="none" stroke-width="1" stroke-dasharray="5,4" style="stroke:var(--d-ruleSolid)"/><rect x="34" y="16" width="182" height="16" style="fill:var(--d-paper)"/><text x="40" y="28" font-size="12" class="m" letter-spacing="0.08em" style="fill:var(--d-soft)">ONE FOLDER: @YOU/KIT</text><path d="M 170 196 L 170 256" fill="none" stroke-width="1.25" marker-end="url(#packages-one-box-arrow-accent)" style="stroke:var(--d-accent)"/><rect x="177" y="220.5" width="160" height="19" rx="2" style="fill:var(--d-paper)"/><text x="182" y="234.2" font-size="12" class="m" text-anchor="start" style="fill:var(--d-muted)">hive plugins install</text><path d="M 470 196 L 470 256" fill="none" stroke-width="1.25" marker-end="url(#packages-one-box-arrow)" style="stroke:var(--d-soft)"/><rect x="477" y="220.5" width="122" height="19" rx="2" style="fill:var(--d-paper)"/><text x="482" y="234.2" font-size="12" class="m" text-anchor="start" style="fill:var(--d-muted)">hivehub publish</text><rect x="35" y="56" width="130" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="35" y="56" width="130" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="100" y="83.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Tools</text><text x="100" y="103.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">run in the app</text><rect x="180" y="56" width="130" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="180" y="56" width="130" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="245" y="83.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Widgets</text><text x="245" y="103.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">sandboxed</text><rect x="325" y="56" width="130" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="325" y="56" width="130" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="390" y="83.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Views</text><text x="390" y="103.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">sandboxed</text><rect x="470" y="56" width="135" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="470" y="56" width="135" height="64" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="537.5" y="83.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Agent presets</text><text x="537.5" y="103.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">a prompt</text><text x="320" y="160" font-size="12.5" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">hivemind-package.json names each member, every one @you/&lt;name&gt;</text><rect x="60" y="256" width="220" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="60" y="256" width="220" height="64" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="170" y="283.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">This machine</text><text x="170" y="303.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">one switch, one version, rollback</text><rect x="360" y="256" width="220" height="64" rx="6" style="fill:var(--d-paper)"/><rect x="360" y="256" width="220" height="64" rx="6" stroke-width="1" stroke-dasharray="4,3" style="fill:var(--d-paper);stroke:var(--d-ruleSolid)"/><text x="470" y="283.5" font-size="15" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">HiveHub</text><text x="470" y="303.5" font-size="12.5" text-anchor="middle" style="fill:var(--d-soft)">one listing, every member</text></svg></div></body></html>
