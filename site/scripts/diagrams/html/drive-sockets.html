ight="72" rx="6" style="fill:var(--d-paper)"/><rect x="320" y="80" width="180" height="72" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="410" y="112" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Drive socket</text><text x="410" y="130" font-size="11.5" class="m" text-anchor="middle" style="fill:var(--d-soft)">drive.sock</text><rect x="320" y="236" width="180" height="72" rx="6" style="fill:var(--d-paper)"/><rect x="320" y="236" width="180" height="72" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="410" y="268" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Control socket</text><text x="410" y="286" font-size="11.5" class="m" text-anchor="middle" style="fill:var(--d-soft)">hcp.sock</text><rect x="600" y="80" width="240" height="72" rx="6" style="fill:var(--d-paper)"/><rect x="600" y="80" width="240" height="72" rx="6" stroke-width="1" style="fill:var(--d-accentTint);stroke:var(--d-accent)"/><text x="720" y="112" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">The app or hive host</text><text x="720" y="130" font-size="12" text-anchor="middle" style="fill:var(--d-muted)">checks the token's role</text><rect x="600" y="236" width="240" height="72" rx="6" style="fill:var(--d-paper)"/><rect x="600" y="236" width="240" height="72" rx="6" stroke-width="1" style="fill:var(--d-paper2);stroke:var(--d-ruleSolid)"/><text x="720" y="268" font-size="14" font-weight="600" text-anchor="middle" style="fill:var(--d-ink)">Background process</text><text x="720" y="286" font-size="12" text-anchor="middle" style="fill:var(--d-soft)">works out agent states</text><text x="430" y="336" font-size="12" font-weight="400" text-anchor="middle" style="fill:var(--d-soft)">Only your user can open either one: a file with mode 0600, or a named pipe on Windows.</text></svg></div></body></html>
