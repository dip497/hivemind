<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" width="760" height="260" role="img" aria-labelledby="machines-ssh-title machines-ssh-desc"><title id="machines-ssh-title">A frame on a machine</title><desc id="machines-ssh-desc">Your computer reaches the machine over ssh. On the machine, the hive daemon runs the terminals and agents of the frame, in its folder, and keeps them running when the connection drops or the app quits.</desc><defs><style>@font-face{font-family:'Geist';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}</style><marker id="machines-ssh-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#83868a"/></marker><marker id="machines-ssh-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8ab7da"/></marker><marker id="machines-ssh-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#99aec0"/></marker><marker id="machines-ssh-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#83868a"/></marker><marker id="machines-ssh-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#8ab7da"/></marker></defs><rect width="100%" height="100%" fill="#0d0e10"/><rect x="290" y="24" width="450" height="180" rx="10" fill="none" stroke="#616467" stroke-width="1"/><path d="M 200 108 L 320 108" fill="none" stroke="#99aec0" stroke-width="1.25" marker-end="url(#machines-ssh-arrow-link)"/><rect x="242" y="83" width="32" height="18" rx="2" fill="#0d0e10"/><text x="258" y="95.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">ssh</text><path d="M 500 108 L 540 108" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#machines-ssh-arrow)"/><text x="306" y="48" fill="#e6e8ea" font-size="13" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="start">The machine</text><rect x="20" y="70" width="180" height="76" rx="6" fill="#0d0e10"/><rect x="20" y="70" width="180" height="76" rx="6" fill="#1f252a" stroke="#8ab7da" stroke-width="1"/><text x="110" y="104" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Your computer</text><text x="110" y="122" fill="#bbbec1" font-size="12" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">the Hivemind app</text><rect x="320" y="70" width="180" height="76" rx="6" fill="#0d0e10"/><rect x="320" y="70" width="180" height="76" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="410" y="104" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">hive daemon</text><text x="410" y="122" fill="#83868a" font-size="12" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">on the machine</text><rect x="540" y="70" width="180" height="76" rx="6" fill="#0d0e10"/><rect x="540" y="70" width="180" height="76" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="630" y="104" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Terminals, agents</text><text x="630" y="122" fill="#83868a" font-size="12" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">in the frame's folder</text><text x="515" y="180" fill="#83868a" font-size="12" font-weight="400" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">They keep running when the link drops or the app quits.</text><text x="380" y="240" fill="#83868a" font-size="12" font-weight="400" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">One ssh connection per machine, with your own keys and ~/.ssh/config.</text></svg>