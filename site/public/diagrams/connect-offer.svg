<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 596" width="640" height="596" role="img" aria-labelledby="connect-offer-title connect-offer-desc"><title id="connect-offer-title">One offer, three answers</title><desc id="connect-offer-desc">An offer from Settings → Connect is used on the other device and both show three words; on your computer you deny it, let someone else into the workspace, or say it is you, and then the other device confirms the words match to pair as you.</desc><defs><style>@font-face{font-family:'Geist';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}</style><marker id="connect-offer-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#83868a"/></marker><marker id="connect-offer-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8ab7da"/></marker><marker id="connect-offer-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#99aec0"/></marker><marker id="connect-offer-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#83868a"/></marker><marker id="connect-offer-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#8ab7da"/></marker></defs><rect width="100%" height="100%" fill="#0d0e10"/><path d="M 320 80 L 320 112" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#connect-offer-arrow)"/><path d="M 320 172 L 320 196" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#connect-offer-arrow)"/><path d="M 220 240 L 108 240 Q 100 240 100 248 L 100 372" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#connect-offer-arrow)"/><rect x="141" y="215" width="38" height="18" rx="2" fill="#0d0e10"/><text x="160" y="227.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Deny</text><path d="M 420 240 L 532 240 Q 540 240 540 248 L 540 372" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#connect-offer-arrow)"/><rect x="434" y="215" width="92" height="18" rx="2" fill="#0d0e10"/><text x="480" y="227.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Someone else</text><path d="M 320 284 L 320 356" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#connect-offer-arrow)"/><rect x="327" y="311" width="58" height="18" rx="2" fill="#0d0e10"/><text x="332" y="323.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">It's me</text><path d="M 220 400 L 170 400" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#connect-offer-arrow)"/><rect x="183" y="375" width="24" height="18" rx="2" fill="#0d0e10"/><text x="195" y="387.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">No</text><path d="M 320 444 L 320 484" fill="none" stroke="#8ab7da" stroke-width="1.25" marker-end="url(#connect-offer-arrow-accent)"/><rect x="327" y="455" width="32" height="18" rx="2" fill="#0d0e10"/><text x="332" y="467.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">Yes</text><rect x="170" y="20" width="300" height="60" rx="30" fill="#0d0e10"/><rect x="170" y="20" width="300" height="60" rx="30" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="320" y="46" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">An offer</text><text x="320" y="64" fill="#83868a" font-size="12" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Settings → Connect → Connect</text><rect x="170" y="112" width="300" height="60" rx="6" fill="#0d0e10"/><rect x="170" y="112" width="300" height="60" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="320" y="138" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">The other device uses it</text><text x="320" y="156" fill="#83868a" font-size="12" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">both show three words</text><polygon points="320,196 420,240 320,284 220,240" fill="#0d0e10"/><polygon points="320,196 420,240 320,284 220,240" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="320" y="238" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">You answer</text><text x="320" y="255" fill="#83868a" font-size="12" font-weight="400" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">on your computer</text><polygon points="320,356 420,400 320,444 220,400" fill="#0d0e10"/><polygon points="320,356 420,400 320,444 220,400" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="320" y="398" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Words match?</text><text x="320" y="415" fill="#83868a" font-size="12" font-weight="400" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">on the other device</text><rect x="30" y="372" width="140" height="56" rx="6" fill="#0d0e10"/><rect x="30" y="372" width="140" height="56" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="100" y="404" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Nothing kept</text><rect x="460" y="372" width="160" height="56" rx="6" fill="#0d0e10"/><rect x="460" y="372" width="160" height="56" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="540" y="396" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">In the workspace</text><text x="540" y="414" fill="#83868a" font-size="12" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">at the role you pick</text><rect x="220" y="484" width="200" height="56" rx="28" fill="#0d0e10"/><rect x="220" y="484" width="200" height="56" rx="28" fill="#1f252a" stroke="#8ab7da" stroke-width="1"/><text x="320" y="516" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Paired as you</text><text x="320" y="578" fill="#83868a" font-size="12" font-weight="400" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">A request unanswered for about three minutes counts as Deny.</text></svg>