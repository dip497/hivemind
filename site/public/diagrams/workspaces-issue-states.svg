<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 316" width="700" height="316" role="img" aria-labelledby="workspaces-issue-states-title workspaces-issue-states-desc"><title id="workspaces-issue-states-title">Issue states</title><desc id="workspaces-issue-states-desc">An issue usually moves backlog, todo, in_progress, in_review, done; cancelled can be set from any state, and nothing enforces the order: any state can be set from any other.</desc><defs><style>@font-face{font-family:'Geist';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}</style><marker id="workspaces-issue-states-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#83868a"/></marker><marker id="workspaces-issue-states-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8ab7da"/></marker><marker id="workspaces-issue-states-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#99aec0"/></marker><marker id="workspaces-issue-states-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#83868a"/></marker><marker id="workspaces-issue-states-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#8ab7da"/></marker></defs><rect width="100%" height="100%" fill="#0d0e10"/><path d="M 132 68 L 154 68" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#workspaces-issue-states-arrow)"/><path d="M 270 68 L 292 68" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#workspaces-issue-states-arrow)"/><path d="M 408 68 L 430 68" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#workspaces-issue-states-arrow)"/><path d="M 546 68 L 568 68" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#workspaces-issue-states-arrow)"/><path d="M 74 108 L 74 120 L 626 120 L 626 108" fill="none" stroke="#83868a" stroke-width="1"/><line x1="212" y1="108" x2="212" y2="120" stroke="#83868a" stroke-width="1"/><line x1="350" y1="108" x2="350" y2="120" stroke="#83868a" stroke-width="1"/><line x1="488" y1="108" x2="488" y2="120" stroke="#83868a" stroke-width="1"/><path d="M 350 120 L 350 180" fill="none" stroke="#83868a" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#workspaces-issue-states-arrow)"/><rect x="357" y="141" width="106" height="18" rx="2" fill="#0d0e10"/><text x="362" y="153.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">from any state</text><rect x="16" y="40" width="116" height="56" rx="8" fill="#0d0e10"/><rect x="16" y="40" width="116" height="56" rx="8" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="74" y="72" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">backlog</text><rect x="154" y="40" width="116" height="56" rx="8" fill="#0d0e10"/><rect x="154" y="40" width="116" height="56" rx="8" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="212" y="72" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">todo</text><rect x="292" y="40" width="116" height="56" rx="8" fill="#0d0e10"/><rect x="292" y="40" width="116" height="56" rx="8" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="350" y="72" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">in_progress</text><rect x="430" y="40" width="116" height="56" rx="8" fill="#0d0e10"/><rect x="430" y="40" width="116" height="56" rx="8" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="488" y="72" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">in_review</text><rect x="568" y="40" width="116" height="56" rx="8" fill="#0d0e10"/><rect x="568" y="40" width="116" height="56" rx="8" fill="#1f252a" stroke="#8ab7da" stroke-width="1"/><text x="626" y="72" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">done</text><rect x="280" y="180" width="140" height="56" rx="8" fill="#0d0e10"/><rect x="280" y="180" width="140" height="56" rx="8" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="350" y="212" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">cancelled</text><text x="350" y="270" fill="#83868a" font-size="12" font-weight="400" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">The order is not enforced: any state can be set from any other.</text><text x="350" y="292" fill="#83868a" font-size="11.5" font-weight="400" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">hive close → done · hive close --reason → cancelled · hive reopen → todo</text></svg>