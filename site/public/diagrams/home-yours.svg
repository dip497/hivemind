<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 200" width="940" height="200" role="img" aria-labelledby="home-yours-title home-yours-desc"><title id="home-yours-title">Everything runs on machines you own</title><desc id="home-yours-desc">Your phone talks to your own hive-net server, which relays to your computer, which reaches your other machines over ssh.</desc><defs><style>@font-face{font-family:'Geist';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}</style><marker id="home-yours-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#83868a"/></marker><marker id="home-yours-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8ab7da"/></marker><marker id="home-yours-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#99aec0"/></marker><marker id="home-yours-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#83868a"/></marker><marker id="home-yours-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#8ab7da"/></marker></defs><rect width="100%" height="100%" fill="#0d0e10"/><path d="M 160 82 L 236 82" fill="none" stroke="#99aec0" stroke-width="1.25" marker-end="url(#home-yours-arrow-link)"/><rect x="175" y="57" width="46" height="18" rx="2" fill="#0d0e10"/><text x="198" y="69.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">https</text><path d="M 420 82 L 496 82" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#home-yours-arrow)"/><rect x="435" y="57" width="46" height="18" rx="2" fill="#0d0e10"/><text x="458" y="69.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">relay</text><path d="M 670 82 L 746 82" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#home-yours-arrow)"/><rect x="692" y="57" width="32" height="18" rx="2" fill="#0d0e10"/><text x="708" y="69.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">ssh</text><rect x="20" y="44" width="140" height="76" rx="6" fill="#0d0e10"/><rect x="20" y="44" width="140" height="76" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="90" y="78" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Your phone</text><text x="90" y="96" fill="#83868a" font-size="12" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">a browser page</text><rect x="240" y="44" width="180" height="76" rx="6" fill="#0d0e10"/><rect x="240" y="44" width="180" height="76" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="330" y="78" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Your server</text><text x="330" y="96" fill="#83868a" font-size="11.5" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">hive-net serve</text><rect x="500" y="44" width="170" height="76" rx="6" fill="#0d0e10"/><rect x="500" y="44" width="170" height="76" rx="6" fill="#1f252a" stroke="#8ab7da" stroke-width="1"/><text x="585" y="78" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Your computer</text><text x="585" y="96" fill="#bbbec1" font-size="12" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">the Hivemind app</text><rect x="766" y="28" width="160" height="76" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><rect x="758" y="36" width="160" height="76" rx="6" fill="#0d0e10" stroke="#616467" stroke-width="1"/><rect x="750" y="44" width="160" height="76" rx="6" fill="#0d0e10"/><rect x="750" y="44" width="160" height="76" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="830" y="78" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Your machines</text><text x="830" y="96" fill="#83868a" font-size="12" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">servers, VMs, laptops</text><text x="470" y="168" fill="#83868a" font-size="12" font-weight="400" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Encrypted end to end: your server passes the traffic on but cannot read it.</text></svg>