<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" width="640" height="330" role="img" aria-labelledby="widgets-runner-title widgets-runner-desc"><title id="widgets-runner-title">One window runs a widget; everyone sees it</title><desc id="widgets-runner-desc">The first of your own windows with the workspace open runs widget.js; what it draws goes live to guests' windows, your other windows and your phone, and a press from any of them goes back to that window.</desc><defs><style>@font-face{font-family:'Geist';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}</style><marker id="widgets-runner-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#83868a"/></marker><marker id="widgets-runner-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8ab7da"/></marker><marker id="widgets-runner-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#99aec0"/></marker><marker id="widgets-runner-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#83868a"/></marker><marker id="widgets-runner-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#8ab7da"/></marker></defs><rect width="100%" height="100%" fill="#0d0e10"/><path d="M 170 100 L 170 142 Q 170 150 162 150 L 110 150 Q 102 150 102 158 L 102 200" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#widgets-runner-arrow)"/><path d="M 118 200 L 118 174 Q 118 166 126 166 L 178 166 Q 186 166 186 158 L 186 100" fill="none" stroke="#83868a" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#widgets-runner-arrow)"/><path d="M 312 100 L 312 200" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#widgets-runner-arrow)"/><path d="M 328 200 L 328 100" fill="none" stroke="#83868a" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#widgets-runner-arrow)"/><path d="M 470 100 L 470 142 Q 470 150 478 150 L 530 150 Q 538 150 538 158 L 538 200" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#widgets-runner-arrow)"/><path d="M 522 200 L 522 174 Q 522 166 514 166 L 462 166 Q 454 166 454 158 L 454 100" fill="none" stroke="#83868a" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#widgets-runner-arrow)"/><rect x="140" y="30" width="360" height="70" rx="6" fill="#0d0e10"/><rect x="140" y="30" width="360" height="70" rx="6" fill="#1f252a" stroke="#8ab7da" stroke-width="1"/><text x="320" y="61" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">The window that runs widget.js</text><text x="320" y="79" fill="#bbbec1" font-size="12" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">the first of your windows to ask</text><rect x="20" y="200" width="180" height="60" rx="6" fill="#0d0e10"/><rect x="20" y="200" width="180" height="60" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="110" y="226" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Guests' windows</text><text x="110" y="244" fill="#83868a" font-size="12" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">press if they can edit</text><rect x="230" y="200" width="180" height="60" rx="6" fill="#0d0e10"/><rect x="230" y="200" width="180" height="60" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="320" y="226" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Your other windows</text><text x="320" y="244" fill="#83868a" font-size="12" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">on any of your devices</text><rect x="440" y="200" width="180" height="60" rx="6" fill="#0d0e10"/><rect x="440" y="200" width="180" height="60" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="530" y="226" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Your phone</text><text x="530" y="244" fill="#83868a" font-size="12" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">through a widgets view</text><line x1="20" y1="286" x2="620" y2="286" stroke="#252729" stroke-width="1"/><line x1="20" y1="308" x2="52" y2="308" stroke="#83868a" stroke-width="1.25"/><text x="60" y="312" fill="#83868a" font-size="12" font-weight="400" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="start">what it draws, live</text><line x1="200" y1="308" x2="232" y2="308" stroke="#83868a" stroke-width="1.25" stroke-dasharray="5,4"/><text x="240" y="312" fill="#83868a" font-size="12" font-weight="400" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="start">a press</text><text x="620" y="312" fill="#83868a" font-size="12" font-weight="400" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="end">Nothing it draws is saved.</text></svg>