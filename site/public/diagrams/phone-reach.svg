<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 316" width="680" height="316" role="img" aria-labelledby="phone-reach-title phone-reach-desc"><title id="phone-reach-title">How the phone reaches your computer</title><desc id="phone-reach-desc">The phone page talks over https to your own hive-net server, which relays it to your computer and to your other computers and hosts; your computer introduces the phone to those other devices.</desc><defs><style>@font-face{font-family:'Geist';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}</style><marker id="phone-reach-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#83868a"/></marker><marker id="phone-reach-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8ab7da"/></marker><marker id="phone-reach-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#99aec0"/></marker><marker id="phone-reach-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#83868a"/></marker><marker id="phone-reach-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#8ab7da"/></marker></defs><rect width="100%" height="100%" fill="#0d0e10"/><path d="M 180 76 L 246 76" fill="none" stroke="#99aec0" stroke-width="1.25" marker-end="url(#phone-reach-arrow-link)"/><rect x="190" y="51" width="46" height="18" rx="2" fill="#0d0e10"/><text x="213" y="63.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">https</text><path d="M 450 76 L 516 76" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#phone-reach-arrow)"/><rect x="460" y="51" width="46" height="18" rx="2" fill="#0d0e10"/><text x="483" y="63.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">relay</text><path d="M 400 112 L 400 200" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#phone-reach-arrow)"/><rect x="347" y="147" width="46" height="18" rx="2" fill="#0d0e10"/><text x="388" y="159.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">relay</text><path d="M 600 112 L 600 200" fill="none" stroke="#83868a" stroke-width="1.25" stroke-dasharray="5,4" marker-end="url(#phone-reach-arrow)"/><rect x="445" y="147" width="148" height="18" rx="2" fill="#0d0e10"/><text x="588" y="159.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="end">introduces the phone</text><rect x="20" y="40" width="160" height="72" rx="6" fill="#0d0e10"/><rect x="20" y="40" width="160" height="72" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="100" y="72" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Phone page</text><text x="100" y="90" fill="#83868a" font-size="12" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">your phone's browser</text><rect x="250" y="40" width="200" height="72" rx="6" fill="#0d0e10"/><rect x="250" y="40" width="200" height="72" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="350" y="72" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Your server</text><text x="350" y="90" fill="#83868a" font-size="11.5" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">hive-net serve</text><rect x="520" y="40" width="140" height="72" rx="6" fill="#0d0e10"/><rect x="520" y="40" width="140" height="72" rx="6" fill="#1f252a" stroke="#8ab7da" stroke-width="1"/><text x="590" y="80" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Your computer</text><rect x="360" y="200" width="300" height="64" rx="6" fill="#0d0e10"/><rect x="360" y="200" width="300" height="64" rx="6" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="510" y="236" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Your other computers and hosts</text><text x="340" y="298" fill="#83868a" font-size="12" font-weight="400" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Encrypted end to end: the server relays the traffic but cannot read it.</text></svg>