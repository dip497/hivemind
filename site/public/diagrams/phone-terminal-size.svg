<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 284" width="640" height="284" role="img" aria-labelledby="phone-terminal-size-title phone-terminal-size-desc"><title id="phone-terminal-size-title">Who sizes the terminal</title><desc id="phone-terminal-size-desc">A terminal opened on the phone takes the phone size; a desktop key, Fit off, or closing or hiding the terminal gives it back the desktop size; a phone key with Fit on, pressing Fit, or showing the page again takes the phone size again.</desc><defs><style>@font-face{font-family:'Geist';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'Geist';font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:'JetBrains Mono';font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}</style><marker id="phone-terminal-size-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#83868a"/></marker><marker id="phone-terminal-size-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#8ab7da"/></marker><marker id="phone-terminal-size-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#99aec0"/></marker><marker id="phone-terminal-size-arrow-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#83868a"/></marker><marker id="phone-terminal-size-arrow-accent-start" markerWidth="8" markerHeight="6" refX="1" refY="3" orient="auto"><polygon points="8 0, 0 3, 8 6" fill="#8ab7da"/></marker></defs><rect width="100%" height="100%" fill="#0d0e10"/><circle cx="110" cy="30" r="6" fill="#e6e8ea"/><path d="M 110 36 L 110 128" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#phone-terminal-size-arrow)"/><rect x="115" y="61" width="140" height="18" rx="2" fill="#0d0e10"/><text x="120" y="73.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="start">opened on the phone</text><path d="M 180 148 L 460 148" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#phone-terminal-size-arrow)"/><rect x="270" y="123" width="100" height="18" rx="2" fill="#0d0e10"/><text x="320" y="135.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">a desktop key</text><rect x="291" y="105" width="58" height="18" rx="2" fill="#0d0e10"/><text x="320" y="117.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Fit off</text><rect x="212" y="87" width="216" height="18" rx="2" fill="#0d0e10"/><text x="320" y="99.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">terminal closed or page hidden</text><path d="M 460 172 L 180 172" fill="none" stroke="#83868a" stroke-width="1.25" marker-end="url(#phone-terminal-size-arrow)"/><rect x="250" y="179" width="140" height="18" rx="2" fill="#0d0e10"/><text x="320" y="191.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">a phone key, Fit on</text><rect x="277" y="197" width="86" height="18" rx="2" fill="#0d0e10"/><text x="320" y="209.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">Fit pressed</text><rect x="260" y="215" width="120" height="18" rx="2" fill="#0d0e10"/><text x="320" y="227.85" fill="#bbbec1" font-size="11" font-family="'JetBrains Mono', ui-monospace, monospace" text-anchor="middle">page shown again</text><rect x="40" y="128" width="140" height="64" rx="8" fill="#0d0e10"/><rect x="40" y="128" width="140" height="64" rx="8" fill="#1f252a" stroke="#8ab7da" stroke-width="1"/><text x="110" y="164" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Phone size</text><rect x="460" y="128" width="140" height="64" rx="8" fill="#0d0e10"/><rect x="460" y="128" width="140" height="64" rx="8" fill="#191a1b" stroke="#616467" stroke-width="1"/><text x="530" y="164" fill="#e6e8ea" font-size="14" font-weight="600" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Desktop size</text><text x="320" y="266" fill="#83868a" font-size="12" font-weight="400" font-family="'Geist', ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Whoever typed last sets the size. Allow, Deny and choosing an option are not typing.</text></svg>