# The app against a real computer (docs/design/phone-app-2026-10-02.md §7): it pastes the link the
# computer's Settings → Devices → Pair a phone shows, pairs, and is the person's; finds the computer
# and its agent among the agents; opens the agent and reads its line in its terminal, then what it
# and the person said in its chat; and sends it a message from the reply box, which it answers in
# the chat and in its terminal, still followed. Then the community view the computer offers the
# phone (P8): listed under Views, shown in the app's web view, told it is on a phone and what the
# board holds; Select is answered by its host on the computer, and Start an agent asks the phone's
# lock first, which this emulator has none of. Run by apps/desktop/tests/e2e/phone-app.spec.ts
# (PHONE_APP=android), which hands it the link and what to find (PAIR_LINK, PAIR_PERSON,
# PAIR_COMPUTER, PAIR_AGENT, PAIR_LINE, PAIR_SAID, PAIR_MESSAGE, PAIR_ANSWER, PAIR_HEARD, PAIR_VIEW,
# PAIR_VIEW_AGENT, PAIR_VIEW_SELECTED); in a folder of its own, so the smoke run of
# apps/android/maestro leaves it out. A computer's network, a terminal and a conversation over it
# are slow on a CI emulator: every wait is long. The view's page is read through Chrome's DevTools,
# not the accessibility tree, which leaves out what a page changes after Maestro first reads it
# (docs.maestro.dev known issues; the app's web view is debuggable in a debug build). On a WebView
# 148 or later Maestro 2.11 cannot read it so (mobile-dev-inc/Maestro#3646): the emulator's is 145.
appId: com.hivemind.phone
name: Pair with a computer, and drive its agent
androidWebViewHierarchy: devtools
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible:
      id: "pair-link"
    timeout: 60000
- tapOn:
    id: "pair-link"
- inputText: ${PAIR_LINK}
- hideKeyboard
- tapOn:
    id: "pair-button"
- extendedWaitUntil:
    visible: "This phone is ${PAIR_PERSON}'s now."
    timeout: 120000
- tapOn: "Continue"

# The computer, reachable, and its agent, among the agents.
- tapOn: "Agents"
- extendedWaitUntil:
    visible: ${PAIR_COMPUTER}
    timeout: 120000
- extendedWaitUntil:
    visible: ${PAIR_AGENT}
    timeout: 120000
- tapOn: ${PAIR_AGENT}

# Its terminal first: the line the agent printed, as its screen has it.
- extendedWaitUntil:
    visible: ${PAIR_LINE}
    timeout: 60000
# What it and the person said to each other.
- tapOn: "Chat"
- extendedWaitUntil:
    visible: ${PAIR_SAID}
    timeout: 60000
# A message from the reply box: the agent hears it, and answers.
- tapOn:
    id: "reply"
- inputText: ${PAIR_MESSAGE}
# The app's Send, by its tag: the keyboard's action key sends too (the reply box's ImeAction.Send),
# and a tap by "Send" could find either.
- tapOn:
    id: "reply-send"
- extendedWaitUntil:
    visible: ${PAIR_ANSWER}
    timeout: 60000
# Its terminal, followed all the while the chat was: what it printed on hearing it.
- tapOn: "Terminal"
- extendedWaitUntil:
    visible: ${PAIR_HEARD}
    timeout: 60000

# The community view the computer offers the phone: back to the tabs, by the agent screen's Back (by
# its tag: the system's own Back is "Back" too, and with the keyboard up it only closes that).
- tapOn:
    id: "agent-back"
- tapOn: "Views"
- extendedWaitUntil:
    visible: ${PAIR_VIEW}
    timeout: 60000
- tapOn: ${PAIR_VIEW}
# Its page, from the computer, in the app's web view (read through accessibility, as any screen):
# told by its host that it is on a phone, and what the board holds.
- extendedWaitUntil:
    visible: "On a phone"
    timeout: 60000
- extendedWaitUntil:
    visible: ${PAIR_VIEW_AGENT}
    timeout: 30000
# Selected on the page; what the page shows is its host's answer, from the computer.
- tapOn: "Select"
- extendedWaitUntil:
    visible: ${PAIR_VIEW_SELECTED}
    timeout: 30000
# Starting an agent asks the phone's lock first; with none set, the app says to set one, and posts
# nothing (the spec finds nothing started on the computer).
- tapOn: "Start an agent"
- extendedWaitUntil:
    visible: "Set a screen lock on this phone to start or close agents."
    timeout: 30000
