packages:
  - apps/*
  - packages/*

catalog:
  typescript: 7.0.2
  '@types/node': 24.19.1
  zod: 4.6.5
  yaml: 2.9.1
  gray-matter: 4.0.3
  loro-crdt: 1.16.4
  citty: ^0.2.2
  chokidar: ^5.0.0
  simple-git: ^4.0.2
  uqr: ^0.1.3
  react: ^19.3.0
  react-dom: ^19.3.0
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  zustand: ^5.0.15
  '@tanstack/react-query': ^5.104.0
  '@xyflow/react': ^12.12.0
  '@xterm/xterm': ^6.0.0
  '@xterm/headless': 6.0.0
  '@xterm/addon-webgl': ^0.19.0
  '@xterm/addon-fit': ^0.11.0
  '@xterm/addon-search': ^0.16.0
  '@pierre/diffs': 1.5.1
  sonner: ^2.0.8
  cmdk: ^1.1.1
  '@radix-ui/react-tooltip': ^1.2.16
  '@radix-ui/react-dropdown-menu': ^2.1.24
  '@radix-ui/react-dialog': ^1.1.23
  class-variance-authority: ^0.7.1
  clsx: ^2.1.1
  tailwind-merge: ^3.7.0
  lucide-react: ^1.50.0
  '@lydell/node-pty': 1.2.0-beta.15
  '@modelcontextprotocol/sdk': ^1.0.4
  better-sqlite3: ^11.7.0
  drizzle-orm: ^0.36.4
  drizzle-kit: ^0.30.0
  tailwindcss: ^4.3.3
  '@tailwindcss/vite': ^4.3.3
  vite: ^6.4.3
  electron: ^44.5.1
  electron-vite: ^5.0.0
  '@electron/rebuild': ^4.2.0
  electron-builder: ^26.15.3

ignoredOptionalDependencies:
  - cpu-features

# Every pnpm setting lives here: since pnpm 11, .npmrc carries only registry and auth settings,
# and the "pnpm" field of package.json is not read at all.
nodeLinker: isolated
shamefullyHoist: false
autoInstallPeers: true
strictPeerDependencies: false

# Which dependencies' install scripts run (true) or are skipped (false). A dependency with an
# install script that is not listed fails the install (strictDepBuilds, on since pnpm 11).
allowBuilds:
  electron: true
  esbuild: true
  '@lydell/node-pty': true
  better-sqlite3: true
  # Picks a 7-Zip for Squirrel.Windows installers; the Windows build is a zip.
  electron-winstaller: false

overrides:
  'js-yaml@>=3 <3.15.2': 3.15.2
  'js-yaml@>=4 <4.3.2': 4.3.2
  undici@8.5.0: 8.10.2
  extract-zip: npm:@electron-internal/extract-zip@^1.0.5

patchedDependencies:
  '@xterm/addon-webgl@0.19.0': patches/@xterm__addon-webgl@0.19.0.patch
