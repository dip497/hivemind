# Mistral Vibe — a catalog agent. Launch only: no status reading, resume or turn reports.
manifestVersion: 1
id: mistral-vibe
label: "Mistral Vibe"
bin: vibe
enabled: true
caps:
  promptDelivery: typed
  turnSignal: false
  resume: none
  supervise: human
  blockedDetection: false
options:
  - id: mode
    label: "Agent"
    flag: --agent
    unattended: auto-approve
install:
  url: https://github.com/mistralai/mistral-vibe
  command: "curl -LsSf https://mistral.ai/vibe/install.sh | bash"
note: "launches only: Hivemind does not read its status yet, and other agents cannot collect its replies."
