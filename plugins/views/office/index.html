<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Hive HQ</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0f1220; }
    canvas { display: block; cursor: grab; image-rendering: pixelated; }
    canvas:active { cursor: grabbing; }
    #label { position: absolute; pointer-events: none; font: 12px system-ui, sans-serif; padding: 3px 8px; border-radius: 6px; display: none; white-space: nowrap; }
    #hint { position: absolute; left: 12px; bottom: 10px; pointer-events: none; font: 11px system-ui, sans-serif; opacity: .7; }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="label"></div>
  <div id="hint"></div>
  <script type="module" src="./office.js"></script>
</body>
</html>
