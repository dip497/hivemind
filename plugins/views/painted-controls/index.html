<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Painted controls</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: var(--hm-color-bg); color: var(--hm-color-fg); font: 14px system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; }
    #controls { position: absolute; inset: 0; pointer-events: none; }
    #controls button { position: absolute; pointer-events: auto; background: transparent; border: 0; border-radius: 16px; color: transparent; cursor: pointer; }
    #controls button:disabled { cursor: default; }
    #controls button:focus-visible { outline: 3px solid var(--hm-color-brand); outline-offset: 3px; }
    #status { position: absolute; left: 24px; top: 12px; margin: 0; color: var(--hm-color-fg2); }
  </style>
</head>
<body>
  <canvas id="scene" aria-hidden="true"></canvas>
  <p id="status" role="status"></p>
  <nav id="controls" aria-label="Scene controls"></nav>
  <script type="module" src="./painted-controls.js"></script>
</body>
</html>
