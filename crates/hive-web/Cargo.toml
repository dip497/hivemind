[package]
name = "hive-web"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
rust-version = "1.91"
description = "hivemind in a browser (docs/design/phone-browser-2026-10-03.md): the phone's core compiled to wasm, pairing with the person's computer and reaching it through a relay on hive/ws/1."

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
console_error_panic_hook = "0.1"
# The phone's own pairing and reading of what the person's devices say: no copy of its rules here.
hive-phone = { path = "../hive-phone" }
hive-net = { path = "../hive-net", default-features = false }
# A browser sends no UDP: iroh's relay path only, as iroh's browser docs require.
iroh = { version = "1.3.0", default-features = false, features = ["tls-ring"] }
js-sys = "0.3"
n0-future = "0.3"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["sync"] }
# The CLI that makes the JS glue must be this exact version (build.sh fetches it).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"

[target.'cfg(not(all(target_family = "wasm", target_os = "unknown")))'.dev-dependencies]
anyhow = "1"
hive-net = { path = "../hive-net", default-features = false }
iroh = "1.3.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
