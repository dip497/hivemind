<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>hive-web: pair and follow</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; margin: 1.5rem; max-width: 40rem; }
  code { font-size: 12px; word-break: break-all; }
  [data-error] { color: #b91c1c; }
  li[data-waiting] { font-weight: 600; }
</style>
</head>
<body>
<!-- A test page for B1/B2 (docs/design/phone-browser-2026-10-03.md): pair from #pair=<link>&name=…,
     then what waits on the person and every agent, live. The phone's screens are B3's. -->
<p>This browser: <code data-id></code></p>
<form data-pair-form>
  <input name="link" placeholder="hivemind://pair/…" size="40" required>
  <input name="name" value="Browser" size="12" required>
  <button>Pair</button>
</form>
<p data-paired hidden></p>
<p data-error hidden></p>
<h2>Needs you</h2>
<ul data-needs></ul>
<h2>Agents <span data-working></span></h2>
<ul data-agents></ul>
<script type="module">
import { openPhone } from "./hive-web.js";

const $ = (s) => document.querySelector(s);
const fail = (e) => { $("[data-error]").hidden = false; $("[data-error]").textContent = String(e?.message ?? e); };
const item = (text, data) => {
  const li = document.createElement("li");
  li.textContent = text;
  for (const [k, v] of Object.entries(data)) if (v != null) li.dataset[k] = v;
  return li;
};
function show({ agents, needs, working }) {
  $("[data-agents]").replaceChildren(...agents.map((a) =>
    item(`${a.agent} (${a.name}): ${a.state}`, { agent: a.tile, state: a.state, waiting: a.waiting?.kind })));
  $("[data-needs]").replaceChildren(...needs.map((a) =>
    item(`${a.agent} (${a.name}) waits: ${a.waiting.kind}`, { need: a.tile, kind: a.waiting.kind })));
  $("[data-working]").textContent = `${working} at work`;
}

async function follow(phone) {
  $("[data-paired]").hidden = false;
  $("[data-paired]").textContent = `Paired with ${phone.paired.with.name}`;
  $("[data-paired]").dataset.paired = phone.paired.with.device;
  const host = await phone.reach();
  await host.follow(show);
  throw new Error(`${phone.paired.with.name} stopped telling this browser of its agents`);
}

try {
  const phone = await openPhone();
  window.phone = phone;
  $("[data-id]").textContent = phone.id;
  $("[data-id]").dataset.id = phone.id;
  const asked = new URLSearchParams(location.hash.slice(1));
  // The code is a secret: out of the address bar and the history once read.
  if (asked.has("pair")) history.replaceState(null, "", location.pathname + location.search);
  const pairWith = async (link, name) => { await phone.pair(link, name); await follow(phone); };
  $("[data-pair-form]").onsubmit = (e) => {
    e.preventDefault();
    const f = new FormData(e.target);
    $("[data-error]").hidden = true;
    pairWith(f.get("link"), f.get("name")).catch(fail);
  };
  if (asked.has("pair")) await pairWith(asked.get("pair"), asked.get("name") ?? "Browser");
  else if (phone.paired) await follow(phone);
} catch (e) {
  fail(e);
}
</script>
</body>
</html>
