# hive-web's workspace, rooted here so the crates it builds from (hive-phone, hive-net) are inside
# it: Cargo hashes a path dependency outside the workspace by its absolute path, and the phone page
# would then be other bytes in each checkout. The other crates are each their own workspace.
[workspace]
resolver = "2"
members = ["hive-web"]
exclude = ["agent-host", "hive-net", "hive-phone", "hive-phone-ffi", "vendor"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# The screen's emulator, without the pty that keeps it off wasm (vendor/alacritty_terminal/README.md).
[patch.crates-io]
alacritty_terminal = { path = "vendor/alacritty_terminal" }
