[package]
name = "hive-net"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
rust-version = "1.91"
description = "hivemind's network: an iroh endpoint on this machine's device key, and the server roles (docs/design/multiplayer-2026-09-28.md, R10)."

[dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
hex = "0.4"
hkdf = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
iroh = "1.3.0"
iroh-dns = "1.3.0"
iroh-dns-server = "1.3.0"
iroh-mdns-address-lookup = "0.6.0"
iroh-relay = { version = "1.3.0", features = ["server"] }
rand = "0.10"
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-rustls-acme = "0.9"
tokio-stream = "0.1"
url = "2"

[dev-dependencies]
rcgen = "0.14"

[profile.release]
strip = true
lto = "thin"
