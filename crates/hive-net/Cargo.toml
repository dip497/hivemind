[package]
name = "hive-net"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
rust-version = "1.91"
description = "hivemind's network: an iroh endpoint on this machine's device key, and the server roles (docs/design/multiplayer-2026-09-28.md, R10)."

[dependencies]
anyhow = "1"
hex = "0.4"
iroh = "1.3.0"
iroh-mdns-address-lookup = "0.6.0"
iroh-relay = { version = "1.3.0", features = ["server"] }
rand = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time"] }

[dev-dependencies]
serde_json = "1"

[profile.release]
strip = true
lto = "thin"
