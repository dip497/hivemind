[package]
name = "hive-net"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
rust-version = "1.91"
description = "hivemind's network: an iroh endpoint on this machine's device key, and the server roles (docs/design/multiplayer-2026-09-28.md, R10)."

[dependencies]
anyhow = "1"
base64 = "0.23"
bytes = "1"
hex = "0.4"
hkdf = "0.13"
http-body-util = { version = "0.1", optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
hyper-util = { version = "0.1", features = ["tokio", "server"], optional = true }
iroh = "1.3.0"
iroh-dns = "1.3.0"
iroh-dns-server = { version = "1.3.0", optional = true }
iroh-mdns-address-lookup = "0.6.0"
iroh-relay = { version = "1.3.0", features = ["server"], optional = true }
rand = "0.10"
ring = "0.17"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "time", "net", "io-util", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"], optional = true }
tokio-rustls-acme = { version = "0.9", optional = true }
tokio-stream = "0.1"
url = "2"

[features]
default = ["server"]
# The server roles anyone can run for their own devices (§13.4): the relay, lookup, access and push
# roles, and the `hive-net` command that serves them. A phone links none of them.
server = [
    "dep:http-body-util",
    "dep:hyper",
    "dep:hyper-util",
    "dep:iroh-dns-server",
    "dep:iroh-relay",
    "dep:tokio-rustls",
    "dep:tokio-rustls-acme",
    "reqwest/http2",
]

[[bin]]
name = "hive-net"
path = "src/main.rs"
required-features = ["server"]

# Each drives the `hive-net` command, a server's.
[[test]]
name = "access"
path = "tests/access.rs"
required-features = ["server"]

[[test]]
name = "cli"
path = "tests/cli.rs"
required-features = ["server"]

[[test]]
name = "daemon"
path = "tests/daemon.rs"
required-features = ["server"]

[[test]]
name = "lookup"
path = "tests/lookup.rs"
required-features = ["server"]

[[test]]
name = "profile"
path = "tests/profile.rs"
required-features = ["server"]

[[test]]
name = "push"
path = "tests/push.rs"
required-features = ["server"]

[[test]]
name = "relays-apart"
path = "tests/relays-apart.rs"
required-features = ["server"]

[[test]]
name = "serve"
path = "tests/serve.rs"
required-features = ["server"]

[dev-dependencies]
rcgen = "0.14"

[profile.release]
strip = true
lto = "thin"
