[package]
name = "hive-phone"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
rust-version = "1.91"
description = "hivemind's phone, its core in Rust (docs/design/multiplayer-2026-09-28.md §9.3): what the phone app links, and `hive-phone`, which does in a terminal what the phone does."

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
hive-net = { path = "../hive-net" }
hmac = "0.13"
iroh = "1.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[profile.release]
strip = true
lto = "thin"
