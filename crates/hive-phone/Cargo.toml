[package]
name = "hive-phone"
version = "0.1.0"
edition = "2021"
publish = false
license = "MIT"
rust-version = "1.91"
description = "hivemind's phone, its core in Rust (docs/design/multiplayer-2026-09-28.md §9.3): what the phone app links, and `hive-phone`, which does in a terminal what the phone does."

[dependencies]
aes-gcm = "0.10"
# The VT emulator a watched terminal's bytes run through (Zed's): its grid, without its pty.
alacritty_terminal = { version = "0.26", default-features = false }
anyhow = "1"
base64 = "0.22"
hex = "0.4"
# Its own side of the network alone: none of the server roles, which a phone never runs.
hive-net = { path = "../hive-net", default-features = false }
hmac = "0.13"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server"] }
iroh = "1.3.0"
p256 = { version = "0.13", features = ["ecdh"] }
rand = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "net", "signal", "sync", "io-std", "io-util"] }

[dev-dependencies]
# The push role, run in a test as a network's server would.
hive-net = { path = "../hive-net" }

[profile.release]
strip = true
lto = "thin"
